# pnpm workspace root for WaveHouse.
#
# Three TypeScript packages live in this repo:
#   - clients/ts        — @wavehouse/sdk (the SDK we publish to npm)
#   - tests/e2e/sdk     — wavehouse-e2e (E2E suite that exercises the SDK)
#   - docs              — wavehouse-docs (Astro Starlight site)

packages:
  - "clients/ts"
  - "tests/e2e/sdk"
  - "docs"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAge: 10080

# Exempt our own first-party packages from the release-age cooldown above. The
# cooldown is a supply-chain defense against compromised third-party releases;
# packages we publish ourselves (the @wave-rf/* scope) are trusted immediately,
# and gating them would block consuming a freshly tagged release for 7 days.
minimumReleaseAgeExclude:
  - "@wave-rf/*"

# Fail an install when the active Node doesn't satisfy a package's engines.node.
# The published SDK (clients/ts) declares ">=18" for external consumers; the
# root, e2e, and docs packages require ">=22" — the dev/CI version pinned in .nvmrc.
engineStrict: true

catalog:
  typescript: "^6.0.3"
  vitest: "^4.1.9"
  "@types/node": "^25.9.1"
