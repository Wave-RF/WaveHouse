# WaveHouse config for the e2e harness (scripts/orchestrator + tests/e2e).
#
# Dynamic values — ClickHouse addr/HTTP port (testcontainer), WaveHouse
# server port (free port), WH_DATA_DIR (per-run scratch) — are injected by
# the orchestrator via env vars. Everything below is pinned here so the
# rig config is visible and editable without recompiling Go.

# JWT validation. The suite signs test tokens with this fixed dev secret;
# don't reuse outside the e2e rig. role_claim / jwks_url live in
# settings/config.json.
auth:
  jwt_secret: sdk-dev-secret
  # operator_key: "" # non-JWT full-access operator credential (Authorization: Operator, or X-Operator-Key); unset in the rig


# Tenant tunables (schema refresh_interval 5s so schema-discovery tests don't
# wait a minute; dedupe enabled + id_field; DLQ on; CORS "*"; a 1 GiB NATS
# stream budget so the testcontainer stays tiny), the policy, and the pipes
# live in the settings directory — see settings/. Resolved relative to
# wavehouse-cov's cwd, which the orchestrator pins to the repo root.

settings:
  dir: tests/e2e/fixtures/settings

# OTel on so the export branches get coverage. The endpoint is set by the
# orchestrator (scripts/orchestrator) via OTEL_EXPORTER_OTLP_ENDPOINT, default
# http://127.0.0.1:4317 — there's no otel.addr key anymore. gRPC exporters init
# lazily, so with no collector on :4317 the suite is unaffected; with a
# `make obs-*` dashboard running it feeds that UI.
otel:
  enabled: true
