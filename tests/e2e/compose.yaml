# Integration Test Environment
#
# Single source of truth for ClickHouse + WaveHouse.
# Used by `make dev`, `make test-e2e`, and SDK integration tests.
#
# ClickHouse always starts. WaveHouse only starts with `--profile app`:
#   docker compose -f tests/compose.yaml up -d                   # ClickHouse only
#   docker compose -f tests/compose.yaml --profile app up -d     # ClickHouse + WaveHouse
#
# Override WaveHouse image (skip Go build):
#   WAVEHOUSE_IMAGE=ghcr.io/wave-rf/wavehouse:dev docker compose ...

name: wavehouse-test

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  wavehouse:
    profiles: [app]
    image: ${WAVEHOUSE_IMAGE:-}
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      WH_CH_ADDR: clickhouse:9000
      WH_DATA_DIR: /app/data
      WH_MQ_MAX_BYTES_GB: "1"
      # No auth on/off switch: the secret lets tokens validate. Tests mint
      # admin/viewer JWTs (helpers.ts); a no/invalid-token request resolves to
      # the policy default_role.
      WH_AUTH_JWT_SECRET: sdk-dev-secret
      WH_AUTH_ROLE_CLAIM: role
      WH_DEDUPE_ENABLED: "true"
      WH_DEDUPE_ID_FIELD: "event_id"
      WH_SCHEMA_REFRESH_INTERVAL: "5"
      WH_DLQ_ENABLED: "true"
      WH_SERVER_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - wavehouse-data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  clickhouse-data:
  wavehouse-data:
