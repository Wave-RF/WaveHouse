<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0B0E"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#06B0BF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06B0BF" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle accent grid; reads as faint scaffolding under the type. -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B0BF" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background stack: gradient → grid → corner glow. -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Mark — clickwave geometry spliced in by scripts/branding/generate.sh
       (`currentColor` substituted for the OG-card brand color). Scaled 1.6×
       so the 100-unit mark renders 160 px and reads alongside the 130 px
       wordmark sitting to its right. Translate puts the mark's top-left at
       (120, 130) so its visual center lands near y=210, lined up with the
       wordmark cap height. -->
  <g transform="translate(120 130) scale(1.6)">
    __MARK_GROUP__
  </g>

  <!-- Wordmark + ClickHouse-highlighted tagline live in the left two-thirds;
       the right third stays clean so the radial glow can read. -->
  <text x="300" y="245" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="130" font-weight="700" fill="#F1F3F7" letter-spacing="-3">WaveHouse</text>

  <!-- Multi-line tagline. SVG `<text>` doesn't auto-wrap, so we pre-break
       on tspan dy. ClickHouse is highlighted in the dark-mode accent to
       echo the "for ClickHouse" relationship visually. -->
  <text x="120" y="390" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="400" fill="#9CA3AF">
    <tspan x="120" dy="0">The open-source real-time API gateway for <tspan fill="#06B0BF" font-weight="500">ClickHouse</tspan></tspan>
    <tspan x="120" dy="58">— schema-aware ingest, async batching, real-time</tspan>
    <tspan x="120" dy="58">streaming.</tspan>
  </text>

  <!-- Footer row: identity attribution on the left, URL on the right.
       The URL doubles as a CTA when the card surfaces in Twitter / Slack /
       LinkedIn previews. -->
  <text x="120" y="580" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="400" fill="#6B7280">A Wave RF open-source project</text>
  <text x="1080" y="580" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="22" font-weight="500" fill="#06B0BF" text-anchor="end">wavehouse.dev</text>
</svg>
