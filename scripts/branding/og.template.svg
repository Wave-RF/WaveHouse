<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0B0E"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#06B0BF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06B0BF" stop-opacity="0"/>
    </radialGradient>
    <!-- Accent-tinted scaffolding grid. Visible enough to read as structure
         without competing with the wordmark / tagline. -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B0BF" stroke-width="0.75" stroke-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Background stack: gradient → grid → corner glow. -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Mark + wordmark form a single lockup. Both visual centers sit on the
       same y axis (212) and the mark's visual height is tuned to match the
       wordmark's cap height so they read as one unit, not two stacked pieces.

       Mark math: source mark.svg has visible content from y=11 to y=89
       (waves + round-stroke caps), span 78 units. At scale 1.45 that's
       113 px visual height. Translate origin = 212 (target center) − 50×1.45
       (half the mark's 100-unit viewBox) = 139.5.

       Wordmark math: Inter 140 px, font-weight 700. No descenders in
       "WaveHouse", so visual height = cap height ≈ 71% × 140 = 99.4 px
       (within ~12% of the mark's 113 px). Baseline = 212 + 99.4/2 ≈ 262. -->
  <g transform="translate(120 139.5) scale(1.45)">
    __MARK_GROUP__
  </g>

  <text x="300" y="262" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="140" font-weight="700" fill="#F1F3F7" letter-spacing="-3">WaveHouse</text>

  <!-- Two-line tagline. Matches the landing-page hero's two-sentence
       cadence: the value-prop sentence + the capability roll-up sentence.
       SVG <text> doesn't auto-wrap; lines are pre-broken via tspan dy.
       ClickHouse is highlighted in the dark-mode accent color to echo the
       for-ClickHouse relationship visually. -->
  <text x="120" y="400" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="400" fill="#9CA3AF">
    <tspan x="120" dy="0">The open-source real-time API gateway for <tspan fill="#06B0BF" font-weight="500">ClickHouse</tspan>.</tspan>
    <tspan x="120" dy="60">Schema-aware ingest, async batching, real-time streaming.</tspan>
  </text>

  <!-- Footer row: identity attribution on the left, URL on the right.
       Sized to read at a glance in Twitter / Slack / LinkedIn link
       previews (the URL doubles as a CTA). -->
  <text x="120" y="580" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="400" fill="#9CA3AF">A Wave RF open-source project</text>
  <text x="1080" y="580" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#06B0BF" text-anchor="end">wavehouse.dev</text>
</svg>
