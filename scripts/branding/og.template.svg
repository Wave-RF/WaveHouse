<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0B0E"/>
      <stop offset="1" stop-color="#14171C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#06B0BF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06B0BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background + accent glow in upper-right -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- subtle horizontal waves at the bottom -->
  <g fill="none" stroke="#06B0BF" stroke-width="3" stroke-linecap="round" opacity="0.12">
    <path d="M-20 560 C 120 500, 220 620, 360 560 S 600 500, 740 560 S 980 620, 1220 560"/>
    <path d="M-20 595 C 120 535, 220 655, 360 595 S 600 535, 740 595 S 980 655, 1220 595"/>
  </g>

  <!-- Mark — the contents of scripts/branding/mark.svg are spliced in here
       by scripts/branding/generate.sh, with currentColor substituted for the
       OG-card mark color. Scaled 1.6x so the (100-unit) mark renders 160 px,
       sized to read alongside the 140 px wordmark rather than overpower it. -->
  <g transform="translate(220 190) scale(1.6)">
    __MARK_GROUP__
  </g>

  <text x="400" y="320" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="140" font-weight="700" fill="#F1F3F7" letter-spacing="-3">WaveHouse</text>

  <text x="600" y="450" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="36" font-weight="400" fill="#9CA3AF" text-anchor="middle">
    The open-source real-time API gateway for ClickHouse
  </text>

  <text x="600" y="520" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="24" font-weight="500" fill="#06B0BF" text-anchor="middle" letter-spacing="2">
    SCHEMA-AWARE INGEST  ·  ASYNC BATCHING  ·  REAL-TIME STREAMING  ·  TIERED CACHING
  </text>
</svg>
