# Project config — committed; per-user overrides in ~/.config/worktrunk/config.toml.
# `.worktreeinclude` (repo root) controls which gitignored paths get seeded.

# Ordered steps: install after the copy, or the copy brings back main's old node_modules layout.
[[post-start]]
copy-caches = "wt step copy-ignored"

[[post-start]]
tools = "make tools"

[pre-merge]
verify = "make verify"

[pre-remove]
status = "git status --short"
