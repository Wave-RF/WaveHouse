version: 2

# ─────────────────────────────────────────────────────────────────────────────
# GoReleaser is now ONLY the compiler. It is invoked once per native runner as
# `goreleaser build --single-target`, and everything downstream of the binary —
# archives, checksums, the GitHub Release, the multi-arch GHCR image — is done
# by .github/workflows/release.yml. This file therefore contains `builds:` and
# nothing else.
#
# Why, measured rather than assumed (2026-09-16, this tree at the cgo switch):
#
#   cgo means each target needs a C toolchain that can target that OS/ABI, and
#   for darwin that means real Apple SDK headers. In golang:1.27-bookworm
#   (linux/amd64 — the shape of `ubuntu-latest`):
#
#     linux/amd64, ambient gcc 12.2              OK   44,931,216 B  max GLIBC_2.34
#     linux/arm64, apt gcc-aarch64-linux-gnu     OK   41,400,592 B  max GLIBC_2.34
#     linux/arm64, zig cc aarch64-linux-gnu.2.17 OK   51,094,216 B  max GLIBC_2.17,
#                                                but NEEDED libresolv/libdl/
#                                                libpthread and `-s` ignored
#     darwin/arm64, zig cc -target aarch64-macos FAILS, with AND without
#                                                `-tags netgo,osusergo`:
#
#       # github.com/prometheus/client_golang/prometheus
#       process_collector_mem_cgo_darwin.c:18:10: fatal error:
#           'mach/mach_vm.h' file not found
#
#   That is a *compile* failure inside a dependency's own C file, not the
#   `-lresolv` *link* failure recorded earlier — netgo/osusergo cannot help,
#   because the build never reaches the linker. client_golang's darwin process
#   collector switches on `cgo` with no opt-out tag, and zig ships no Mach
#   headers. Supplying them needs an Apple SDK, which cannot be fetched on a
#   GitHub-hosted Linux runner. So: no darwin cross-compile, at all.
#
#   The two GoReleaser features that solve this natively — split/merge
#   (`goreleaser continue --merge`) and `builder: prebuilt` — are Pro-only, and
#   `goreleaser release --skip=` accepts no `build` value in OSS (checked
#   against v2.18.1, whose accepted set is announce, archive, aur, aur-source,
#   before, chocolatey, docker, flatpak, homebrew, iru, ko, makeself, mcp,
#   nfpm, nix, notarize, publish, sbom, scoop, sign, snapcraft, srpm, validate,
#   winget). There is therefore no OSS way to have GoReleaser assemble a
#   release from binaries built elsewhere — hence the split above.
# ─────────────────────────────────────────────────────────────────────────────

# GoReleaser defaults ProjectName to the repo directory name — "WaveHouse" —
# which is the only place the product's display casing leaked into an artifact
# identifier: archives built as `WaveHouse_linux_amd64.tar.gz` while the binary
# inside, the GHCR image, and the npm package are all lowercase `wavehouse`.
# Asset URLs are permanent once a release is published, so this is pinned
# rather than inherited. release.yml names its archives from this same value.
project_name: wavehouse

# GoReleaser's tag detection — which tag it is building from — walks git
# history without caring which tag family it lands on. This repo has several:
# `v*` for the server and `clients/<lang>/v*` for each client SDK. Without
# this, a snapshot build cut after an SDK release stamps itself from
# `clients/ts/v0.1.0`. release.yml applies the same rule to the release notes
# by deriving `--notes-start-tag` from `git describe --match 'v*'`.
git:
  ignore_tags:
    - "clients/*"

builds:
  - id: wavehouse
    main: ./cmd/wavehouse
    binary: wavehouse
    # cgo is unconditional: the chtypes binding dlopens the per-version
    # artifact, so CGO_ENABLED=1 on every target (dlfcn only — no C library
    # linked, no header). The platform set follows from that artifact, not
    # from Go: Windows and FreeBSD are dropped
    # (chtypes publishes no artifact for either) along with darwin/amd64 (no
    # artifact either — only darwin-arm64, linux-amd64, linux-arm64 exist at
    # https://artifacts.wavehouse.dev/artifacts/index.json). goos x goarch is
    # a cross product, hence the explicit `ignore` to drop darwin/amd64
    # rather than a matrix that only ever had one cell per OS.
    env:
      - CGO_ENABLED=1
    # `--single-target` builds the runner's own GOOS/GOARCH *regardless of what
    # is set here*, so on the release path these three keys are a declaration
    # rather than a driver: they are the supported set, and the `build`
    # matrices in release.yml / publish-dev.yml / goreleaser-validate.yml must
    # mirror them. Keep them accurate — `goreleaser check` validates this
    # file's schema, nothing validates that a workflow matrix agrees with it,
    # and a plain `goreleaser build` with no flag would still try (and fail) to
    # cross-compile all three.
    #
    # There are deliberately NO `overrides:` with CC/CXX any more: every target
    # is compiled by a native toolchain on its own runner, so the ambient `cc`
    # is always the right one.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}
