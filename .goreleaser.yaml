version: 2

builds:
  - id: wavehouse
    main: ./cmd/wavehouse
    binary: wavehouse
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Binary=standalone
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}

  - id: wavehouse-api
    main: ./cmd/wavehouse-api
    binary: wavehouse-api
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Binary=clustered-api
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}

  - id: wavehouse-worker
    main: ./cmd/wavehouse-worker
    binary: wavehouse-worker
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Binary=clustered-worker
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}

checksum:
  name_template: "checksums.txt"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

dockers_v2:
  - dockerfile: deployments/Dockerfile.goreleaser
    ids:
      - wavehouse
      - wavehouse-api
      - wavehouse-worker
    images:
      - "ghcr.io/wave-rf/wavehouse"
    tags:
      - "{{ .Tag }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": "WaveHouse"
      "org.opencontainers.image.description": "Schema-aware real-time API gateway for ClickHouse"
      "org.opencontainers.image.url": "https://github.com/Wave-RF/WaveHouse"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"

changelog:
  sort: asc
  use: git
  filters:
    exclude:
      - '^docs:'
      - '^test:'
