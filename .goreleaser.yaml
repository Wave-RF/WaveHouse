version: 2

# GoReleaser defaults ProjectName to the repo directory name — "WaveHouse" —
# which is the only place the product's display casing leaked into an artifact
# identifier: archives built as `WaveHouse_linux_amd64.tar.gz` while the binary
# inside, the GHCR image, and the npm package are all lowercase `wavehouse`.
# Asset URLs are permanent once a release is published, so this is pinned
# rather than inherited.
project_name: wavehouse

builds:
  - id: wavehouse
    main: ./cmd/wavehouse
    binary: wavehouse
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.BuildTime={{.Date}}
      - -X main.GitCommit={{.ShortCommit}}

checksum:
  name_template: "checksums.txt"

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    # Windows gets .zip; everything else keeps GoReleaser's tar.gz default.
    # Windows has shipped bsdtar since 10 1803, so a .tar.gz is *openable* —
    # but not from Explorer, which still only double-clicks into .zip. The
    # convention costs nothing and this is the first release whose asset
    # names people will script against.
    format_overrides:
      - goos: windows
        formats: [zip]
    # Narrowed from GoReleaser's default, which also globs CHANGELOG* — 324 KB
    # of development history in every one of the eight archives, for a file
    # that is a click away on GitHub and whose contents are the release notes
    # the download page already shows.
    files:
      - LICENSE*
      - README*

# Suppress the GitHub Release on dev pushes. publish-dev.yml sets
# WAVEHOUSE_DEV=1 + a synthetic tag so it can reuse this same pipeline;
# we don't want a release entry on the repo for every push to main.
# Real tag releases (release.yml) leave WAVEHOUSE_DEV unset → defaults
# to "0" → the field evaluates to "false" → release runs normally.
# `envOrDefault` is required because goreleaser templates fail strict
# on missing env vars; bare `.Env.WAVEHOUSE_DEV` would error on the
# release path.
release:
  disable: '{{ eq (envOrDefault "WAVEHOUSE_DEV" "0") "1" }}'
  # `auto` marks the GitHub Release as a pre-release whenever the tag
  # carries a prerelease identifier (v0.1.0-alpha.1 → yes; v0.1.0 → no).
  # GoReleaser's default is a flat `false`, which would have published the
  # first alpha as a full stable release — and GitHub's "Latest release"
  # badge keys off exactly this field.
  prerelease: auto

dockers_v2:
  - dockerfile: deployments/Dockerfile.goreleaser
    ids:
      - wavehouse
    images:
      - "ghcr.io/wave-rf/wavehouse"
    # Every build gets an immutable reference plus one moving pointer.
    #
    #   immutable  release: :{{ .Tag }} (e.g. :v1.2.3)
    #              dev:     :dev-<full sha>   (matches cleanup-ghcr.yml's
    #                                          `^dev-[0-9a-f]+$` regex)
    #   moving     release: the channel release.yml derived from the tag via
    #                       scripts/ci/release-channel.sh — :latest for a
    #                       stable tag, :alpha/:beta/:rc/:next for a
    #                       prerelease
    #              dev:     :dev (rolling, follows main)
    #
    # The channel indirection is why `v1.3.0-rc.1` can't take :latest away
    # from a shipped `v1.2.0`. The dev branch stays an explicit literal
    # rather than leaning on WAVEHOUSE_CHANNEL's default: a push to main that
    # forgot to set the env var must never be able to publish :latest.
    tags:
      - '{{ if eq (envOrDefault "WAVEHOUSE_DEV" "0") "1" }}dev-{{ .FullCommit }}{{ else }}{{ .Tag }}{{ end }}'
      - '{{ if eq (envOrDefault "WAVEHOUSE_DEV" "0") "1" }}dev{{ else }}{{ envOrDefault "WAVEHOUSE_CHANNEL" "latest" }}{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.title": '{{ if eq (envOrDefault "WAVEHOUSE_DEV" "0") "1" }}WaveHouse (dev){{ else }}WaveHouse{{ end }}'
      "org.opencontainers.image.description": '{{ if eq (envOrDefault "WAVEHOUSE_DEV" "0") "1" }}Schema-aware real-time API gateway for ClickHouse — rolling dev build from main{{ else }}Schema-aware real-time API gateway for ClickHouse{{ end }}'
      "org.opencontainers.image.url": "https://github.com/Wave-RF/WaveHouse"
      "org.opencontainers.image.source": "{{ .GitURL }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.created": "{{ .Date }}"

changelog:
  # Delegate the release body to GitHub's own "generate release notes" — the
  # grouped, linked, per-PR list you get from the Releases UI button, with
  # authors and a New Contributors section. `use: git` built the body from raw
  # commit subjects instead: nearly the same content (main is squash-merged, so
  # each subject IS a PR title) but no links, no authors, and no grouping.
  #
  # Categorization and exclusions move to .github/release.yml with this. The
  # `sort` and `filters` keys that used to live here are gone rather than left
  # in place: github-native renders the body on GitHub's side, so GoReleaser
  # never sees the commits and both would be silently dead config.
  use: github-native
