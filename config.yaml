mode: standalone

server:
  port: 8080
  shutdown_timeout: 10

clickhouse:
  addr: localhost:9000
  http_port: 8123
  database: default
  username: default
  password: ""

mq:
  embedded_dir: ./data/nats
  url: nats://localhost:4222
  gap_window_minutes: 15
  max_bytes_gb: 50

dedupe:
  enabled: false
  id_field: event_id
  embedded_dir: ./data/pebble
  scylla_hosts:
    - localhost:9042
  scylla_keyspace: wavehouse

cache:
  l1_max_cost: 67108864
  redis_url: redis://localhost:6379
  default_ttl: 300
  timestamp_bucket_seconds: 60

auth:
  enabled: false
  jwt_secret: change-me-in-production
  jwks_url: ""
  role_claim: role
  dev_mode: false

schema:
  refresh_interval: 60

dlq:
  enabled: true

policy:
  file_path: ""

pipes:
  directory: ""
