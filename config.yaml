# This file is strict, and so is the environment: a key the server doesn't
# declare (a typo, or a tunable that moved to the settings directory) refuses
# to boot and is named — whether it arrives as a YAML key here or as a WH_*
# variable no key binds.
# Root for embedded state. NATS lives at <data_dir>/nats; Pebble, holding every
# tenant's dedupe store while any tenant has dedupe enabled, at
# <data_dir>/pebble. In a container, this MUST be on a host-backed volume —
# the relative default is for local binary use only.
data_dir: ./data

# The work this process runs; every role by default. A split (one Deployment
# per role) needs mq.backend: nats and, wherever ingest runs,
# coord.backend: nats (there is no sweeper under nats); separate api and ingest processes also need
# cache.backend: redis. Boot refuses a split the backends cannot serve.
roles: [api, ingest, sweeper]
# Names this process: logged at boot, and a lease's holder under
# coord.backend: nats. Empty means <hostname>-<8 hex>, fresh at every boot.
instance_id: ""

server:
  port: 8080
  # Drain budget for a stop (in-flight requests and ingest batches). The
  # release of the stores (5s) and the telemetry flush (3s) are fixed on
  # top, so size the kill grace at this plus 8s.
  shutdown_timeout: 10

otel:
  enabled: false         # master switch — set true to export via OTLP gRPC
  # Endpoint, TLS, custom CA, mTLS, and auth headers come from the standard
  # OTEL_EXPORTER_OTLP_* env vars (OTEL_EXPORTER_OTLP_ENDPOINT=https://host:port,
  # OTEL_EXPORTER_OTLP_HEADERS=x-honeycomb-team=KEY), read by the OTel SDK.
  traces:
    enabled: true
    sample_rate: 1.0     # head-based, [0.0, 1.0]; tune down for high QPS
  metrics:
    enabled: true        # OTLP push for metrics
  logs:
    enabled: true
    sample_rate: 1.0     # DEBUG/INFO OTLP rate; WARN+ always 100%, stdout always 100%

# Prometheus exposition is independent of OTel — works on its own (Alloy /
# Mimir scrape, no collector) or alongside OTLP push.
prometheus:
  enabled: false
  path: /metrics
  port: 0                # 0 = mount on server.port; non-zero = sidecar listener

# Only the password, the connection ceiling and the chtypes artifact keys are
# boot config; addr, http_port, http_scheme, database, username,
# query_timeout, tls, headers and the pool sizes are the settings directory's
# clickhouse block.
clickhouse:
  password: ""
  max_total_conns: 0 # ceiling on open native connections across pools; 0 = none
  # chtypes v1 cache (CHTYPES_CACHE semantics: the layout itself, as
  # `chtypes fetch --cache <dir>` writes it), read by api-role processes only.
  # Empty (the default) is $CHTYPES_CACHE, else ~/.cache/chtypes/v1; the
  # read-only system directories /usr/local/share/chtypes/v1 and
  # /opt/chtypes/v1 are searched after it.
  chtypes_cache: ""
  # Fetch a ClickHouse line no directory holds when its first tenant binds
  # (the line's newest signed build, into chtypes_cache). false for an
  # air-gapped deployment, which then needs the artifacts installed.
  chtypes_autofetch: true
  # Registries/mirrors a fetch tries in order, comma-separated (a mirror or
  # pull-through proxy). Empty is $CHTYPES_ARTIFACTS_URL, else chtypes' own.
  chtypes_artifacts_url: ""

# Each layer's implementation, chosen at boot. Every layer defaults to its
# in-process backend; mq and coord also take nats, cache redis, dedupe dynamodb.
mq:
  backend: embedded # NATS JetStream under <data_dir>/nats
  # backend: nats reads this block instead: the operator's NATS JetStream
  # (see the deployment guide's "External NATS" section).
  # nats:
  #   urls: ["nats://localhost:4222"]
  #   user: wavehouse
  #   password_file: ./nats-password
  #   partitions: 4
  #   shards: 8 # must match the generated manifests (default 32)
dedupe:
  backend: pebble # Pebble under <data_dir>/pebble; or dynamodb (below)
  lease: 30s # how long a claimed id stays pending; at most 59s with the embedded mq (lease + ceil(lease) + 1s within its 2m duplicate window)
  reserve_concurrency: 64 # parallel calls per Reserve/Commit/Release to a remote backend, and DynamoDB's idle connections per host; ingest sends a window of up to 256 ids per call
  # dynamodb: # read only when backend is dynamodb; credentials from the AWS SDK chain
  #   table: wavehouse-dedupe-prod
  #   region: "" # empty = AWS_REGION
  #   endpoint: "" # dynamodb-local only
  #   timeout: 250ms
  #   max_attempts: 3
  #   retry_mode: standard # or adaptive
  #   create_table: false # dynamodb-local only; refused without endpoint
coord:
  backend: local # leases held in this process
  # backend: nats holds them in a KV bucket on mq.nats's connection instead,
  # and mq.backend: nats requires it in a process running ingest.
  # nats:
  #   bucket: wh_coord # empty = <mq.nats.subject_prefix>_coord

# The query-result cache: local (in-process, sized by l1_max_cost) or redis
# (one Redis-compatible server shared by every instance; see the redis block
# below and the Configuration page for every key). The query time-bucket
# (query.timestamp_bucket_seconds) is a settings key.
cache:
  backend: local
  l1_max_cost: 67108864
  # redis:                     # read only with backend: redis
  #   addrs: ["localhost:6379"] # `docker compose -f deployments/compose/dependencies.yaml --profile redis up -d`
  #   key_prefix: wh
  #   timeout: 100ms           # per operation; slower is a miss, never a failed query
  # The password is a secret: WH_CACHE_REDIS_PASSWORD, not this file.

# Auth has no on/off switch — the JWT middleware always runs. A request with no
# token, or an invalid/expired one, falls back to the policy default_role;
# elevated access needs a valid token whose role_claim matches a granted role
# (or the policy admin_role). With neither jwt_secret (here) nor jwks_url (a
# settings key, with role_claim) set, no token can validate, so every request
# is the default_role — a pure public deployment. Only the secrets live here.
auth:
  jwt_secret: change-me-in-production
  operator_key: "" # non-JWT full-access operator credential (Authorization: Operator <key>, or X-Operator-Key) for break-glass; empty disables

# Settings directory (REQUIRED): roles.json, policies.json, pipes.json,
# config.json. The behavioral configuration lives in its config.json —
# clickhouse wiring (addr, http_port, http_scheme, database, username,
# query_timeout, tls, headers, max_open_conns, max_idle_conns), auth
# (jwks_url, role_claim), dedupe (enabled/id_field/
# require_id/retention + per-table overrides), dlq.enabled (+ per table),
# query.default_max_rows / timestamp_bucket_seconds,
# schema.refresh_interval, stream keepalive_interval / keepalive_buckets /
# gap_window_minutes, mq.max_bytes_gb, cors.allowed_origins — and every key
# is required except dedupe.retention (missing = "0", forever): the binary
# has no other compiled default, so what's adopted is exactly what the
# files say. The server validates the directory at boot (invalid or missing
# refuses to start) and reloads it on SIGHUP, on file change, or via
# POST /v1/ops/settings/reload; a reload that fails validation keeps the
# previous settings. `wavehouse bootstrap [dir]` writes a starter
# directory with every key at its default; `wavehouse validate [dir]` checks
# one (both resolve dir the same way: the argument, else WH_SETTINGS_DIR).
# `make dev` seeds ./settings (gitignored) from the embedded seed on first
# run, so local edits never touch the checked-in internal/settings/seed.
settings:
  dir: settings
