# Root for embedded state. NATS lives at <data_dir>/nats; Pebble (when dedupe
# is enabled) lives at <data_dir>/pebble. In a container, this MUST be on a
# host-backed volume — the relative default is for local binary use only.
data_dir: ./data

server:
  port: 8080
  shutdown_timeout: 10
  # CORS allowlist. "*" allows any browser origin; this is fine in dev because
  # WaveHouse is a Bearer-token API (no cookies, no credentials mode — see
  # internal/api/router.go corsMiddleware), so cross-origin XHR can't smuggle
  # auth. In production with a known frontend domain, replace "*" with the
  # explicit list, e.g.:
  #   cors_allowed_origins:
  #     - "https://dashboard.wavehouse.example"
  #     - "http://localhost:3000"   # local frontend dev server
  cors_allowed_origins:
    - "*"

otel:
  enabled: false         # master switch — set true to export via OTLP gRPC
  # Endpoint, TLS, custom CA, mTLS, and auth headers come from the standard
  # OTEL_EXPORTER_OTLP_* env vars (OTEL_EXPORTER_OTLP_ENDPOINT=https://host:port,
  # OTEL_EXPORTER_OTLP_HEADERS=x-honeycomb-team=KEY), read by the OTel SDK.
  traces:
    enabled: true
    sample_rate: 1.0     # head-based, [0.0, 1.0]; tune down for high QPS
  metrics:
    enabled: true        # OTLP push for metrics
  logs:
    enabled: true
    sample_rate: 1.0     # DEBUG/INFO OTLP rate; WARN+ always 100%, stdout always 100%

# Prometheus exposition is independent of OTel — works on its own (Alloy /
# Mimir scrape, no collector) or alongside OTLP push.
prometheus:
  enabled: false
  path: /metrics
  port: 0                # 0 = mount on server.port; non-zero = sidecar listener

clickhouse:
  addr: localhost:9000
  http_port: 8123
  http_scheme: http
  database: default
  username: default
  password: ""
  query_timeout: 30s

# Query-shaping defaults. Server-wide RESOURCE limits (memory, rows scanned,
# execution time) live in ClickHouse itself — its settings profiles and quotas
# — so they apply to every query uniformly; see docs/configuration. This block
# holds only the result-LIMIT default.
query:
  default_max_rows: 10000          # fallback result LIMIT (<=0 falls back to 10000)

# Server-Sent Events keepalive for GET /v1/stream. A shared ticker pushes a ":"
# comment to idle streams so they survive reverse-proxy/tunnel idle timeouts.
# keepalive_interval is the effective per-connection period; keep it under your
# proxy's idle window (30s clears the common 55-60s nginx/ALB/Heroku timeouts).
# See docs/reverse-proxy for per-provider timeout values.
stream:
  keepalive_interval: 30s          # max idle time before a keepalive (0 falls back to 30s)
  keepalive_buckets: 3             # spread writes across N buckets (advanced; 0 falls back to 3)

mq:
  gap_window_minutes: 15
  max_bytes_gb: 50

dedupe:
  enabled: false
  id_field: event_id
  # Reject rows missing id_field instead of publishing them un-deduped. Off by
  # default (they are logged + counted via wavehouse_ingest_dedupe_missing_id_total).
  require_id: false

cache:
  l1_max_cost: 67108864
  timestamp_bucket_seconds: 60

# Auth has no on/off switch — the JWT middleware always runs. A request with no
# token, or an invalid/expired one, falls back to the policy default_role;
# elevated access needs a valid token whose role_claim matches a granted role
# (or the policy admin_role). With neither jwt_secret nor jwks_url set, no token
# can validate, so every request is the default_role — a pure public deployment.
auth:
  jwt_secret: change-me-in-production
  jwks_url: ""
  role_claim: role
  operator_key: "" # non-JWT full-access operator credential (X-Operator-Key header) for bootstrap/break-glass; empty disables

schema:
  refresh_interval: 60

dlq:
  enabled: true


# Optional bootstrap source for named query pipes. When set, .sql files in
# this directory are loaded into the NATS KV pipe store on startup. Empty
# default skips bootstrap. Mount read-only in containers (e.g. `:ro`) — the
# directory is a seed, not authoritative storage.
pipes:
  dir: ""
