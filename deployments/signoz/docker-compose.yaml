services:
  volume-fixer:
    image: alpine
    container_name: signoz-volume-fixer
    user: root
    volumes:
      - clickhouse_data:/mnt/ch_data
      - signoz_db:/mnt/sz_db
    command: >
      sh -c "chown -R 101:101 /mnt/ch_data && 
             chown -R 1000:1000 /mnt/sz_db && 
             echo 'Permissions fixed'"

  clickhouse:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    container_name: signoz-clickhouse
    depends_on:
      volume-fixer:
        condition: service_completed_successfully
    environment:
      - CLICKHOUSE_USER=${SIGNOZ_CH_USER:-default}
      - CLICKHOUSE_PASSWORD=${SIGNOZ_CH_PASSWORD:-password}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrator:
    image: signoz/signoz-otel-collector:latest
    container_name: signoz-migrator
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://${SIGNOZ_CH_USER:-default}:${SIGNOZ_CH_PASSWORD:-password}@clickhouse:9000
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap --clickhouse-cluster="" --clickhouse-replication=false &&
        /signoz-otel-collector migrate sync up --clickhouse-cluster="" --clickhouse-replication=false &&
        /signoz-otel-collector migrate async up --clickhouse-cluster="" --clickhouse-replication=false

  signoz:
    image: signoz/query-service:latest
    container_name: signoz
    depends_on:
      migrator:
        condition: service_completed_successfully
    ports:
      - "3301:8080"
    environment:
      - SIGNOZ_PORT=8080
      - FRONTEND_API_ENDPOINT=http://localhost:3301
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://${SIGNOZ_CH_USER:-default}:${SIGNOZ_CH_PASSWORD:-password}@clickhouse:9000
    volumes:
      - signoz_db:/var/lib/signoz

  otel-collector:
    image: signoz/signoz-otel-collector:latest
    container_name: signoz-otel-collector
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      - SIGNOZ_CH_USER=${SIGNOZ_CH_USER:-default}
      - SIGNOZ_CH_PASSWORD=${SIGNOZ_CH_PASSWORD:-password}
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
    command: ["--config=/etc/otel-collector-config.yaml"]

volumes:
  clickhouse_data:
  signoz_db:

networks:
  default:
    name: wavehouse-obs-net