# Self-contained SigNoz stack for running an OTel-native observability backend
# locally. Modelled on the upstream SigNoz `deploy/docker/docker-compose.yaml`
# (SigNoz v0.122.0 / signoz-otel-collector v0.144.3), trimmed to a single node
# and adapted to this repo's layout.
#
# Bring it up (via the Makefile wrapper, or directly):
#   make signoz-up
#   docker compose -f deployments/signoz/compose.yaml up -d
#
# UI:        http://localhost:3301   (host 3301 → container 8080; WaveHouse owns 8080)
# OTLP gRPC: localhost:4317          (point WaveHouse at it: WH_OTEL_ADDR=127.0.0.1:4317,
#                                     or host.docker.internal:4317 from another container)
# OTLP HTTP: localhost:4318
#
# Long-running services: clickhouse, zookeeper-1, signoz, otel-collector.
# One-shot init containers (normal to see them as `Exited (0)`):
#   - init-clickhouse: fetches the histogramQuantile UDF binary ClickHouse loads
#   - signoz-telemetrystore-migrator: creates the signoz_* ClickHouse schema, then exits
#
# Dev posture only — no resource limits set. For prod, add
# `deploy.resources.limits.{memory,cpus}` to clickhouse + signoz +
# otel-collector (the trace ingest path can be hungry under load).

x-common: &common
  restart: unless-stopped
  logging:
    options:
      max-size: 50m
      max-file: "3"

x-clickhouse-defaults: &clickhouse-defaults
  <<: *common
  image: clickhouse/clickhouse-server:25.5.6
  tty: true
  depends_on:
    init-clickhouse:
      condition: service_completed_successfully
    zookeeper-1:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "wget", "--spider", "-q", "0.0.0.0:8123/ping"]
    interval: 30s
    timeout: 5s
    retries: 3
  ulimits:
    nproc: 65535
    nofile:
      soft: 262144
      hard: 262144
  environment:
    - CLICKHOUSE_SKIP_USER_SETUP=1

x-db-depend: &db-depend
  <<: *common
  depends_on:
    clickhouse:
      condition: service_healthy

services:
  init-clickhouse:
    <<: *common
    image: clickhouse/clickhouse-server:25.5.6
    restart: on-failure
    command:
      - bash
      - -c
      - |
        version="v0.0.1"
        node_os=$$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-quantile binary for $${node_os}/$${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F$${version}/histogram-quantile_$${node_os}_$${node_arch}.tar.gz"
        echo "<expected-sha256>  histogram-quantile.tar.gz" | sha256sum -c -
        tar -xvzf histogram-quantile.tar.gz
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
    volumes:
      - clickhouse-scripts:/var/lib/clickhouse/user_scripts/

  zookeeper-1:
    <<: *common
    image: signoz/zookeeper:3.7.1
    user: root
    environment:
      - ZOO_SERVER_ID=1
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOO_AUTOPURGE_INTERVAL=1
      - ZOO_ENABLE_PROMETHEUS_METRICS=yes
      - ZOO_PROMETHEUS_METRICS_PORT_NUMBER=9141
    volumes:
      - zookeeper-1:/bitnami/zookeeper
    healthcheck:
      test: ["CMD-SHELL", "curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null"]
      interval: 30s
      timeout: 5s
      retries: 3

  clickhouse:
    <<: *clickhouse-defaults
    # Ports are intentionally not published — this ClickHouse is internal to
    # SigNoz. (WaveHouse has its own ClickHouse in deployments/compose/.)
    volumes:
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./clickhouse/custom-function.xml:/etc/clickhouse-server/custom-function.xml
      - ./clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml
      - clickhouse-scripts:/var/lib/clickhouse/user_scripts/
      - clickhouse:/var/lib/clickhouse/

  signoz:
    <<: *common
    # Wait for the migrator to complete — not just ClickHouse to be healthy.
    # The signoz query service reads `signoz_*` tables that the migrator
    # creates; on a cold start those tables don't exist yet, so without
    # this dep the UI boots into a confused state.
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    image: signoz/signoz:v0.122.0
    ports:
      - "3301:8080" # UI + API (8080 in the container; published on 3301 — WaveHouse owns host 8080)
    volumes:
      - sqlite:/var/lib/signoz/
    environment:
      - SIGNOZ_ALERTMANAGER_PROVIDER=signoz
      - SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_SQLSTORE_SQLITE_PATH=/var/lib/signoz/signoz.db
      # Dev-only default — this is a local-dev compose. Override with `export
      # SIGNOZ_TOKENIZER_JWT_SECRET=$(openssl rand -hex 32)` before `make
      # signoz-up` if you're repurposing this stack for anything non-local.
      - SIGNOZ_TOKENIZER_JWT_SECRET=${SIGNOZ_TOKENIZER_JWT_SECRET:-wavehouse-local-dev-only}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  otel-collector:
    <<: *common
    # Wait for the migrator to complete. The collector's entrypoint runs
    # `migrate sync check` before starting; on a cold start with no schema
    # it loops forever ("Database signoz_traces does not exist") and never
    # flips healthy — `--wait` then times out. The migrator is what creates
    # signoz_traces in the first place.
    depends_on:
      clickhouse:
        condition: service_healthy
      signoz-telemetrystore-migrator:
        condition: service_completed_successfully
    image: signoz/signoz-otel-collector:v0.144.3
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate sync check &&
        /signoz-otel-collector --config=/etc/otel-collector-config.yaml --manager-config=/etc/manager-config.yaml --copy-path=/var/tmp/collector-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
      - ./otel-collector-opamp-config.yaml:/etc/manager-config.yaml
    environment:
      - OTEL_RESOURCE_ATTRIBUTES=host.name=signoz-host,os.type=linux
      - LOW_CARDINAL_EXCEPTION_GROUPING=false
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m
    ports:
      - "4317:4317" # OTLP gRPC receiver — WaveHouse pushes here
      - "4318:4318" # OTLP HTTP receiver
    # Probes the health_check extension declared in otel-collector-config.yaml
    # (`extensions.health_check.endpoint: 0.0.0.0:13133`). The endpoint serves
    # 200 OK once the pipeline is fully built and ready to accept telemetry.
    # The signoz/signoz-otel-collector image ships without curl or wget, but
    # has bash — so we hand-roll an HTTP probe via /dev/tcp and grep the
    # status line. Port 13133 is internal (not published).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/13133 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3

  signoz-telemetrystore-migrator:
    <<: *db-depend
    image: signoz/signoz-otel-collector:v0.144.3
    restart: on-failure
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        /signoz-otel-collector migrate bootstrap &&
        /signoz-otel-collector migrate sync up &&
        /signoz-otel-collector migrate async up
    environment:
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN=tcp://clickhouse:9000
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER=cluster
      - SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION=true
      - SIGNOZ_OTEL_COLLECTOR_TIMEOUT=10m

volumes:
  clickhouse:
    name: signoz-clickhouse
  clickhouse-scripts:
    name: signoz-clickhouse-user-scripts
  sqlite:
    name: signoz-sqlite
  zookeeper-1:
    name: signoz-zookeeper-1
