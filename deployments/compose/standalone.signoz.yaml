# Override for standalone.yaml that points WaveHouse's OTLP export at the
# SigNoz collector. Usage docs: docs/src/content/docs/deployment.md.
#
# Reaches the collector via host.docker.internal — no shared Docker network.
# Joining the SigNoz stack's network breaks ClickHouse resolution: that stack
# also defines a service named `clickhouse`, so the unqualified hostname
# becomes ambiguous and WaveHouse may dial SigNoz's ClickHouse instead of
# its own.

services:
  clickhouse:
    # standalone.yaml's `depends_on: [clickhouse]` only waits for the
    # container to start, not for ClickHouse to accept connections — and
    # WaveHouse treats a failed schema-discovery on boot as fatal, so it
    # races ClickHouse and exits. Add a readiness probe so the dependency
    # below can gate on it.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  wavehouse:
    environment:
      WH_OTEL_ENABLED: "true"
      WH_OTEL_ADDR: "host.docker.internal:4317"
      # standalone.yaml leaves WH_MQ_MAX_BYTES_GB at its 50 GB default; the
      # embedded JetStream stream then asks for more disk than the default
      # OrbStack VM has free (~16 GB usable), so stream creation fails with
      # "insufficient storage resources". Cap it for local use.
      WH_MQ_MAX_BYTES_GB: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clickhouse:
        condition: service_healthy
