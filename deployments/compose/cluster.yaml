services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - beachhouse-api-1
      - beachhouse-api-2

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  nats:
    image: nats:latest
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  scylladb:
    image: scylladb/scylla:latest
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla

  beachhouse-api-1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.beachhouse-api
    environment:
      BH_MODE: clustered
      BH_CH_ADDR: clickhouse:9000
      BH_MQ_URL: nats://nats:4222
      BH_CACHE_REDIS_URL: redis://redis:6379
      BH_DEDUPE_SCYLLA_HOSTS: scylladb:9042
      BH_DEDUPE_SCYLLA_KEYSPACE: beachhouse
      BH_AUTH_JWT_SECRET: change-me-in-production
    depends_on:
      - clickhouse
      - nats
      - redis
      - scylladb

  beachhouse-api-2:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.beachhouse-api
    environment:
      BH_MODE: clustered
      BH_CH_ADDR: clickhouse:9000
      BH_MQ_URL: nats://nats:4222
      BH_CACHE_REDIS_URL: redis://redis:6379
      BH_DEDUPE_SCYLLA_HOSTS: scylladb:9042
      BH_DEDUPE_SCYLLA_KEYSPACE: beachhouse
      BH_AUTH_JWT_SECRET: change-me-in-production
    depends_on:
      - clickhouse
      - nats
      - redis
      - scylladb

  beachhouse-worker-1:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.beachhouse-worker
    environment:
      BH_MODE: clustered
      BH_CH_ADDR: clickhouse:9000
      BH_MQ_URL: nats://nats:4222
    depends_on:
      - clickhouse
      - nats

  beachhouse-worker-2:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.beachhouse-worker
    environment:
      BH_MODE: clustered
      BH_CH_ADDR: clickhouse:9000
      BH_MQ_URL: nats://nats:4222
    depends_on:
      - clickhouse
      - nats

volumes:
  clickhouse-data:
  nats-data:
  scylla-data:
