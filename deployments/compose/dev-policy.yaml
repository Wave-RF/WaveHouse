# =====================================================================
#  Permissive TRIAL policy — meant to be tuned before production.
# =====================================================================
#
# Lets you try WaveHouse with NO token: the `public` default_role can read and
# write the quickstart's demo tables (`clicks`, `events`). Deliberately lenient
# so `git clone` → ingest → query → stream works out of the box.
#
# It is intentionally NOT admin and NOT a blanket grant:
#   - no raw SQL (/v1/admin/query), no policy/pipe CRUD, no schema/DLQ admin —
#     those stay locked (they require the admin role);
#   - it only grants the tables named below, so if this file ever rides into a
#     real deployment it grants nothing there (those demo tables won't exist)
#     and cannot escalate.
#
# A real deployment should replace it with a least-privilege policy: your own
# roles, your real tables, scoped `allow_columns`/`deny_columns`, row `filter`s
# and `max_rows` limits, and usually tokens (drop the public default_role to
# require auth). See docs/src/content/docs/access-control.md for the full model.
#
# Seeds the control-plane db on FIRST boot only; after that it is authoritative and runtime
# edits go through PUT /v1/admin/policy. Wired in via WH_POLICY_FILE_PATH.
default_role: public
tables:
  clicks:
    select:
      public:
        allow_columns: ["*"]
    insert:
      public:
        allow_columns: ["*"]
  events:
    select:
      public:
        allow_columns: ["*"]
    insert:
      public:
        allow_columns: ["*"]
