services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  wavehouse:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # NATS lives at /app/data/nats, Pebble at /app/data/pebble — subdirs
      # are convention, not config. The Dockerfile pre-creates /app/data
      # owned by the nonroot user; bind-mount any persistent volume here.
      WH_DATA_DIR: /app/data
      # ClickHouse wiring (addr, ports, database, user) is in ./settings/config.json
      # — the settings directory below — where it hot-reloads. Only the
      # password is env (a secret); the bundled ClickHouse has none.
      # WH_CH_PASSWORD: ""
      # No auth on/off switch: set WH_AUTH_JWT_SECRET to validate tokens;
      # without it, every request resolves to the policy default_role.
      # WH_AUTH_JWT_SECRET: "change-me"
      #
      # Optional non-JWT operator credential: a request presenting it
      # (Authorization: Operator <key>, or the X-Operator-Key alias) gets
      # full-access admin, works even if the policy is wiped (break-glass).
      # Treat it as an admin secret.
      # WH_AUTH_OPERATOR_KEY: "change-me-operator-key"
      #
      # Seed a policy on first boot. WaveHouse is fail-closed: with no policy,
      # every request (even admin) is denied. dev-policy.yaml ships a permissive
      # "public" trial policy (read/write the demo tables, NOT admin) so the
      # quickstart works tokenless. Tune it before production — see that file.
      WH_POLICY_FILE_PATH: /app/policy.yaml
      # Settings directory (roles.json, policies.json, pipes.json, config.json)
      # — required, and the image ships none (same as the policy file): the
      # image sets WH_SETTINGS_DIR=/app/settings and ./settings (checked in
      # next to this file) is bind-mounted there. It is the seed
      # (`wavehouse bootstrap`) with one edit: clickhouse.addr points at
      # the clickhouse service. Everything in its config.json reloads live
      # (file watch / SIGHUP / POST /v1/ops/settings/reload) — edit the files
      # on the host and the running container picks them up.
      # Optional: bootstrap pipes from .sql files. Mount your pipes dir
      # read-only and uncomment WH_PIPES_DIR. The directory is a seed for
      # NATS KV — runtime pipe edits go through the API, not the files.
      # WH_PIPES_DIR: /app/pipes
    volumes:
      - wavehouse-data:/app/data
      - ./dev-policy.yaml:/app/policy.yaml:ro    # permissive trial policy (public role, demo tables) — tune for prod
      - ./settings:/app/settings    # checked-in seed with clickhouse.addr=clickhouse:9000; hot-reloads on edit
      # - wavehouse-settings:/app/settings    # or a named volume, seeded once with
      #     `docker compose -f deployments/compose/standalone.yaml run --rm wavehouse bootstrap`
      #     then edit clickhouse.addr to clickhouse:9000 (the seed says localhost)
      # - ./my-pipes:/app/pipes:ro    # uncomment alongside WH_PIPES_DIR
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  wavehouse-data:

