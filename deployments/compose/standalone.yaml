services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  wavehouse:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      WH_MODE: standalone
      WH_CH_ADDR: clickhouse:9000
      WH_CH_HTTP_SCHEME: http
      WH_MQ_EMBEDDED_DIR: /data/nats
      WH_AUTH_ENABLED: "false"
      WH_DEDUPE_ENABLED: "false"
      WH_DEDUPE_EMBEDDED_DIR: /data/pebble
      WH_SCHEMA_REFRESH_INTERVAL: "60"
      WH_DLQ_ENABLED: "true"
      WH_SERVER_CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - wavehouse-data:/data
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  wavehouse-data:
