services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  wavehouse:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # NATS lives at /app/data/nats, Pebble at /app/data/pebble — subdirs
      # are convention, not config. The Dockerfile pre-creates /app/data
      # owned by the nonroot user; bind-mount any persistent volume here.
      WH_DATA_DIR: /app/data
      # ClickHouse wiring (addr, ports, database, user) is in ./settings/config.json
      # — the settings directory below — where it hot-reloads. Only the
      # password is env (a secret); the bundled ClickHouse has none.
      # WH_CH_PASSWORD: ""
      # No auth on/off switch: set WH_AUTH_JWT_SECRET to validate tokens;
      # without it, every request resolves to the policy default_role.
      # WH_AUTH_JWT_SECRET: "change-me"
      #
      # Optional non-JWT operator credential: a request presenting it
      # (Authorization: Operator <key>, or the X-Operator-Key alias) gets
      # full-access admin, works even if the policy is wiped (break-glass).
      # Treat it as an admin secret.
      # WH_AUTH_OPERATOR_KEY: "change-me-operator-key"
      #
      # Settings directory (roles.json, policies.json, pipes.json, config.json)
      # — required, and the image ships none: the image sets
      # WH_SETTINGS_DIR=/app/settings and ./settings (checked in next to this
      # file) is bind-mounted there. It is the `wavehouse bootstrap` seed with
      # two edits: clickhouse.addr points at the clickhouse service, and
      # policies.json/roles.json carry a permissive "public" TRIAL policy —
      # WaveHouse is fail-closed (no policy = every request denied), so the
      # quickstart works tokenless: public can read/write the demo tables
      # (clicks, events) and nothing else (no admin, no raw SQL). Tune it
      # before production. All four files reload live (file watch / SIGHUP /
      # POST /v1/ops/settings/reload) — edit them on the host and the running
      # container picks them up; the files are the only write path.
    volumes:
      - wavehouse-data:/app/data
      - ./settings:/app/settings    # checked-in seed + trial policy, clickhouse.addr=clickhouse:9000; hot-reloads on edit
      # - wavehouse-settings:/app/settings    # or a named volume: swap this line for the
      #     one above (bootstrap refuses a non-empty /app/settings, so the bind mount
      #     must be gone), seed it once with
      #     `docker compose -f deployments/compose/standalone.yaml run --rm wavehouse bootstrap`,
      #     then edit clickhouse.addr to clickhouse:9000 (the seed says localhost) and
      #     add a policy to policies.json (the seed ships none: fail closed)
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  wavehouse-data:

