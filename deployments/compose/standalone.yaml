services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  beachhouse:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.beachhouse
    ports:
      - "8080:8080"
    environment:
      BH_MODE: standalone
      BH_CH_ADDR: clickhouse:9000
      BH_MQ_EMBEDDED_DIR: /data/nats
      BH_AUTH_ENABLED: "false"
      BH_DEDUPE_ENABLED: "false"
      BH_DEDUPE_EMBEDDED_DIR: /data/pebble
      BH_SCHEMA_REFRESH_INTERVAL: "60"
      BH_DLQ_ENABLED: "true"
    volumes:
      - beachhouse-data:/data
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  beachhouse-data:
