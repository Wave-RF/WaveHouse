services:
  clickhouse:
    # The ClickHouse this repository tests against (internal/chversion); its
    # line's chtypes artifact is fetched into chtypes-cache at first bind.
    image: clickhouse/clickhouse-server:26.8.15.10
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  wavehouse:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # NATS lives at /app/data/nats, Pebble (every tenant's dedupe store) at
      # /app/data/pebble — subdirs are convention, not config. The Dockerfile
      # pre-creates /app/data owned by the nonroot user; bind-mount any
      # persistent volume here.
      WH_DATA_DIR: /app/data
      # ClickHouse wiring (addr, ports, database, user, password, tls,
      # headers, pool sizes) is in ./settings/config.json — the settings
      # directory below — where it hot-reloads; the bundled ClickHouse has no
      # password. Only the connection ceiling and the chtypes artifact keys
      # (below) are env.
      # WH_CH_MAX_TOTAL_CONNS: "0"
      # The image bakes no chtypes artifact: the first tenant bind fetches its
      # ClickHouse line's (roughly 45–60 MB) into the image's cache, /var/cache/chtypes
      # (CHTYPES_CACHE), which the chtypes-cache volume below keeps across
      # restarts and image pulls. The 2.0.0-dev SDK fetches only from chtypes'
      # staging registry and ignores a mirror setting
      # (WH_CHTYPES_ARTIFACTS_URL); chtypes 2.0.0 restores mirrors.
      # Air-gapped: prefetch into the volume with the bundled CLI
      # (`docker compose run --rm --no-deps --entrypoint /app/chtypes wavehouse fetch 26.8`)
      # and turn autofetch off:
      # WH_CHTYPES_AUTOFETCH: "false"
      # No auth on/off switch: set auth.jwt_secret in ./settings/config.json
      # to validate tokens; without it (or a jwks_url), every request
      # resolves to the policy default_role.
      #
      # Optional non-JWT operator credential: a request presenting it
      # (Authorization: Operator <key>, or the X-Operator-Key alias) reaches
      # /v1/ops/* always, even with the policy wiped (break-glass), and the
      # whole data plane while a policy is adopted.
      # Treat it as an admin secret.
      # WH_AUTH_OPERATOR_KEY: "change-me-operator-key"
      #
      # Settings directory (roles.json, policies.json, pipes.json, config.json)
      # — required, and the image ships none: the image sets
      # WH_SETTINGS_DIR=/app/settings and ./settings (checked in next to this
      # file) is bind-mounted there. It is the `wavehouse bootstrap` seed with
      # two edits: clickhouse.addr points at the clickhouse service, and
      # policies.json/roles.json carry a permissive "public" TRIAL policy —
      # WaveHouse is fail-closed (no policy = every request denied), so the
      # quickstart works tokenless: public can read/write the demo tables
      # (clicks, events) and nothing else (no admin, no raw SQL). Tune it
      # before production. All four files reload live (file watch / SIGHUP /
      # POST /v1/ops/settings/reload) — edit them on the host and the running
      # container picks them up; the files are the only write path.
    volumes:
      - wavehouse-data:/app/data
      - ./settings:/app/settings    # checked-in seed + trial policy, clickhouse.addr=clickhouse:9000; hot-reloads on edit
      - chtypes-cache:/var/cache/chtypes # fetched chtypes artifacts (layout under v2-dev/); or a host dir, e.g. ~/.cache/chtypes
    # A stop is server.shutdown_timeout (10s) of drain, then a fixed 5s to
    # release NATS/Pebble and 3s to flush telemetry: up to 18s. Docker's
    # default 10s grace would SIGKILL the release; cover it with headroom.
    stop_grace_period: 25s
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  wavehouse-data:
  chtypes-cache:

