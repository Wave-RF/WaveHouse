services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  wavehouse:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      WH_CH_ADDR: clickhouse:9000
      # NATS lives at /app/data/nats, Pebble at /app/data/pebble — subdirs
      # are convention, not config. The Dockerfile pre-creates /app/data
      # owned by the nonroot user; bind-mount any persistent volume here.
      WH_CH_HTTP_SCHEME: http
      WH_DATA_DIR: /app/data
      # No auth on/off switch: set WH_AUTH_JWT_SECRET to validate tokens;
      # without it, every request resolves to the policy default_role.
      # WH_AUTH_JWT_SECRET: "change-me"
      #
      # Seed a policy on first boot. WaveHouse is fail-closed: with no policy,
      # every request (even admin) is denied. dev-policy.yaml ships a permissive
      # "public" trial policy (read/write the demo tables, NOT admin) so the
      # quickstart works tokenless. Tune it before production — see that file.
      WH_POLICY_FILE_PATH: /app/policy.yaml
      WH_DEDUPE_ENABLED: "false"
      # With dedupe on, reject rows missing the id field instead of publishing
      # them un-deduped (default false → logged + counted, not rejected).
      WH_DEDUPE_REQUIRE_ID: "false"
      WH_SCHEMA_REFRESH_INTERVAL: "60"
      WH_DLQ_ENABLED: "true"
      WH_SERVER_CORS_ALLOWED_ORIGINS: "*"
      # Optional: bootstrap pipes from .sql files. Mount your pipes dir
      # read-only and uncomment WH_PIPES_DIR. The directory is a seed for
      # NATS KV — runtime pipe edits go through the API, not the files.
      # WH_PIPES_DIR: /app/pipes
    volumes:
      - wavehouse-data:/app/data
      - ./dev-policy.yaml:/app/policy.yaml:ro    # permissive trial policy (public role, demo tables) — tune for prod
      # - ./my-pipes:/app/pipes:ro    # uncomment alongside WH_PIPES_DIR
    depends_on:
      - clickhouse

volumes:
  clickhouse-data:
  wavehouse-data:
