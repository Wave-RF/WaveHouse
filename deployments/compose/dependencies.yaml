# Compose stack used by `make dev` (and direct `docker compose` invocations).
# Brings up ClickHouse on the standard ports so a host-side WaveHouse (run
# under air, or `go run`, or `./bin/wavehouse`) can connect at :9000 / :8123.
#
# `name:` pins the Compose project name so containers/volumes/networks land
# under `wavehouse-dev_*` regardless of CWD — without this, the project
# name defaults to the parent directory and changes if you invoke from a
# worktree or move the repo.

name: wavehouse-dev

services:
  clickhouse:
    # Pinned to match tests/integration/setup_test.go (26.8 changed numeric
    # DateTime64 parsing; see the comment there) so the dev server behaves
    # like the one the tests assert against.
    image: clickhouse/clickhouse-server:26.6.3.62
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
        ]
      interval: 2s
      timeout: 2s
      retries: 15

  # Optional shared cache for trying cache.backend=redis locally, e.g. two
  # host-side instances on different ports: `--profile redis`. No
  # persistence, and /data on tmpfs, so it leaves no volume behind.
  redis:
    profiles: [redis]
    # Pinned to match internal/cache's integration suite.
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    tmpfs:
      - /data

volumes:
  clickhouse-data:
