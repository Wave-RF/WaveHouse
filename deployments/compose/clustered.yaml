services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - wavehouse-api-1
      - wavehouse-api-2

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_PASSWORD: ""
    volumes:
      - clickhouse-data:/var/lib/clickhouse

  nats:
    image: nats:latest
    command: ["--jetstream", "--store_dir", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  scylladb:
    image: scylladb/scylla:latest
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla

  wavehouse-api-1:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    entrypoint: ["/usr/local/bin/wavehouse-api"]
    environment:
      WH_MODE: clustered
      WH_CH_ADDR: clickhouse:9000
      WH_MQ_STREAM_NAME: WAVEHOUSE
      WH_MQ_URL: nats://nats:4222
      WH_CACHE_REDIS_URL: redis://redis:6379
      WH_AUTH_ENABLED: "false"
      WH_DEDUPE_ENABLED: "false"
      WH_DEDUPE_SCYLLA_HOSTS: scylladb:9042
      WH_DEDUPE_SCYLLA_KEYSPACE: wavehouse
      WH_SCHEMA_REFRESH_INTERVAL: "60"
      WH_DLQ_ENABLED: "true"
      WH_SERVER_CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      - clickhouse
      - nats
      - redis
      - scylladb

  wavehouse-api-2:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    entrypoint: ["/usr/local/bin/wavehouse-api"]
    environment:
      WH_MODE: clustered
      WH_CH_ADDR: clickhouse:9000
      WH_MQ_STREAM_NAME: WAVEHOUSE
      WH_MQ_URL: nats://nats:4222
      WH_CACHE_REDIS_URL: redis://redis:6379
      WH_AUTH_ENABLED: "false"
      WH_DEDUPE_ENABLED: "false"
      WH_DEDUPE_SCYLLA_HOSTS: scylladb:9042
      WH_DEDUPE_SCYLLA_KEYSPACE: wavehouse
      WH_SCHEMA_REFRESH_INTERVAL: "60"
      WH_DLQ_ENABLED: "true"
      WH_SERVER_CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      - clickhouse
      - nats
      - redis
      - scylladb

  wavehouse-worker-1:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    entrypoint: ["/usr/local/bin/wavehouse-worker"]
    environment:
      WH_MODE: clustered
      WH_CH_ADDR: clickhouse:9000
      WH_MQ_STREAM_NAME: WAVEHOUSE
      WH_MQ_URL: nats://nats:4222
      WH_SCHEMA_REFRESH_INTERVAL: "60"
      WH_DLQ_ENABLED: "true"
    depends_on:
      - clickhouse
      - nats

  wavehouse-worker-2:
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    entrypoint: ["/usr/local/bin/wavehouse-worker"]
    environment:
      WH_MODE: clustered
      WH_CH_ADDR: clickhouse:9000
      WH_MQ_STREAM_NAME: WAVEHOUSE
      WH_MQ_URL: nats://nats:4222
      WH_SCHEMA_REFRESH_INTERVAL: "60"
      WH_DLQ_ENABLED: "true"
    depends_on:
      - clickhouse
      - nats

volumes:
  clickhouse-data:
  nats-data:
  scylla-data:
