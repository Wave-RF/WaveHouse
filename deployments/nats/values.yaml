# Values for the NATS Helm chart (https://github.com/nats-io/k8s, chart
# nats/nats 1.x) that WaveHouse's mq.backend: nats runs against: JetStream on
# file storage, and an account holding two users —
#   nack       the JetStream controller that applies jetstream.yaml (full access)
#   wavehouse  WaveHouse itself, with exactly the permissions it needs: it can
#              publish to its ingest, history and dead-letter subjects,
#              subscribe to the live subject the partitions republish to,
#              consume, unpin and reset its shard durables, read a stream's
#              messages without a consumer, read and write the lease keys in
#              the coord bucket, and cannot create, change, purge or delete a
#              stream or bucket, or create a durable on an ingest partition.
# Passwords come from Secrets through the container env; `<< $VAR >>` is the
# chart's syntax for an unquoted NATS config variable.
#
# The wavehouse user's permissions are for the default subject prefix (wh),
# history stream (WH_HISTORY), shard durables (wh-ingest-<shard>) and lease
# bucket (wh_coord), with 8 shards per partition as in jetstream.yaml: they
# name every shard's durable, so regenerate them with
# `wavehouse mq permissions --shards <V>` (add --js-domain <D> when
# mq.nats.js_domain is set). A test keeps them in step with WaveHouse, and the
# conformance tests connect with them verbatim. WaveHouse refuses to boot when
# they do not let it pull every shard's durable, read every partition's
# waiting rows, record on the history, or subscribe to the live subject.
#
# The reads without a consumer ($JS.API.DIRECT.GET.* and
# $JS.API.STREAM.MSG.GET.*, which an SSE replay reads a partition's waiting
# rows by) name the stream by a wildcard, as the shard durables' entries do: a
# NATS wildcard is a whole token, so it cannot stop at the ingest partitions.
# The wavehouse user can therefore read any stream of this account by
# sequence, the dead-letter stream and the lease bucket included, and by
# direct get any that sets allow_direct. Keep streams it must not read in
# another account.
#
# The chart sets each server's max_file_store to fileStore.maxSize, else to
# the PVC's size: 100Gi here. Every server holds a replica of every stream
# and reserves its maxBytes against that, and jetstream.yaml is sized to
# reserve 75Gi of it. Resize the two together: `wavehouse mq manifests
# --file-store <size>` sizes the streams for another volume.
config:
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      pvc:
        size: 100Gi
  merge:
    accounts:
      WAVEHOUSE:
        jetstream: enabled
        users:
          - user: nack
            password: << $NACK_PASSWORD >>
          - user: wavehouse
            password: << $WAVEHOUSE_PASSWORD >>
            permissions:
              publish:
                allow:
                  - wh.ingest.>
                  - wh.hist.>
                  - wh.dlq.>
                  - $JS.API.INFO
                  - $JS.API.STREAM.NAMES
                  - $JS.API.STREAM.INFO.*
                  - $JS.API.CONSUMER.INFO.*.*
                  - $JS.API.CONSUMER.NAMES.*
                  - $JS.API.DIRECT.GET.*
                  - $JS.API.STREAM.MSG.GET.*
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-0
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-1
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-2
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-3
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-4
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-5
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-6
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-7
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-0
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-1
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-2
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-3
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-4
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-5
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-6
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-7
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-0
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-1
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-2
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-3
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-4
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-5
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-6
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-7
                  - $JS.ACK.*.wh-ingest-0.>
                  - $JS.ACK.*.wh-ingest-1.>
                  - $JS.ACK.*.wh-ingest-2.>
                  - $JS.ACK.*.wh-ingest-3.>
                  - $JS.ACK.*.wh-ingest-4.>
                  - $JS.ACK.*.wh-ingest-5.>
                  - $JS.ACK.*.wh-ingest-6.>
                  - $JS.ACK.*.wh-ingest-7.>
                  - $JS.ACK.*.*.*.wh-ingest-0.>
                  - $JS.ACK.*.*.*.wh-ingest-1.>
                  - $JS.ACK.*.*.*.wh-ingest-2.>
                  - $JS.ACK.*.*.*.wh-ingest-3.>
                  - $JS.ACK.*.*.*.wh-ingest-4.>
                  - $JS.ACK.*.*.*.wh-ingest-5.>
                  - $JS.ACK.*.*.*.wh-ingest-6.>
                  - $JS.ACK.*.*.*.wh-ingest-7.>
                  - $JS.API.CONSUMER.CREATE.WH_HISTORY.>
                  - $JS.API.CONSUMER.MSG.NEXT.WH_HISTORY.>
                  - $JS.API.CONSUMER.DELETE.WH_HISTORY.>
                  - $KV.wh_coord.lease.>
                  - $JS.API.DIRECT.GET.KV_wh_coord.$KV.wh_coord.lease.>
                deny:
                  - $JS.API.STREAM.CREATE.>
                  - $JS.API.STREAM.UPDATE.>
                  - $JS.API.STREAM.DELETE.>
                  - $JS.API.STREAM.PURGE.>
                  - $JS.API.CONSUMER.DURABLE.CREATE.>
              subscribe:
                allow:
                  - _INBOX_wh.>
                  - wh.live.>

container:
  image:
    tag: 2.15.1-alpine # the server line the external-NATS tests run against and the embedded broker runs
  env:
    NACK_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nats-users
          key: nack
    WAVEHOUSE_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nats-users
          key: wavehouse
