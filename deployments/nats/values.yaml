# Values for the NATS Helm chart (https://github.com/nats-io/k8s, chart
# nats/nats 1.x) that WaveHouse's mq.backend: nats runs against: JetStream on
# file storage, and an account holding two users —
#   nack       the JetStream controller that applies jetstream.yaml (full access)
#   wavehouse  WaveHouse itself, with exactly the permissions it needs: it can
#              publish, read and consume, unpin and reset its shard durables,
#              read and write the lease keys in the coord bucket, and cannot
#              create, change, purge or delete a stream or bucket, create a
#              durable on an ingest partition, or publish to the history.
# Passwords come from Secrets through the container env; `<< $VAR >>` is the
# chart's syntax for an unquoted NATS config variable.
#
# The wavehouse user's permissions are for the default subject prefix (wh),
# history stream (WH_HISTORY), shard durables (wh-ingest-<shard>) and lease
# bucket (wh_coord), with 8 shards per partition as in jetstream.yaml: they
# name every shard's durable, so regenerate them with
# `wavehouse mq permissions --shards <V>`. A test keeps them in step with
# WaveHouse, and the conformance tests connect with them verbatim.
config:
  cluster:
    enabled: true
    replicas: 3
  jetstream:
    enabled: true
    fileStore:
      enabled: true
      pvc:
        size: 100Gi
  merge:
    accounts:
      WAVEHOUSE:
        jetstream: enabled
        users:
          - user: nack
            password: << $NACK_PASSWORD >>
          - user: wavehouse
            password: << $WAVEHOUSE_PASSWORD >>
            permissions:
              publish:
                allow:
                  - wh.ingest.>
                  - wh.dlq.>
                  - $JS.API.INFO
                  - $JS.API.STREAM.NAMES
                  - $JS.API.STREAM.INFO.*
                  - $JS.API.CONSUMER.INFO.*.*
                  - $JS.API.CONSUMER.NAMES.*
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-0
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-1
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-2
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-3
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-4
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-5
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-6
                  - $JS.API.CONSUMER.MSG.NEXT.*.wh-ingest-7
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-0
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-1
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-2
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-3
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-4
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-5
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-6
                  - $JS.API.CONSUMER.UNPIN.*.wh-ingest-7
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-0
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-1
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-2
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-3
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-4
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-5
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-6
                  - $JS.API.CONSUMER.RESET.*.wh-ingest-7
                  - $JS.ACK.>
                  - $JS.API.CONSUMER.CREATE.WH_HISTORY.>
                  - $JS.API.CONSUMER.MSG.NEXT.WH_HISTORY.>
                  - $JS.API.CONSUMER.DELETE.WH_HISTORY.>
                  - $KV.wh_coord.lease.>
                  - $JS.API.DIRECT.GET.KV_wh_coord.$KV.wh_coord.lease.>
                deny:
                  - wh.hist.>
                  - $JS.API.STREAM.CREATE.>
                  - $JS.API.STREAM.UPDATE.>
                  - $JS.API.STREAM.DELETE.>
                  - $JS.API.STREAM.PURGE.>
                  - $JS.API.CONSUMER.DURABLE.CREATE.>
              subscribe:
                allow:
                  - _INBOX_wh.>

container:
  image:
    tag: 2.14.6-alpine # the server line WaveHouse embeds and tests against
  env:
    NACK_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nats-users
          key: nack
    WAVEHOUSE_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nats-users
          key: wavehouse
