---
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: wh-history
spec:
  name: WH_HISTORY
  sources:
    - name: WH_INGEST_0
    - name: WH_INGEST_1
    - name: WH_INGEST_2
    - name: WH_INGEST_3
  retention: limits
  discard: old
  maxBytes: 21474836480
  maxAge: 2h
  storage: file
  replicas: 3
---
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
