---
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: wh-ingest-2
spec:
  streamName: WH_INGEST_2
  durableName: wh-ingest
  deliverPolicy: all
  ackPolicy: explicit
  ackWait: 1m
  maxDeliver: -1
  maxAckPending: 10000
  filterSubject: wh.ingest.2.>
  preventDelete: true
---
apiVersion: jetstream.nats.io/v1beta2
