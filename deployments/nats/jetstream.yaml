# WaveHouse's JetStream topology as nack (jetstream.nats.io/v1beta2) resources:
# 4 ingest partition(s) with interest retention, each with the wh-ingest durable,
# the WH_HISTORY history stream sourcing them, the dead-letter stream, and the
# wh_coord KV bucket that coord.backend=nats holds its leases in.
# Generated by: wavehouse mq manifests --partitions 4 --prefix wh --replicas 3
# Sizes (maxBytes, maxAge, maxMsgsPerSubject) are starting points to tune.
# WaveHouse publishes nothing until all of it exists, so apply order is free;
# but never let a partition take publishes without its durable: with only the
# history's source on it, a row leaves the partition once the history has it.
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: wh-ingest-0
spec:
  name: WH_INGEST_0
  subjects:
    - wh.ingest.0.>
  retention: interest
  discard: new
  discardPerSubject: true
  maxBytes: 53687091200
  maxMsgsPerSubject: 1000000
  storage: file
  replicas: 3
  duplicateWindow: 2m
  denyPurge: true
  denyDelete: true
  metadata:
    wavehouse.dev/partition: "0"
    wavehouse.dev/partitions: "4"
  preventDelete: true
---
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: wh-ingest-0
spec:
  streamName: WH_INGEST_0
  durableName: wh-ingest
  deliverPolicy: all
  ackPolicy: explicit
  ackWait: 1m
  maxDeliver: -1
  maxAckPending: 10000
  filterSubject: wh.ingest.0.>
  preventDelete: true
---
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: wh-ingest-1
spec:
  name: WH_INGEST_1
  subjects:
    - wh.ingest.1.>
  retention: interest
  discard: new
  discardPerSubject: true
  maxBytes: 53687091200
  maxMsgsPerSubject: 1000000
  storage: file
  replicas: 3
  duplicateWindow: 2m
  denyPurge: true
  denyDelete: true
  metadata:
    wavehouse.dev/partition: "1"
    wavehouse.dev/partitions: "4"
  preventDelete: true
---
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: wh-ingest-1
spec:
  streamName: WH_INGEST_1
  durableName: wh-ingest
  deliverPolicy: all
  ackPolicy: explicit
  ackWait: 1m
  maxDeliver: -1
  maxAckPending: 10000
  filterSubject: wh.ingest.1.>
  preventDelete: true
---
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: wh-ingest-2
spec:
  name: WH_INGEST_2
  subjects:
    - wh.ingest.2.>
  retention: interest
  discard: new
  discardPerSubject: true
  maxBytes: 53687091200
  maxMsgsPerSubject: 1000000
  storage: file
  replicas: 3
  duplicateWindow: 2m
  denyPurge: true
  denyDelete: true
  metadata:
    wavehouse.dev/partition: "2"
    wavehouse.dev/partitions: "4"
