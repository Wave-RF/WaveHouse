# WaveHouse's JetStream topology as nack (jetstream.nats.io/v1beta2) resources:
# 4 ingest partition(s) with work-queue retention, each split into 8 shards
# with a pinned-client durable per shard (wh-ingest-<shard>), and republishing every
# row to the WH_HISTORY history stream; the dead-letter stream; and the wh_coord KV
# bucket that coord.backend=nats holds its leases in.
# Generated by: wavehouse mq manifests --partitions 4 --shards 8 --prefix wh --replicas 3 --file-store 100Gi
# Sized for a JetStream file store (max_file_store) of 100Gi on every server:
# the streams' maxBytes reserve 75Gi of it, and JetStream refuses a stream that
# does not fit. The NATS Helm chart sets max_file_store to
# config.jetstream.fileStore.maxSize, else to the JetStream PVC's size.
# Sizes (maxBytes, maxAge, maxMsgsPerSubject) are starting points to tune.
# Set the history's maxAge (15m) to at least the longest
# stream.gap_window_minutes among the tenants served.
# WaveHouse publishes nothing until all of it exists, so apply order is free:
# a partition keeps every row until the ingest worker acks it, even while its
# durable is missing, and the history is best effort (a row republished while
# it is unavailable reaches ClickHouse but not SSE replay).
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: wh-ingest-0
spec:
  name: WH_INGEST_0
  subjects:
    - wh.ingest.0.>
  retention: workqueue
  discard: new
  discardPerSubject: true
  maxBytes: 16106127360
  maxMsgsPerSubject: 1000000
  storage: file
  replicas: 3
  duplicateWindow: 2m
  denyPurge: true
  denyDelete: true
  metadata:
    wavehouse.dev/partition: "0"
    wavehouse.dev/partitions: "4"
    wavehouse.dev/shards: "8"
  preventDelete: true
  republish:
    source: wh.ingest.0.*.>
    destination: wh.hist.>
---
apiVersion: jetstream.nats.io/v1beta2
kind: Consumer
metadata:
  name: wh-ingest-0-0
spec:
  streamName: WH_INGEST_0
  durableName: wh-ingest-0
  deliverPolicy: all
  ackPolicy: explicit
  ackWait: 1m
  maxDeliver: -1
  maxAckPending: 10000
  filterSubject: wh.ingest.0.0.>
  priorityPolicy: pinned_client
  priorityGroups:
    - wavehouse
  pinnedTtl: 10s
  preventDelete: true
---
