# GitHub's auto-generated release notes — the body of every GitHub Release.
#
# GoReleaser hands the body to GitHub (`changelog.use: github-native` in
# .goreleaser.yaml), and GitHub builds it from the PRs merged since the previous
# tag. main is squash-merged, so one PR is one line, titled with its
# Conventional Commit subject. This file is the only knob on that output — the
# `changelog.filters` in .goreleaser.yaml do not apply.
#
# Categories are matched by PR LABEL, top to bottom, first match wins; a PR with
# no matching label falls into the `*` catch-all. So a category is only as good
# as the labels: `dependencies` / `github_actions` / `go` / `documentation` are
# applied automatically by actions/labeler (path-based, see labeler.yml), while
# `breaking-change`, `security`, `bug`, and `enhancement` are applied by hand
# during triage — label the PR, or it lands in "Other changes".
#
# Dependabot is separated by AUTHOR, not by label, and that is load-bearing.
# `github_actions` is path-based here (labeler.yml maps `.github/workflows/**`
# and `.github/actions/**` to it), so it marks every hand-written CI PR too —
# excluding that label from the catch-all filed all of our own CI work under
# "Dependencies". Nor can the label simply be dropped from the Dependencies
# list: Dependabot's own action bumps carry `github_actions` and NOT
# `dependencies` (checked against #480, #412, #341), so that empties the
# category instead. Only the author axis separates the two populations. Both
# spellings are listed because GitHub's docs use the bare handle while the API
# reports the login as `dependabot[bot]`.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    # Ordered by what a reader upgrading needs to see first. `!` in the PR title
    # marks the breaking change per Conventional Commits; the label is what puts
    # it at the top of the notes.
    - title: ⚠️ Breaking changes
      labels: [breaking-change]
    - title: 🔒 Security
      labels: [security]
    - title: ✨ Features
      labels: [enhancement]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: 📚 Documentation
      labels: [documentation]
    # Our own CI/release work, which is dense in this repo's history and is not
    # a dependency bump.
    - title: 🔧 CI & build
      labels: [github_actions]
      exclude:
        authors: [dependabot, "dependabot[bot]"]
    - title: 🧹 Other changes
      labels: ["*"]
      exclude:
        authors: [dependabot, "dependabot[bot]"]
    # Last, so a long Dependabot run never buries the changes people actually
    # care about. `*` rather than a label list: everything reaching this point
    # has already been excluded from the two categories above by author, so this
    # is exactly the Dependabot set — and a bump that somehow carried neither
    # `dependencies` nor `github_actions` still gets listed instead of dropped.
    - title: 📦 Dependencies
      labels: ["*"]
