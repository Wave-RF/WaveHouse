name: Publish SDK (npm)

# All @wavehouse/sdk npm publishing lives in this ONE file — npm allows only
# ONE trusted publisher (workflow file) per package, so the dev channel and
# tagged releases can't be split across two files. Two jobs:
#
#   dev      push to main → 0.0.0-dev.<build-hash> under the `dev` dist-tag,
#            published only when the built dist actually changed. The version
#            IS a hash of the build output, so an unchanged build maps to an
#            already-published version and is skipped. No clients/ts path guard
#            (a shared-dep or build-config change is caught too) and no manual
#            trigger. The npm analog of the GHCR :dev image (publish-dev.yml).
#
#   release  sdk-v* tag → version under `latest` (stable) or
#            `alpha`/`beta`/`rc`/`next` (prerelease) + a GitHub Release. The
#            SDK analog of release.yml. `v*` (server) and `sdk-v*` (SDK) tag
#            globs are disjoint, so this and release.yml never both fire.
#
# Auth: OIDC trusted publishing — no NPM_TOKEN. Configure ONE trusted
# publisher on npmjs.com → repo Wave-RF/WaveHouse, workflow publish-npm.yml.
# Both publish steps pass --provenance for a signed build-provenance attestation
# (the OIDC id-token above + public repo + npm >= 11.5.1 from Node 24).
#
# To cut a release: bump clients/ts/package.json, commit, then
# `git tag sdk-vX.Y.Z[-pre] && git push origin sdk-vX.Y.Z[-pre]`.

on:
  push:
    branches: [main]
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

concurrency:
  # main (dev) tracks HEAD → cancel superseded builds; tags (release) get
  # their own group and never cancel mid-publish.
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  dev:
    name: Dev snapshot (@dev)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.21.0"
          run_install: false

      # Node 24 ships npm >= 11.5.1 for OIDC trusted publishing, and dodges the
      # broken in-place npm self-upgrade on the Node 22.22.2 runner image
      # (actions/runner-images#13883). The SDK build is Node-version-agnostic.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build the SDK
        run: |
          pnpm --filter @wavehouse/sdk run typecheck
          pnpm --filter @wavehouse/sdk run build

      - name: Publish @wavehouse/sdk@dev when the build changes
        working-directory: clients/ts
        shell: bash
        run: |
          # Content-addressed: the version is a hash of the built dist (file
          # names + contents), so an unchanged build resolves to a version that
          # already exists and we skip. Runs on every push to main; npm stamps
          # the commit into the published manifest's gitHead for traceability.
          hash=$(find dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-12)
          # h-prefix keeps it a valid semver pre-release identifier even on the
          # rare all-digit hash (a numeric identifier can't have a leading zero).
          version="0.0.0-dev.h${hash}"
          if npm view "@wavehouse/sdk@${version}" version >/dev/null 2>&1; then
            echo "Build unchanged — @wavehouse/sdk@${version} already published; nothing to do."
            exit 0
          fi
          npm version "${version}" --no-git-tag-version --allow-same-version
          # --ignore-scripts publishes exactly the dist we just hashed (the
          # typecheck + build already ran above; this skips a redundant rebuild).
          # --provenance attaches a signed build-provenance attestation.
          npm publish --access public --tag dev --ignore-scripts --provenance

  release:
    name: Release (sdk-v* tag)
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: "11.21.0"
          run_install: false

      # Node 24 ships npm >= 11.5.1 for OIDC trusted publishing — see the dev job.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Resolve version + dist-tag
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./clients/ts/package.json').version")
          expected="sdk-v${version}"
          actual="${GITHUB_REF#refs/tags/}"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::Tag '${actual}' != clients/ts/package.json version ('${expected}'). Bump the version in package.json and retag."
            exit 1
          fi
          case "${version}" in
            *-alpha*) tag=alpha ;;
            *-beta*)  tag=beta ;;
            *-rc*)    tag=rc ;;
            *-*)      tag=next ;;   # any other prerelease form
            *)        tag=latest ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version} under dist-tag '${tag}'."

      - name: Publish to npm
        working-directory: clients/ts
        # `npm publish` typechecks + builds via the package's prepublishOnly.
        # --provenance attaches a signed build-provenance attestation.
        run: npm publish --access public --tag "${{ steps.meta.outputs.dist_tag }}" --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          flags=(--title "@wavehouse/sdk ${{ steps.meta.outputs.version }}" --generate-notes)
          if [ "${{ steps.meta.outputs.dist_tag }}" != "latest" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF#refs/tags/}" "${flags[@]}"
