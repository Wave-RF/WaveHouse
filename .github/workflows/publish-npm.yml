name: Publish SDK (npm)

# All @wavehouse/sdk npm publishing lives in this ONE file — npm allows only
# ONE trusted publisher (workflow file) per package, so the dev channel and
# tagged releases can't be split across two files. Two jobs:
#
#   dev      push to main (when clients/ts changed) → 0.0.0-dev.<sha> under
#            the `dev` dist-tag. The npm analog of the GHCR :dev image (which
#            rides publish-dev.yml); this runs as its own job/pod.
#
#   release  sdk-v* tag → version under `latest` (stable) or
#            `alpha`/`beta`/`rc`/`next` (prerelease) + a GitHub Release. The
#            SDK analog of release.yml. `v*` (server) and `sdk-v*` (SDK) tag
#            globs are disjoint, so this and release.yml never both fire.
#
# Auth: OIDC trusted publishing — no NPM_TOKEN. Configure ONE trusted
# publisher on npmjs.com → repo Wave-RF/WaveHouse, workflow publish-npm.yml.
# Add --provenance to both `npm publish` lines once the repo is public (#149).
#
# To cut a release: bump clients/ts/package.json, commit, then
# `git tag sdk-vX.Y.Z[-pre] && git push origin sdk-vX.Y.Z[-pre]`.

on:
  push:
    branches: [main]
    tags: ["sdk-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing

concurrency:
  # main (dev) tracks HEAD → cancel superseded builds; tags (release) get
  # their own group and never cancel mid-publish.
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  dev:
    name: Dev snapshot (@dev)
    if: github.ref == 'refs/heads/main'
    runs-on: [wave-rf-runners]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need the previous commit to tell whether the SDK changed. Assumes
          # one commit per main push (squash-merge), the repo's merge style.
          fetch-depth: 2

      - name: Did the SDK change?
        id: changed
        shell: bash
        run: |
          # workflow_dispatch is a manual "force a dev publish" (e.g. to verify
          # the pipeline); otherwise publish only when clients/ts actually changed.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD^ HEAD -- clients/ts/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "clients/ts/ unchanged on this push — skipping npm dev publish."
          fi

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        if: steps.changed.outputs.changed == 'true'
        with:
          version: "11.1.3"
          run_install: false

      # Node 24 ships npm >= 11.5.1 for OIDC trusted publishing, and dodges the
      # broken in-place npm self-upgrade on the Node 22.22.2 runner image
      # (actions/runner-images#13883). The SDK build is Node-version-agnostic.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.changed.outputs.changed == 'true'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace
        if: steps.changed.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish @wavehouse/sdk@dev
        if: steps.changed.outputs.changed == 'true'
        working-directory: clients/ts
        shell: bash
        run: |
          # 0.0.0-dev.<sha>: unique, sorts below every real release, reachable
          # only via the `dev` dist-tag. Mirrors publish-dev.yml's synthetic
          # v0.0.0-dev.<sha> image tag. The edit isn't committed.
          # `npm publish` typechecks + builds via the package's prepublishOnly.
          npm version "0.0.0-dev.${GITHUB_SHA::7}" --no-git-tag-version --allow-same-version
          npm publish --access public --tag dev
          # Add --provenance once Wave-RF/WaveHouse is public (#149).

  release:
    name: Release (sdk-v* tag)
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    runs-on: [wave-rf-runners]
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: "11.1.3"
          run_install: false

      # Node 24 ships npm >= 11.5.1 for OIDC trusted publishing — see the dev job.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Resolve version + dist-tag
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./clients/ts/package.json').version")
          expected="sdk-v${version}"
          actual="${GITHUB_REF#refs/tags/}"
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::Tag '${actual}' != clients/ts/package.json version ('${expected}'). Bump the version in package.json and retag."
            exit 1
          fi
          case "${version}" in
            *-alpha*) tag=alpha ;;
            *-beta*)  tag=beta ;;
            *-rc*)    tag=rc ;;
            *-*)      tag=next ;;   # any other prerelease form
            *)        tag=latest ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${version} under dist-tag '${tag}'."

      - name: Publish to npm
        working-directory: clients/ts
        # `npm publish` typechecks + builds via the package's prepublishOnly.
        # Add --provenance once Wave-RF/WaveHouse is public (#149).
        run: npm publish --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          flags=(--title "@wavehouse/sdk ${{ steps.meta.outputs.version }}" --generate-notes)
          if [ "${{ steps.meta.outputs.dist_tag }}" != "latest" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF#refs/tags/}" "${flags[@]}"
