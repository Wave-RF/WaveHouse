name: Claude PR review

# Manual-only PR review. Triggered by `@claude` or `/review`
# comments from trusted reviewers, or by workflow_dispatch.
#
# Trust gate: HEAD commit's author OR committer must have ≥read on
# the repo. Without this, a trusted reviewer commenting `@claude` on
# a fork PR would check out untrusted fork code with write tokens.
# Accepting either author or committer covers the
# admin-fixup-onto-fork-PR case (author = external, committer = admin)
# that author-only gates miss. When the gate skips, the job exits 0
# so the "Claude review" check stays visible on the PR.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

# Dedup per PR. Manual triggers (comments, dispatches) queue rather
# than cancel — back-to-back retries don't kill an in-flight review.
concurrency:
  group: claude-review-${{ github.event.issue.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    name: Claude review
    # Cheap workflow-level filter. The real trust check is in-script
    # below — webhook `author_association` only reports the PR opener
    # and would miss admin-pushed fixups.
    if: |
      (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && (contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '/review'))
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'workflow_dispatch'
      )
    runs-on: [wave-rf-runners]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Resolve PR + verify HEAD committer is trusted
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_COMMENT_PR: ${{ github.event.issue.number }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          # Resolve PR number from the trigger, then look up HEAD SHA.
          case "$EVENT_NAME" in
            issue_comment)
              pr_num="$ISSUE_COMMENT_PR"
              ;;
            workflow_dispatch)
              pr_num="$DISPATCH_PR"
              ;;
          esac
          head_sha=$(gh pr view "$pr_num" -R "$REPO" --json headRefOid --jq '.headRefOid')

          # Self-modification gate. The action's validation step
          # auto-fails when its own workflow or prompt file is in the
          # PR diff (known limitation in anthropics/claude-code-action).
          # Skip the action when those files are touched; the change
          # applies to the next PR's run instead.
          self_mod_paths=$(gh pr view "$pr_num" -R "$REPO" --json files --jq '
            .files[].path
            | select(. == ".github/workflows/claude-review.yml"
                  or . == ".github/prompts/pr-review.md")
          ')
          if [ -n "$self_mod_paths" ]; then
            echo "::notice::PR #$pr_num modifies Claude's own workflow / prompt ($self_mod_paths). Skipping the action (it would self-fail on validation); the change will apply to the next PR's review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trust gate: check author + committer logins against the
          # collaborator permission map. Skip `web-flow` (GitHub's
          # Web UI bot identity) — it has no real permission.
          commit=$(gh api "repos/$REPO/commits/$head_sha")
          author_login=$(echo "$commit" | jq -r '.author.login // empty')
          committer_login=$(echo "$commit" | jq -r '.committer.login // empty')

          trusted=false
          trust_via=""
          for candidate in "$author_login" "$committer_login"; do
            [ -z "$candidate" ] && continue
            [ "$candidate" = "web-flow" ] && continue
            [ "$candidate" = "dependabot[bot]" ] && continue
            perm=$(gh api "repos/$REPO/collaborators/$candidate/permission" --jq '.permission' 2>/dev/null || echo "none")
            case "$perm" in
              admin|maintain|write|triage|read)
                trusted=true
                trust_via="$candidate ($perm)"
                break
                ;;
            esac
          done

          if [ "$trusted" != "true" ]; then
            echo "::notice::HEAD $head_sha: author=$author_login committer=$committer_login — neither has repo permission. Skipping Claude review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::HEAD trusted via $trust_via. Proceeding with Claude review."
          echo "pr_num=$pr_num" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.gate.outputs.skip != 'true'
        with:
          # Check out the PR HEAD SHA, not the default merge ref, so
          # the action sees the user's commit not a merge artifact.
          # The trust gate above ensures only commits from
          # repo-permissioned users land here.
          ref: ${{ steps.gate.outputs.head_sha }}
          fetch-depth: 1

      # Prepend a REPO + PR-number header to the prompt template so
      # the action knows which PR to fetch context for.
      - name: Build review prompt from .github/prompts/pr-review.md
        id: prompt
        if: steps.gate.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.gate.outputs.pr_num }}
        run: |
          set -euo pipefail
          {
            echo 'content<<PROMPT_EOF'
            echo "REPO: $REPO"
            echo "PR NUMBER: $PR_NUM"
            echo
            cat .github/prompts/pr-review.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@24492741e0ccfdef4c1d19da8e11e0f373d07494 # v1.0.124
        if: steps.gate.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # One sticky summary comment per PR — specific findings go
          # in inline review threads (see allowedTools below) so they
          # block merge via the ruleset's review-thread resolution.
          use_sticky_comment: true
          # Without an explicit allow-list, Claude Code's default
          # tools don't include the inline-comment MCP tool, so
          # findings would collapse into the sticky comment.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/*/pulls/*/comments:*),Bash(gh api repos/*/issues/*/comments:*),Read,Glob,Grep"
          prompt: ${{ steps.prompt.outputs.content }}
