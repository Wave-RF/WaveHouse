name: Claude PR review

# Auto-reviews pull requests after CI + PR-title checks complete, but only
# when the PR author is already trusted (OWNER, MEMBER, COLLABORATOR,
# or CONTRIBUTOR) to bound token cost. PRs from first-time
# contributors on forks are skipped here — a maintainer can invoke
# Claude on them by commenting `@claude`, which is handled by
# claude-agent.yml.
#
# Triggering: this workflow fires on `workflow_run: completed` for both
# CI and Lint PR title. Each upstream's completion fires us once; the
# gate-check below skips invocations where any required check is still
# in-progress (and waits for the next workflow_run to retry). On the
# common path, "Lint PR title" finishes in <30s, then CI finishes
# minutes later — we typically run twice: once where CI is still
# in-progress (early exit), then once where everything's settled.
# Net runner cost vs. the previous 15-minute polling loop: a few
# seconds for the early exit, and the remainder runs only when CI is
# definitely done.
#
# Prompt structure follows Anthropic's canonical pr-review-comprehensive
# template (Code Quality / Security / Performance / Testing / Docs) with
# a strictness directive, WaveHouse-specific concerns (Go concurrency,
# ClickHouse SQL injection, AGENTS.md doc-sync), and the severity
# rubric from Anthropic's security-review example.
#
# Gemini Code Assist (installed as a GitHub App) also reviews PRs. The
# two reviewers operate independently and their outputs are both
# advisory. CODEOWNERS + the ruleset are the actual merge-gate.

on:
  workflow_run:
    workflows: [CI, Lint PR title]
    types: [completed]

# Dedupe per PR — both upstreams firing back-to-back for the same PR
# could otherwise schedule overlapping reviews. The number is reachable
# from the workflow_run payload before any step runs.
concurrency:
  group: claude-review-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Filter to PR-triggered upstreams only. CI also runs on `push: main`
    # and pr-title's workflow_run can fire from `pull_request_target` —
    # neither is a PR we want to review here.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: [wave-rf-runners]
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
      id-token: write
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # workflow_run.pull_requests is populated for non-fork PRs.
          # Fork PRs run CI in the fork's context — workflow_run still
          # fires here, but the array is empty. Bail out cleanly.
          num=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$num" ]; then
            echo "::notice::No PR associated with workflow_run (fork PR or push event); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Gate — author trust + required-check snapshot
        id: gate
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.pr.outputs.num }}
          # Required checks from the `main branch protection` ruleset.
          # Newline-separated so names with spaces ("Integration Tests")
          # round-trip correctly. Keep in sync with the ruleset and
          # project-orchestrator.yml's bot-clean check.
          REQUIRED_CHECKS: |
            Build
            Validate
            Lint
            Test
            Integration Tests
            SDK Tests
        run: |
          set -euo pipefail

          # Read the PR's current state in one round-trip: draft, author,
          # association, and the full check rollup.
          pr=$(gh pr view "$PR_NUM" -R "$REPO" \
            --json isDraft,author,authorAssociation,statusCheckRollup)

          # Author-trust gate — same as the previous pull_request `if:`
          # but evaluated here since workflow_run doesn't carry pull_request
          # context to the job-level `if:`.
          if [ "$(echo "$pr" | jq -r '.isDraft')" = "true" ]; then
            echo "::notice::PR #$PR_NUM is draft; skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          author=$(echo "$pr" | jq -r '.author.login')
          if [ "$author" = "dependabot" ] || [ "$author" = "dependabot[bot]" ]; then
            echo "::notice::PR #$PR_NUM is from Dependabot; skipping review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          association=$(echo "$pr" | jq -r '.authorAssociation')
          # CONTRIBUTOR is included because webhook payloads report users
          # with *private* org membership as CONTRIBUTOR (not MEMBER) even
          # when the REST API reports them as MEMBER.
          case "$association" in
            OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR) ;;
            *)
              echo "::notice::PR #$PR_NUM author $author has association $association; skipping (untrusted-actor gate)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          # Required-check snapshot. Each required check must be in a
          # terminal SUCCESS-equivalent state for us to proceed. If any
          # is still running, we exit cheaply — the OTHER upstream's
          # workflow_run completion will fire us again and we'll retry.
          # If any has concluded as failure/cancelled/timed_out, skip
          # review (don't burn tokens reviewing red CI).
          rollup=$(echo "$pr" | jq -c '.statusCheckRollup')
          mapfile -t CHECKS < <(printf '%s\n' "$REQUIRED_CHECKS" | awk 'NF')

          for check in "${CHECKS[@]}"; do
            entry=$(echo "$rollup" | jq -c --arg n "$check" '.[] | select(.name == $n)' | head -n1)
            if [ -z "$entry" ]; then
              # Check hasn't been created yet (parallel job not started,
              # paths-filtered, etc.). Treat as not-yet-done — the next
              # workflow_run will retry once it appears (or is skipped
              # by GitHub's required-check-timeout).
              echo "::notice::Required check '$check' not yet present on PR #$PR_NUM; will retry on next workflow_run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            status=$(echo "$entry" | jq -r '.status // empty')
            conclusion=$(echo "$entry" | jq -r '.conclusion // empty')
            if [ "$status" != "COMPLETED" ]; then
              echo "::notice::Required check '$check' is $status (not COMPLETED); will retry on next workflow_run."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            case "$conclusion" in
              SUCCESS|NEUTRAL|SKIPPED) ;;
              FAILURE|CANCELLED|TIMED_OUT|STARTUP_FAILURE|ACTION_REQUIRED|STALE)
                echo "::notice::Required check '$check' concluded $conclusion; skipping Claude review (no point reviewing red CI)."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              *)
                echo "::warning::Required check '$check' has unrecognised conclusion '$conclusion'; skipping defensively."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done

          echo "All required checks completed successfully — proceeding with Claude review."
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.gate.outputs.skip != 'true'
        with:
          # workflow_run defaults to checking out the default branch.
          # Pin to the PR's head SHA so the diff Claude reviews matches
          # the SHA that actually passed CI.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Build review prompt from .github/prompts/pr-review.md
        # The prompt template is checked in as markdown so it's diff-able
        # and editor-friendly. We prepend the dynamic header (REPO + PR
        # number) here and pass the assembled string via $GITHUB_OUTPUT.
        # Using a heredoc-style multi-line output to preserve newlines.
        id: prompt
        if: steps.gate.outputs.skip != 'true'
        env:
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          {
            echo 'content<<PROMPT_EOF'
            echo "REPO: $REPO"
            echo "PR NUMBER: $PR_NUM"
            echo
            cat .github/prompts/pr-review.md
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@9840e4524194198b8d4e3b31a544efc441a8b11e # v1.0.102
        if: steps.gate.outputs.skip != 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          track_progress: true
          prompt: ${{ steps.prompt.outputs.content }}
