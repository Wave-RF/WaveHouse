name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release (goreleaser)
  packages: write # push the image to GHCR
  id-token: write # OIDC for build-provenance attestations (Sigstore)
  attestations: write # write the build-provenance attestations

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      # dockers_v2 builds the linux/amd64+arm64 manifest via `docker buildx`;
      # the GitHub-hosted runner's default docker driver can't build
      # multi-platform images, so create a docker-container builder. No QEMU
      # needed — Dockerfile.goreleaser stages are $BUILDPLATFORM-pinned /
      # COPY-only by design. Mirrors publish-dev.yml.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin to the v2 line so a v3 release breaks loudly instead
          # of silently changing release behavior.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build-provenance attestations — free for public repos via Sigstore's
      # public-good infra. Binaries: one attestation over every artifact listed
      # in goreleaser's checksums.txt. Image: attest the multi-arch
      # manifest-list digest and store the attestation alongside it in GHCR.
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Resolve pushed image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/wave-rf/wavehouse:${GITHUB_REF_NAME}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "::error::empty digest for $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved $ref -> $digest"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/wave-rf/wavehouse
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
