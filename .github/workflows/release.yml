name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release (goreleaser)
  packages: write # push the image to GHCR
  id-token: write # OIDC for build-provenance attestations (Sigstore)
  attestations: write # write the build-provenance attestations

concurrency:
  # Per-tag, never cancelling: two runs of the SAME tag (a re-run after a
  # transient GHCR failure) must not overlap and race each other's pushes,
  # but two different tags are independent releases and both must complete.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          # Opting out keeps a ~1 GB archive — the module tree plus this
          # job's cross-compile objects — out of the 10 GB repo budget.
          # (That entry is keyed on the root go.mod, not go.sum: setup-go
          # hashed go.sum through v6.2.0 and go.mod from v6.3.0 —
          # actions/setup-go#705.)
          #
          # Turning it back on here would be strictly negative. Nothing
          # mints that key any more — publish-dev.yml and
          # goreleaser-validate.yml opt out too, and ci.yml runs no
          # setup-go — so the restore is a guaranteed miss. Worse, cache
          # writes are scoped to the ref that made them: a save from
          # refs/tags/v1.0.0 can never be read by refs/tags/v1.0.1, by main,
          # or by a PR — only by a re-run of that same tag. It would be a
          # ~1 GB entry per release that nothing but a retry can ever read.
          #
          # What IS warm is publish-dev's gobuild-v3-<os>-go-release- entry,
          # restorable from the default branch's scope. A tagged release is
          # rare and not latency-sensitive, so it isn't worth a hand-rolled
          # restore step here — but that's the lever if it ever is.
          #
          # Same cache: false as publish-dev.yml and goreleaser-validate.yml;
          # different follow-up (publish-dev re-caches the useful half). #443.
          cache: false

      # dockers_v2 builds the linux/amd64+arm64 manifest via `docker buildx`;
      # the GitHub-hosted runner's default docker driver can't build
      # multi-platform images, so create a docker-container builder. No QEMU
      # needed — Dockerfile.goreleaser stages are $BUILDPLATFORM-pinned /
      # COPY-only by design. Mirrors publish-dev.yml.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Resolve the moving GHCR tag BEFORE the build, so a malformed tag
      # fails here rather than after an 8-target cross-compile and a
      # multi-arch image push. The script rejects anything that isn't
      # semver-shaped, so a typo can't fall through to `latest`.
      - name: Resolve release channel
        shell: bash
        run: |
          set -euo pipefail
          channel="$(scripts/ci/release-channel.sh "$GITHUB_REF_NAME")"
          echo "WAVEHOUSE_CHANNEL=${channel}" >> "$GITHUB_ENV"
          echo "::notice::${GITHUB_REF_NAME} publishes ghcr.io/wave-rf/wavehouse:${GITHUB_REF_NAME} + :${channel}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Pin to the v2 line so a v3 release breaks loudly instead
          # of silently changing release behavior.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Second dockers_v2 tag in .goreleaser.yaml. Stable → latest;
          # prerelease → alpha/beta/rc/next, so an rc can't displace the
          # :latest a shipped stable release owns.
          WAVEHOUSE_CHANNEL: ${{ env.WAVEHOUSE_CHANNEL }}

      # Build-provenance attestations — free for public repos via Sigstore's
      # public-good infra. Binaries: one attestation over every artifact listed
      # in goreleaser's checksums.txt. Image: attest the multi-arch
      # manifest-list digest and store the attestation alongside it in GHCR.
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: dist/checksums.txt

      - name: Resolve pushed image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/wave-rf/wavehouse:${GITHUB_REF_NAME}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "::error::empty digest for $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved $ref -> $digest"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/wave-rf/wavehouse
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # Prove the attestations we just wrote actually verify against the
      # artifacts people will download — the same `gh attestation verify`
      # command, flags included, that the install docs tell users to run. Attesting and verifying
      # are different code paths (subject digests, the checksums-file
      # expansion, the registry round-trip), so a release that publishes
      # unverifiable provenance should go red rather than look green.
      # Runs last: the release is already public by this point, so this is a
      # loud alarm, not a gate.
      - name: Verify published provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Digest, not tag: verifying by tag would re-resolve the pointer
          # and could check a different image than the one just attested.
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          # Every archive listed in checksums.txt is a subject of the binary
          # attestation. Verify them all rather than a representative one —
          # a per-GOOS/GOARCH gap is exactly what this would miss.
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::no release archives in dist/ to verify"
            exit 1
          fi
          # --signer-workflow, not just --repo: `--repo` alone accepts an
          # attestation produced by ANY workflow in the repo, so without it this
          # step would happily pass on provenance minted somewhere else — which
          # is the exact weakness SECURITY.md warns consumers about. Pinning it
          # to this workflow is what makes the check mean "release.yml built
          # this".
          signer="${GITHUB_REPOSITORY}/.github/workflows/release.yml"

          for archive in "${archives[@]}"; do
            echo "--- $archive"
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
          done

          echo "--- ghcr.io/wave-rf/wavehouse@${IMAGE_DIGEST}"
          gh attestation verify \
            "oci://ghcr.io/wave-rf/wavehouse@${IMAGE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer"
