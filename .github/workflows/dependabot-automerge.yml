name: Dependabot auto-merge

# Auto-approves and enables auto-merge for Dependabot PRs on patch-
# and minor-version bumps. Major bumps stay held for human review,
# both admins get assigned as reviewers, and a sticky-comment
# explains the hold.
#
# Board placement is no longer done here — the project's native
# "Auto-add to project" workflow (configured in the project UI under
# project #7's Workflows tab) handles adding the PR to the board, and
# the "Item added to project" workflow sets its initial Status. The
# orchestrator-side board-upsert step was removed in the same change
# that deleted project-orchestrator.yml; native workflows are the
# replacement.
#
# Admin-approval bypass: Dependabot PRs skip the `Admin approval`
# required status check entirely (see `admin-approval.yml`). For
# patch / minor, the trust model is: this workflow's bot-approval +
# classification (via fetch-metadata) gates *enabling* auto-merge;
# the actual merge is gated by required-checks on the ruleset (CI
# passing). So CI failures still block merges. For major bumps: a
# human admin approves in GitHub as usual.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # contents: write is needed for `gh pr merge` to perform an immediate
  # squash when checks are already green at enablement time.
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: [wave-rf-runners]
    timeout-minutes: 10
    steps:
      - name: Checkout main (trusted composite-action source)
        # Security: pin to the default branch, not the PR head.
        # Dependabot PRs can modify .github/actions/** and since this
        # workflow runs with write-scoped tokens (contents:write +
        # pull-requests:write) a compromised upstream action could
        # inject code via a bump PR. Defensive regardless of the
        # actor being dependabot[bot].
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve and enable auto-merge (patch / minor)
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved by dependabot-automerge workflow (${{ steps.meta.outputs.update-type }})."
          gh pr merge --auto --squash "$PR_URL"

      # ───────────────────────────────────────────────────────────────
      # Major-bump path: hold for human review.
      # ───────────────────────────────────────────────────────────────

      - name: Assign + request review from both admins (major bump)
        # Dependabot is the author — assign both admins so whoever
        # picks it up first can action.
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        uses: ./.github/actions/assign-and-request-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          reviewers: EricAndrechek taitelee

      - name: Comment on major bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Marker-comment upsert (same pattern as housekeeping.yml's
          # title-lint comment): on every synchronize the workflow
          # re-runs and finds the existing comment by its hidden marker,
          # then edits it in place rather than posting a new one. The
          # previous unconditional `gh pr comment` produced a fresh
          # comment for every Dependabot push.
          MARKER='<!-- dependabot-major-bump-comment -->'
          BODY="$MARKER
          Major-version bump — holding for human review. Auto-merge is limited to patch and minor updates. Reviewers assigned. See dependency changelog / release notes before merging."

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -f "body=$BODY" > /dev/null
            echo "Updated existing major-bump comment ($EXISTING)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f "body=$BODY" > /dev/null
            echo "Posted new major-bump comment"
          fi
