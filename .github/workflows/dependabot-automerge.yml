name: Dependabot auto-merge

# Auto-approves and enables auto-merge for Dependabot PRs on patch
# and minor bumps. Major bumps stay held for human review, both
# admins get assigned, and a sticky comment explains the hold.
#
# Dependabot PRs bypass the `Admin approval` required status check
# (see admin-approval.yml). For patch / minor, this workflow's bot
# approval + fetch-metadata classification gates *enabling* auto-
# merge; the actual merge is still gated by required-checks (CI
# passing), so CI failures continue to block. Major bumps go through
# a human admin review as usual.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  # contents: write lets `gh pr merge` squash immediately when checks
  # are already green at enablement time.
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main (trusted composite-action source)
        # Security: check out the default branch, not the PR head.
        # Dependabot PRs can touch .github/actions/**, and this
        # workflow has write-scoped tokens — a compromised action
        # could inject code via a bump PR.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Load board config
        # Loads ADMINS (comma-separated) used by the major-bump
        # reviewer-assign step below.
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .github/board-config.env >> $GITHUB_ENV

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Approve and enable auto-merge (patch / minor)
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved by dependabot-automerge workflow (${{ steps.meta.outputs.update-type }})."
          gh pr merge --auto --squash "$PR_URL"

      # --- Major-bump path: hold for human review ---------------------

      - name: Convert ADMINS to space-separated (composite expects spaces)
        # The composite splits reviewers on whitespace; done in bash
        # because GitHub Actions has no `replace()` expression
        # function and using a non-existent one fails workflow
        # validation on every push event.
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "ADMINS_SPACE=${ADMINS//,/ }" >> "$GITHUB_ENV"

      - name: Assign + request review from both admins (major bump)
        # Author is Dependabot; assign both admins so whoever picks
        # it up first can action.
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        uses: ./.github/actions/assign-and-request-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          reviewers: ${{ env.ADMINS_SPACE }}

      - name: Comment on major bumps
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Marker-comment upsert: find the existing comment by its
          # hidden marker and edit in place rather than posting a new
          # one on every synchronize.
          MARKER='<!-- dependabot-major-bump-comment -->'
          BODY="$MARKER
          Major-version bump — holding for human review. Auto-merge is limited to patch and minor updates. Reviewers assigned. See dependency changelog / release notes before merging."

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -f "body=$BODY" > /dev/null
            echo "Updated existing major-bump comment ($EXISTING)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f "body=$BODY" > /dev/null
            echo "Posted new major-bump comment"
          fi
