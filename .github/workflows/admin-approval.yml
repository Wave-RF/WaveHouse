name: Admin approval

# Required status check that enforces at-least-one approval from an
# admin (Eric or Taite) before any PR can merge. Replaces the
# CODEOWNERS-based `require_code_owner_review` rule so that reviewer
# assignment can be workflow-controlled (see auto-assign-reviewer.yml)
# and human reviewers are only notified once bots are clean.
#
# Dependabot PRs bypass this check because they go through
# dependabot-automerge.yml for patch/minor bumps — auto-approved by
# the bot and merged hands-off. Major bumps post a comment and stay
# open for human review, at which point an admin approval is recorded
# normally.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]

permissions:
  pull-requests: read

concurrency:
  group: admin-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admin-approval:
    name: Admin approval
    runs-on: ubuntu-latest
    steps:
      - name: Check for admin approval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Dependabot bypass — dependabot-automerge.yml handles these.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" ]]; then
            echo "::notice::Dependabot PR — bypassing admin approval (handled by dependabot-automerge workflow)."
            exit 0
          fi

          admins=("EricAndrechek" "taitelee")

          # Evaluate each user's *latest* review state and require
          # APPROVED. Without this, a historical APPROVED review that
          # was later followed by CHANGES_REQUESTED (or dismissed)
          # would still satisfy the gate — Copilot flagged that false-
          # pass on an earlier version. Reviews are grouped by user;
          # within each group the submission with the most recent
          # submitted_at wins.
          approvers=$(gh api "repos/$REPO/pulls/$PR_NUM/reviews?per_page=100" \
            --jq '
              sort_by(.submitted_at)
              | reverse
              | unique_by(.user.login)
              | .[]
              | select(.state == "APPROVED")
              | .user.login
            ')

          for admin in "${admins[@]}"; do
            if printf '%s\n' "$approvers" | grep -Fxq "$admin"; then
              echo "PR #$PR_NUM has admin approval from $admin (latest review state: APPROVED)."
              exit 0
            fi
          done

          {
            echo "::error::PR #$PR_NUM needs approval from an admin."
            echo ""
            echo "Current APPROVED reviewers:"
            if [[ -z "$approvers" ]]; then
              echo "  (none)"
            else
              printf '  - %s\n' $approvers
            fi
            echo ""
            echo "Required: at least one approving review from any of:"
            printf '  - %s\n' "${admins[@]}"
          } >&2
          exit 1
