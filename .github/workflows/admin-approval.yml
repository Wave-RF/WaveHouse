name: Admin approval

# Required status check that enforces at-least-one approval from an
# admin (Eric or Taite) before any PR can merge. Replaces the
# CODEOWNERS-based `require_code_owner_review` rule so that reviewer
# assignment + Task Board state can be workflow-controlled (see
# `.github/workflows/project-orchestrator.yml`) and human reviewers
# are only notified once bots are clean.
#
# Status reporting model: this workflow does NOT use its own check-run
# conclusion to drive the gate. Instead it manually POSTs a commit
# status with context "Admin approval" via the GitHub statuses API.
# Two reasons:
#
#   1. PRs sit unapproved by definition for most of their lifetime.
#      With check-run conclusions, every push reported FAILURE until
#      an admin reviewed, which spammed the author with workflow-
#      failure emails on every iteration.
#   2. Commit-status state `pending` (⏳) is a non-failure way to
#      block merge. The required-status-check ruleset accepts either
#      check runs or commit statuses by name, so swapping to commit
#      statuses preserves the merge gate while killing the email
#      noise.
#
# The workflow itself always exits 0; the commit status is the source
# of truth. Required by ruleset 15353356 by name "Admin approval".
#
# Dependabot PRs bypass this check entirely (status is posted as
# success without any review check). Patch / minor bumps are merged
# hands-off via dependabot-automerge.yml; major bumps still get
# human eyes through the same workflow's Ready-board path.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    # `edited` drops intentionally — editing a review's body doesn't
    # change its state, so re-running the approval check on edits
    # just burns workflow minutes (Claude flagged this).
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  # statuses: write is the new permission needed for the
  # `POST /repos/.../statuses/{sha}` API call. This is what lets us
  # bypass the check-run-conclusion → workflow-fail-email path.
  statuses: write

concurrency:
  # cancel-in-progress: false is deliberate. The earlier `true` setting
  # caused Eric-observed "approval doesn't clear the red X" behavior:
  # when a second event (e.g. a bot comment) fired while the approval-
  # triggered run was executing, the approval run got cancelled mid-
  # flight. A cancelled check run shows as CANCELLED in the ruleset's
  # required-check view, which is neither SUCCESS nor FAILURE and was
  # being read as "not passing." Let runs complete sequentially — a
  # few seconds of queueing is cheaper than a stuck gate.
  group: admin-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  admin-approval:
    name: Admin approval
    runs-on: [wave-rf-runners]
    timeout-minutes: 5
    steps:
      - name: Checkout main (trusted board-config source)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Load board config
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .github/board-config.env >> $GITHUB_ENV

      - name: Evaluate admin approval and post commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          # Build a link back to this run so the commit status's
          # target_url surfaces the approval logic if anyone clicks
          # the status's "Details" link.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Helper: post a commit status. Always succeed at the
          # workflow level — the commit status is the source of truth
          # for whether merge is allowed, not this workflow's
          # conclusion. (See header comment.)
          post_status() {
            local state="$1"      # pending | success
            local description="$2"
            gh api -X POST "repos/$REPO/statuses/$PR_HEAD_SHA" \
              -f "state=$state" \
              -f "context=Admin approval" \
              -f "description=$description" \
              -f "target_url=$RUN_URL" > /dev/null
            echo "Posted commit status: state=$state context='Admin approval' description='$description'"
          }

          # Dependabot bypass — dependabot-automerge.yml handles these.
          # Match both login shapes ("dependabot[bot]" is the standard
          # user-context login; "app/dependabot" shows up in some GH
          # API / app contexts). Keeping both keeps this check aligned
          # with project-orchestrator.yml.
          if [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "app/dependabot" ]]; then
            echo "::notice::Dependabot PR — bypassing admin approval (handled by dependabot-automerge workflow)."
            post_status success "Dependabot PR — bypassed"
            exit 0
          fi

          # Admin list comes from .github/board-config.env (loaded into
          # $GITHUB_ENV at the start of this job).
          IFS=',' read -ra admins <<< "$ADMINS"

          # Fast-path: if the triggering event IS an admin's APPROVED
          # review, trust the event payload directly and don't round-
          # trip through the reviews API (which has observable lag
          # after submit events — can be a second or two before the
          # new review shows up in GET /reviews responses). Eliminates
          # the "I approved but the check is still red" confusion for
          # the common case. The slow path below still runs for every
          # other event type.
          if [[ "$EVENT_NAME" == "pull_request_review" && "$EVENT_ACTION" == "submitted" && "$REVIEW_STATE" == "approved" ]]; then
            for admin in "${admins[@]}"; do
              if [[ "$REVIEW_AUTHOR" == "$admin" ]]; then
                echo "::notice::Admin $REVIEW_AUTHOR just approved PR #$PR_NUM — fast-path success."
                post_status success "Approved by $REVIEW_AUTHOR"
                exit 0
              fi
            done
          fi

          # Slow path: evaluate each user's *latest* review state via
          # the reviews API. Required APPROVED. Without this, a
          # historical APPROVED review that was later followed by
          # CHANGES_REQUESTED (or dismissed) would still satisfy the
          # gate.
          #
          # Uses explicit group_by(user) | map(max_by(submitted_at))
          # rather than sort + unique_by — Copilot flagged that
          # `unique_by` sorts internally and could keep an arbitrary
          # review within each user-group depending on input order.
          # group_by + max_by is unambiguous: pick the most recent
          # review per user, then filter for APPROVED.
          #
          # Retry the API call up to 3 times with 2-second backoff
          # to absorb review-submit eventual consistency. The fast-
          # path above covers the common submit case; this retry
          # guards non-submit events (synchronize, opened) that fire
          # in the same cluster as a submit.
          # Distinguish "API succeeded, no admin in approvers yet"
          # (retry — propagation lag) from "API failed" (post a
          # pending status with the error in the description so it's
          # surfaced, rather than silently treating it as no-approval).
          attempts=0
          approvers=""
          admin_found=""
          last_api_err=""
          while [ $attempts -lt 3 ]; do
            set +e
            api_out=$(gh api "repos/$REPO/pulls/$PR_NUM/reviews?per_page=100" \
              --jq '
                sort_by(.user.login)
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | .[]
                | select(.state == "APPROVED")
                | .user.login
              ' 2>&1)
            api_rc=$?
            set -e

            if [ "$api_rc" -ne 0 ]; then
              last_api_err="$api_out"
              echo "::warning::reviews API call failed on attempt $((attempts + 1)): $api_out"
              approvers=""
            else
              approvers="$api_out"
              last_api_err=""
            fi

            for admin in "${admins[@]}"; do
              if printf '%s\n' "$approvers" | grep -Fxq "$admin"; then
                admin_found="$admin"
                break
              fi
            done
            [ -n "$admin_found" ] && break

            attempts=$((attempts + 1))
            [ $attempts -lt 3 ] && sleep 2
          done

          # If every attempt errored, post pending with an error
          # description rather than silently reporting "no admin
          # approval." The status stays blocking either way (pending
          # blocks merge same as a failure would), but the description
          # makes the real cause visible.
          if [ -z "$admin_found" ] && [ -n "$last_api_err" ]; then
            echo "::error::Unable to read PR reviews after 3 attempts. Last error: $last_api_err"
            post_status pending "Reviews API unreachable; unable to check approval"
            exit 0
          fi

          if [ -n "$admin_found" ]; then
            echo "PR #$PR_NUM has admin approval from $admin_found (latest review state: APPROVED)."
            post_status success "Approved by $admin_found"
            exit 0
          fi

          # No admin approval yet — post pending with the wait list in
          # the description. Pending blocks merge but doesn't email.
          admin_list=$(IFS=,; echo "${admins[*]}")
          if [[ -z "$approvers" ]]; then
            description="Waiting for approval from one of: $admin_list"
          else
            # Other approvers exist (non-admin reviewers); call them
            # out so reviewers see why their approval isn't unblocking
            # merge.
            description="Waiting for admin approval. Current approvers: $(echo "$approvers" | tr '\n' ',' | sed 's/,$//; s/,/, /g'). Required: one of $admin_list"
          fi
          post_status pending "$description"
