name: Admin approval

# Required status check enforcing at least one admin approval before
# any PR can merge.
#
# This workflow posts a commit status ("Admin approval") via the
# statuses API rather than relying on its own check-run conclusion.
# Reasons:
#   1. PRs are unapproved most of their lifetime — a check-run
#      FAILURE on every push would spam the author with workflow-
#      failure emails.
#   2. Commit-status `pending` blocks merge without firing failure
#      notifications, and the required-status-check ruleset accepts
#      either check runs or commit statuses by name.
#
# The workflow itself always exits 0; the commit status is the
# source of truth.
#
# Dependabot patch/minor bumps bypass (status posted as success);
# dependabot-automerge.yml handles those. Major bumps fall through
# to admin review like any human PR — closed a hole where a bot's
# APPROVED review (e.g. CodeRabbit) could merge a major bump (see
# #130, PR #127). The ruleset's `required_approving_review_count`
# is 1 (any collaborator's approval satisfies it); this status check
# is what makes one of those approvals specifically an admin's.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    # `edited` is dropped intentionally: editing a review body doesn't
    # change its state, so re-running on edits just burns minutes.
    types: [submitted, dismissed]

permissions:
  pull-requests: read
  # statuses: write is required for `POST /repos/.../statuses/{sha}`,
  # which is how this workflow drives the merge gate without firing
  # check-run-failure emails.
  statuses: write

# ADMINS is inlined here (rather than loaded from board-config.env)
# so a missing/renamed config file can't crash the workflow before
# it posts a status. If the admin set changes, also update
# .github/board-config.env.
env:
  ADMINS: "EricAndrechek,taitelee"

concurrency:
  # cancel-in-progress: false is deliberate. If a second event
  # cancels an in-flight approval run, the cancelled status reads as
  # neither SUCCESS nor FAILURE in the ruleset's required-check view
  # and the gate stays stuck. Sequential runs trade a few seconds of
  # queueing for a reliable gate.
  group: admin-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  admin-approval:
    # Job display name differs from the commit-status context
    # ("Admin approval") so the PR checks list doesn't show two
    # entries — the posted commit status is the merge gate; this
    # job name just advertises the workflow.
    name: Evaluate admin reviews
    runs-on: [wave-rf-runners]
    timeout-minutes: 5
    steps:
      # Fetch Dependabot's update-type so the bypass below can scope
      # itself to patch/minor only. Gated on Dependabot author —
      # fetch-metadata errors on non-Dependabot PRs. continue-on-error
      # is fail-safe: if metadata can't be read, UPDATE_TYPE will be
      # empty and the bypass below won't fire, so the PR falls through
      # to admin review. A blocked PR is recoverable; an
      # erroneously-merged major bump is not.
      - name: Fetch Dependabot metadata
        id: meta
        if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'app/dependabot'
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Evaluate admin approval and post commit status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_AUTHOR: ${{ github.event.review.user.login }}
          # Empty when fetch-metadata was skipped (non-Dependabot
          # PR) or errored; bypass below treats empty as "not
          # patch/minor" and falls through to admin review.
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type || '' }}
          # target_url for the commit status — "Details" links here.
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # Helper: post a commit status. The workflow always exits 0;
          # the commit status is what gates merge.
          post_status() {
            local state="$1"      # pending | success
            local description="$2"
            gh api -X POST "repos/$REPO/statuses/$PR_HEAD_SHA" \
              -f "state=$state" \
              -f "context=Admin approval" \
              -f "description=$description" \
              -f "target_url=$RUN_URL" > /dev/null
            echo "Posted commit status: state=$state context='Admin approval' description='$description'"
          }

          # Dependabot bypass — patch/minor only.
          # dependabot-automerge.yml handles those hands-off.
          # Major bumps, unknown update-types, and empty UPDATE_TYPE
          # (metadata-fetch failure) fall through to admin review —
          # closed a hole where CodeRabbit's APPROVED review could
          # merge a major bump (see #130).
          #
          # Match both login shapes: "dependabot[bot]" (user
          # context) and "app/dependabot" (some app contexts).
          if [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "app/dependabot" ]]; then
            if [[ "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
              short_type="${UPDATE_TYPE#version-update:semver-}"
              echo "::notice::Dependabot $short_type bump — bypassing admin approval (handled by dependabot-automerge workflow)."
              post_status success "Dependabot $short_type — bypassed"
              exit 0
            fi
            echo "::notice::Dependabot PR with update-type='$UPDATE_TYPE' — not auto-bypassed; falling through to admin review."
          fi

          IFS=',' read -ra admins <<< "$ADMINS"

          # Fast path: if the triggering event is an admin's APPROVED
          # review, trust the payload directly. The reviews API has
          # observable lag after submit events; skipping the round-
          # trip avoids "I approved but the check is still red" for
          # the common case.
          if [[ "$EVENT_NAME" == "pull_request_review" && "$EVENT_ACTION" == "submitted" && "$REVIEW_STATE" == "approved" ]]; then
            for admin in "${admins[@]}"; do
              if [[ "$REVIEW_AUTHOR" == "$admin" ]]; then
                echo "::notice::Admin $REVIEW_AUTHOR just approved PR #$PR_NUM — fast-path success."
                post_status success "Approved by $REVIEW_AUTHOR"
                exit 0
              fi
            done
          fi

          # Slow path: evaluate each user's *latest* review state via
          # the reviews API; a historical APPROVED followed by
          # CHANGES_REQUESTED must not satisfy the gate.
          #
          # group_by(user) | map(max_by(submitted_at)) is unambiguous
          # about which review per user to inspect; `unique_by` sorts
          # internally and could keep an arbitrary review depending
          # on input order.
          #
          # Retry up to 3 times with 2s backoff to absorb review-
          # submit eventual consistency on non-submit triggers
          # (synchronize, opened). API failures post pending with the
          # error in the description so the cause is visible.
          attempts=0
          approvers=""
          admin_found=""
          last_api_err=""
          while [ $attempts -lt 3 ]; do
            set +e
            api_out=$(gh api "repos/$REPO/pulls/$PR_NUM/reviews?per_page=100" \
              --jq '
                sort_by(.user.login)
                | group_by(.user.login)
                | map(max_by(.submitted_at))
                | .[]
                | select(.state == "APPROVED")
                | .user.login
              ' 2>&1)
            api_rc=$?
            set -e

            if [ "$api_rc" -ne 0 ]; then
              last_api_err="$api_out"
              echo "::warning::reviews API call failed on attempt $((attempts + 1)): $api_out"
              approvers=""
            else
              approvers="$api_out"
              last_api_err=""
            fi

            for admin in "${admins[@]}"; do
              if printf '%s\n' "$approvers" | grep -Fxq "$admin"; then
                admin_found="$admin"
                break
              fi
            done
            [ -n "$admin_found" ] && break

            attempts=$((attempts + 1))
            [ $attempts -lt 3 ] && sleep 2
          done

          # If every attempt errored, post pending with the error in
          # the description rather than silently reporting "no admin
          # approval"; pending blocks merge either way, but this
          # surfaces the real cause.
          if [ -z "$admin_found" ] && [ -n "$last_api_err" ]; then
            echo "::error::Unable to read PR reviews after 3 attempts. Last error: $last_api_err"
            post_status pending "Reviews API unreachable; unable to check approval"
            exit 0
          fi

          if [ -n "$admin_found" ]; then
            echo "PR #$PR_NUM has admin approval from $admin_found (latest review state: APPROVED)."
            post_status success "Approved by $admin_found"
            exit 0
          fi

          # No admin approval yet — post pending with the wait list.
          # If non-admin approvers exist, call them out so reviewers
          # see why their approval isn't unblocking merge.
          admin_list=$(IFS=,; echo "${admins[*]}")
          if [[ -z "$approvers" ]]; then
            description="Waiting for approval from one of: $admin_list"
          else
            description="Waiting for admin approval. Current approvers: $(echo "$approvers" | tr '\n' ',' | sed 's/,$//; s/,/, /g'). Required: one of $admin_list"
          fi
          post_status pending "$description"
