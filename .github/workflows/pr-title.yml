name: Lint PR title

# When squash-merging, the PR title becomes the commit message on main.
# This workflow enforces Conventional Commits on the PR title so history
# stays parseable (changelog generation, `git log --oneline`, etc).
#
# Required by the `main branch protection` ruleset as the `Validate`
# check — must report on every PR or merge gets stuck at "pending."
#
# Dual-trigger: `pull_request` runs from the PR head branch (works
# on internal PRs with full permissions for the sticky comment);
# `pull_request_target` runs from the default branch with base-repo
# permissions (so fork PRs also get the sticky comment). Both fire
# on internal PRs — the second run is a harmless duplicate because
# the comment marker and title-check logic are idempotent.
#
# A follow-up PR can drop the `pull_request` trigger once we've
# confirmed `pull_request_target` is firing correctly in production.
# Closes #56 (the dual-trigger transition).

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Include event_name in the group so `pull_request` and
  # `pull_request_target` don't cancel each other. Copilot flagged
  # the original single-key group would let the first-to-start run
  # get cancelled by the second, which on fork PRs could kill the
  # only run (pull_request_target) with permissions to post the
  # sticky comment.
  group: pr-title-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits format
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Keep this type list in sync with CONTRIBUTING.md.
          # Optional `!` before `:` marks a breaking change per
          # Conventional Commits 1.0.0.
          pattern='^(feat|fix|docs|refactor|test|chore|ci|deps|build|perf|revert|style)(\([^)]+\))?!?: [^A-Z].+[^.]$'

          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "PR title OK: $PR_TITLE"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::PR title does not match Conventional Commits format: $PR_TITLE"
          fi

      - name: Post / update sticky comment on failure
        # continue-on-error because GITHUB_TOKEN is read-only for fork
        # PRs, so the comment will fail there — that must not mask the
        # final exit-1 below that drives the required-check status.
        if: steps.check.outputs.passed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- pr-title-lint-comment -->'
          BODY=$(cat <<EOF
          $MARKER
          ## PR title doesn't match Conventional Commits

          **Got:** \`$PR_TITLE\`

          **Expected format:** \`<type>(optional-scope)(optional-!): <lowercase subject, no trailing period>\`

          **Allowed types:** \`feat\`, \`fix\`, \`docs\`, \`refactor\`, \`test\`, \`chore\`, \`ci\`, \`deps\`, \`build\`, \`perf\`, \`revert\`, \`style\`.

          The optional \`!\` before the colon marks a breaking change per [Conventional Commits 1.0.0](https://www.conventionalcommits.org/en/v1.0.0/).

          **Examples:**
          - \`feat: add dedupe cache\`
          - \`fix(ingest): drop duplicate events\`
          - \`feat(api)!: remove deprecated endpoint\`
          - \`chore(deps): bump clickhouse-go to v2.30\`

          ---

          This check is required by the \`main branch protection\` ruleset — merge is blocked until the title matches. Edit the PR title to trigger a re-check automatically. I'll clean up this comment once the title is valid.
          EOF
          )

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -f "body=$BODY" > /dev/null
            echo "Updated existing pr-title-lint comment ($EXISTING)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f "body=$BODY" > /dev/null
            echo "Posted new pr-title-lint comment"
          fi

      - name: Clean up sticky comment on pass
        if: steps.check.outputs.passed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- pr-title-lint-comment -->'
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$EXISTING"
            echo "Removed stale pr-title-lint comment ($EXISTING)"
          fi

      - name: Fail the check if title was invalid
        # Final step owns the exit code so the check's red-X reliably
        # reflects the regex result, independent of comment-step I/O.
        if: steps.check.outputs.passed == 'false'
        run: exit 1
