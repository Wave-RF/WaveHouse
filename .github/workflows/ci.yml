name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# All jobs run in parallel by default. Only integration tests gate on
# unit tests passing (no point running slow integration suite if units fail).

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Check module tidiness
        run: make mod-tidy-check

      - name: Check formatting
        run: make fmt-check

      - name: Vulnerability check
        run: make vulncheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.1.6

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run unit tests with coverage
        run: make coverage

      - name: Enforce coverage threshold & generate badge
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: tmp/coverage/coverage.txt
          local-prefix: github.com/Wave-RF/WaveHouse
          threshold-total: 70
          git-token: ${{ github.ref == 'refs/heads/main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      - name: Coverage summary
        run: |
          echo '## Test Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=tmp/coverage/coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Build all binaries
        run: make build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Run integration tests
        run: make test-integration
