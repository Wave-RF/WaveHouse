name: CI

# Job DAG over the same Makefile targets `make ci` runs locally — local
# `make ci` stays the dev mirror; CI spreads the phases across free
# 4-core public-repo runners and shapes the graph for wall-clock.
#
# READ FIRST: .github/workflows/README.md — the architecture doc. It has
# the DAG diagram, the design invariants (sole required check, the
# poll-not-`needs` pattern, the dual classifier + drift guard, cache key
# policy, e2e sharding, trust domains), and the how-to-add-a-job recipe.
# Comments in this file explain only what's local to a step.
#
# The short version:
#   - e2e (the long pole) has NO `needs`: it classifies the change set
#     itself, builds its own inputs, runs the suite sharded, and applies
#     the merged coverage gate at its tail.
#   - artifact consumers POLL (scripts/ci/wait-artifact.sh) instead of
#     `needs`-waiting, so setup always overlaps producer work.
#   - the aggregator job NAMED "CI" is the ruleset's sole required check
#     (skipped jobs pass; it also cross-checks the two classifiers).

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` isn't in the default trigger set — without it,
    # draft → ready transitions don't re-trigger CI. `edited` is left out
    # deliberately: a title/description edit would cancel + restart a full
    # in-flight run via the concurrency group. Title edits are instead
    # nudged along by housekeeping.yml re-running the failed title job.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Manual re-run escape hatch — `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

# Default-deny; each job below redeclares exactly what it needs. Only the
# docs-preview job (sticky PR comment) holds a write scope.
permissions:
  contents: read

# PR pushes: cancel in-flight, only the latest commit matters. Main pushes:
# queue serially so every commit gets its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ── Change detection ───────────────────────────────────────────────
  # Classifies the changed files (scripts/ci/classify-changes.sh — the
  # single source of truth for the code/docs outputs and their fail-closed
  # rules) so the unit/integration/docs jobs can skip work. The e2e job
  # does NOT wait on this job — it runs the same script itself so it can
  # start immediately; the aggregator cross-checks the two classifications
  # so drift can't silently skip the merged coverage gate.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
      docs: ${{ steps.detect.outputs.docs }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: scripts/ci/classify-changes.sh >> "$GITHUB_OUTPUT"

  # ── PR title (Conventional Commits) ────────────────────────────────
  # The blocking half of the title gate (housekeeping.yml keeps the sticky
  # explainer comment, which needs pull_request_target write perms on fork
  # PRs). Lives under the CI aggregator so "CI" stays the only required
  # check. The script runs from a checkout of the DEFAULT branch — never
  # the PR tree — so a PR can't tamper with its own validator.
  title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check Conventional Commits format
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the CURRENT title + author from the API, not the event
          # payload: re-runs reuse the original payload, so the "fix the
          # title, re-run failed jobs" flow (automated by housekeeping.yml)
          # would otherwise keep judging the stale title.
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}")"
          title="$(jq -r '.title' <<<"$pr_json")"
          author="$(jq -r '.user.login' <<<"$pr_json")"
          # Dependabot's grouped-update titles routinely exceed the 72-char
          # subject cap and the format isn't configurable, so Dependabot PRs
          # are exempt from the length check (the format check still applies).
          if [[ "$author" == "dependabot[bot]" || "$author" == "app/dependabot" ]]; then
            export PR_TITLE_SKIP_LENGTH=1
          fi
          if reason=$(bash scripts/lint-pr-title.sh "$title" 2>&1); then
            echo "PR title OK: $title"
          else
            printf '%s\n' "$reason"
            echo "::error::$(printf '%s' "$reason" | head -1)"
            exit 1
          fi

  # ── Static checks ──────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-env
        with:
          go-cache-suffix: "-lint"
          golangci: "true"
          astro: "true" # check-docs (astro check) reuses the content cache
      # tidy + gofumpt + golangci + vulncheck + shellcheck + actionlint +
      # Biome + markdownlint + misspell + astro check + tsc. No Docker,
      # no browser. (Cache saves are automatic — setup-env's nested
      # actions/cache steps save at job end on an exact-key miss.)
      - name: Run static checks
        run: make verify

  # ── Docs site build ────────────────────────────────────────────────
  # Astro site → docs-dist artifact, feeding the two deploy jobs. Pure
  # pnpm (build-docs → check-docs → build-ts needs no Go toolchain), and
  # only runs when a docs-affecting file changed — Go binaries are no
  # longer built here: compile breakage is already caught by lint
  # (golangci type-checks every package), the test suites, and the e2e
  # job linking the cover binary; release builds by goreleaser-validate /
  # publish-dev.
  docs-build:
    name: Docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth 0 (full history) so the docs build can read each page's
      # real last-commit date from git: Starlight's `lastUpdated` footer
      # silently falls back to the build time on a shallow clone, making
      # every page look freshly edited. PR previews take that cosmetic hit
      # deliberately (depth 1) — the full fetch costs seconds and only the
      # main-push artifact ships to production.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-env
        with:
          go: "false"
          playwright: "true" # rehype-mermaid renders diagrams via Chromium
          astro: "true"
      # DOCS_SKIP_CHECK: the lint job runs check-docs (inside make verify)
      # on this same tree in parallel — repeating it here would serialize
      # ~15s before the build for no added signal.
      - name: Build docs site
        run: make build-docs DOCS_SKIP_CHECK=1
      - name: Upload docs site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: docs/dist
          if-no-files-found: error
          retention-days: 7
          overwrite: true # re-runs of this job re-upload
      # On a lockfile change (= pnpm cache-key rotation; lockfile changes
      # always flip changes.docs=true, so this job runs), drop store
      # entries unreferenced by any workspace project before the post-job
      # save captures the store — else the cache grows unboundedly as
      # deps churn. Runs after the artifact upload, so docs-preview's
      # poll never waits on it.
      - name: Prune pnpm store before save
        if: steps.setup.outputs.pnpm-cache-hit != 'true'
        run: pnpm store prune

  # ── Test suites ────────────────────────────────────────────────────
  # COV_DEFER=1: collect coverage, skip the per-suite render + gate — the
  # e2e job's coverage tail applies every gate once, exactly like local
  # `make ci`.
  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-env
        with:
          go-cache-suffix: "-unit"
      - name: Run Go unit tests + SDK vitest tests
        run: make test-unit test-ts COV_DEFER=1
      - name: Upload coverage fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: tmp/coverage
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Background pull overlaps the ~25s of cache restores below, so
      # testcontainers finds the image already local (a concurrent pull of
      # the same tag is safe — dockerd dedupes layer downloads). Image tag
      # must match tests/integration/setup_test.go.
      - name: Prefetch ClickHouse image (background)
        run: docker pull -q clickhouse/clickhouse-server:latest >/tmp/clickhouse-pull.log 2>&1 &
      - id: setup
        uses: ./.github/actions/setup-env
        with:
          go-cache-suffix: "-integration"
          node: "false" # pure Go + testcontainers ClickHouse
      - name: Run Go integration tests
        run: make test-integration COV_DEFER=1
      - name: Upload coverage fragment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: tmp/coverage
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  # The run's long pole — every serial second here is a second on the PR's
  # wall-clock, so it cuts every dependency edge it can:
  #   - no `needs` at all: it classifies the change set itself (same
  #     script as the changes job; the aggregator cross-checks the two),
  #     so it starts the moment the run is created;
  #   - builds its own inputs (SDK dist + cover binary, in parallel, on a
  #     warm cache) instead of waiting on a builder job;
  #   - runs the suite SHARDED (scripts/e2e-shards.sh): concurrent
  #     orchestrators with an isolated ClickHouse + server each, so the
  #     wall-clock is the slowest shard (~40s), not the file sum (~100s);
  #   - absorbs the consolidated-coverage gate at its tail: the
  #     unit/integration fragments upload before the suite ends, so the
  #     merge + gate costs seconds vs. a whole runner spin-up.
  # On docs-only changes every step below no-ops (job succeeds, ran=false)
  # — the same end state as the suites' job-level skip.
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read # poll + download the sibling suites' coverage fragments mid-run
      pull-requests: read # classify step reads the PR file list
    outputs:
      # 'true' when the suite actually ran — the aggregator fails the run
      # if this job classified the change set differently from the changes
      # job (drift would otherwise silently skip the merged coverage gate).
      ran: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Classify changed files
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: scripts/ci/classify-changes.sh >> "$GITHUB_OUTPUT"
      # Background pull overlaps the ~35s of setup + build below, so the
      # orchestrators find the image already local (a concurrent pull of
      # the same tag is safe — dockerd dedupes layer downloads). Image tag
      # must match scripts/orchestrator/main.go.
      - name: Prefetch ClickHouse image (background)
        if: steps.detect.outputs.code == 'true'
        run: docker pull -q clickhouse/clickhouse-server:latest >/tmp/clickhouse-pull.log 2>&1 &
      # Suffix is -e2e-cov, not -e2e: this cache must carry the
      # cover-instrumented server objects build-cover compiles below, but
      # saves are gated on an exact-key miss — the pre-existing -e2e entry
      # (orchestrator objects only) would exact-hit forever and never
      # absorb them, leaving build-cover cold on every run.
      - id: setup
        if: steps.detect.outputs.code == 'true'
        uses: ./.github/actions/setup-env
        with:
          go-cache-suffix: "-e2e-cov"
      # `-j` builds the prereqs (build-ts ∥ build-cover) concurrently,
      # then fans the suite out over sharded orchestrators (ClickHouse
      # testcontainer + cover binary + vitest subset each). E2E_KEEP_CH:
      # the reaper owns container teardown on CI.
      - name: Build SDK dist + cover binary, run E2E suite
        if: steps.detect.outputs.code == 'true'
        run: make -j "$(nproc)" test-e2e COV_DEFER=1 E2E_SHARDED=1 E2E_KEEP_CH=1
      # ── Consolidated coverage report + gates ──────────────────────────
      # The local tmp/coverage already holds this job's e2e + ts-e2e data;
      # the unit/integration fragments arrive as artifacts, almost always
      # uploaded long before the suite above ends. The wait fails fast
      # when a sibling suite failed OR skipped (skipped = the changes job
      # classified docs-only while this job classified code — the drift
      # the aggregator also guards). Producer names must match the jobs'
      # `name:` fields above.
      - name: Wait for sibling coverage fragments
        if: steps.detect.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          scripts/ci/wait-artifact.sh
          --artifacts coverage-unit,coverage-integration
          --producers "Unit tests,Integration tests"
      - name: Download sibling coverage fragments
        if: steps.detect.outputs.code == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          merge-multiple: true
          path: tmp/coverage
      # `cov report` shells `pnpm exec nyc` for the TS merge — node_modules
      # are already installed (build-ts's pnpm-install prereq above).
      - name: Render consolidated report + gate thresholds
        if: steps.detect.outputs.code == 'true'
        run: make cov
      # Coverage in the job-summary panel. See #133 for post-launch
      # reporting decisions.
      - name: Coverage summary
        if: ${{ !cancelled() && steps.detect.outputs.code == 'true' }}
        run: |
          if [ -f tmp/coverage/total/coverage.txt ]; then
            {
              echo '## Test Coverage (merged unit + integration + e2e)'
              echo '```'
              go tool cover -func=tmp/coverage/total/coverage.txt | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Docs deploys ─────────────────────────────────────────────────────
  # Both deploy jobs check out the DEFAULT branch (or, on push, the pushed
  # main commit itself) and install wrangler from that trusted lockfile —
  # PR-authored code never executes in a job that can read the Cloudflare
  # token (#305). The only PR-derived input is the static docs-dist
  # artifact, uploaded as data. Consequence: a PR changing docs/worker/ or
  # docs/wrangler.jsonc previews through MAIN's worker + config; those
  # changes take effect when the PR merges.
  #
  # Cloudflare's own Workers Builds can't build this site (no headless
  # browser at build time for rehype-mermaid), so we ship from here. See
  # docs/wrangler.jsonc. Both jobs soft-gate on the secrets so a
  # not-yet-configured repo warns and skips instead of failing CI.

  # PRs: upload a non-active version and post its preview URL as a sticky
  # comment. Needs only the build ARTIFACT, not the docs-build job: this
  # job does its whole environment setup (trusted-main checkout, pnpm
  # install) in parallel with docs-build and only then polls for the
  # docs-dist artifact — so the preview lands ~setup-time earlier, and an
  # unrelated test flake never blocks it (the merge gate still waits for
  # everything). Fork PRs skip: no secrets there, nothing to do.
  docs-preview:
    name: Docs preview
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # poll for the docs-dist artifact mid-run
      # The sticky-comment endpoint (/repos/.../issues/{num}/comments)
      # requires `issues: write`; `pull-requests: write` alone doesn't
      # grant it.
      issues: write
      pull-requests: write
    steps:
      # Trusted tree: wrangler + worker source + config resolve from main,
      # not the PR. No persisted credentials — the comment step's fallback
      # `git fetch origin <sha>` works anonymously on a public repo (PR
      # heads are advertised under refs/pull/*). Note this also pins
      # setup-env itself to main's copy in this job.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-env
        with:
          go: "false"
      - name: Install workspace deps (trusted lockfile)
        run: make pnpm-install
      # Same poll pattern as e2e's coverage tail, but INLINE rather than
      # scripts/ci/wait-artifact.sh: this job executes only files resolved
      # from trusted main (README invariant 6), and inline YAML is the
      # reviewed surface — also sidesteps the script-not-on-main-yet
      # transition. Waits for docs-build's artifact, failing fast if that
      # job failed/was cancelled/skipped (the aggregator is red from
      # docs-build itself in those cases — this just stops the wait). Job
      # name in the --jq filter must match docs-build's `name:` field.
      - name: Wait for docs site artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deadline=$(( $(date +%s) + 600 ))
          while :; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[].name]' | jq -e 'index("docs-dist")' >/dev/null; then
              echo "docs-dist artifact is available."
              break
            fi
            bad="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Docs build")
                     | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "skipped") | .name] | join(", ")')"
            if [ -n "$bad" ]; then
              echo "::error::Docs build did not produce an artifact ($bad) — no preview to upload."
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for the docs-dist artifact."
              exit 1
            fi
            echo "docs-dist not ready yet — retrying in 5s."
            sleep 5
          done
      - name: Download docs site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: docs/dist
      - name: Check deploy secrets
        id: cfsecrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping docs preview."
          fi
      # A real upload failure (e.g. a misscoped CLOUDFLARE_API_TOKEN →
      # "Authentication error [code: 10000]") reds the PR instead of hiding
      # — the retry loop first absorbs transient Cloudflare API blips so a
      # one-off hiccup doesn't.
      - name: Upload docs preview
        id: preview
        if: steps.cfsecrets.outputs.ok == 'true'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          log="$RUNNER_TEMP/wrangler-upload.log"
          # Retry absorbs transient CF API blips; a persistent failure falls
          # through to exit 1 and reds the PR.
          n=0
          until pnpm exec wrangler versions upload 2>&1 | tee "$log"; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::wrangler versions upload failed after $n attempts — see log above."
              exit 1
            fi
            echo "::warning::wrangler versions upload failed (attempt $n/3) — retrying in 10s."
            sleep 10
          done
          url="$(grep -iE 'Version Preview URL' "$log" | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1 || true)"
          [ -z "$url" ] && url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log" | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            { echo "### 📚 Docs preview"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Upload succeeded but no preview URL was parsed from the wrangler output."
          fi

      # One sticky comment, updated in place (matched by the marker) so
      # re-pushes don't spam the PR — built by scripts/ci/docs-preview-comment.sh,
      # which resolves from the trusted MAIN checkout like everything else in
      # this job. Runs whether the upload succeeded or failed — `!cancelled()`
      # + an outcome check, since a bare `if:` is implicitly `success()` and
      # would skip after the upload step's exit 1 — so a failed deploy is
      # noted rather than leaving a stale "live" comment. Skipped only when
      # no upload was attempted (outcome == 'skipped').
      #
      # Transition guard: until this PR merges, main doesn't have the script
      # yet — skip with a notice instead of failing (the preview URL is still
      # in the step summary). Drop the guard once it's on main.
      - name: Comment docs preview status
        if: ${{ !cancelled() && (steps.preview.outcome == 'success' || steps.preview.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
        run: |
          if [ ! -f scripts/ci/docs-preview-comment.sh ]; then
            echo "::notice::scripts/ci/docs-preview-comment.sh is not on the default branch yet — skipping the sticky comment."
            exit 0
          fi
          scripts/ci/docs-preview-comment.sh

  # Production: push (or manual dispatch) on main → publish the active
  # version served on wavehouse.dev. Gated on the full pipeline (lint +
  # docs build + every suite, with the merged coverage gate inside e2e) —
  # not best-effort: a failure here surfaces as a red CI run.
  # `title`/`docs-preview` are deliberately NOT in `needs`: they skip on
  # push events, and a skipped need would skip this job too.
  docs-deploy:
    name: Docs deploy
    needs: [changes, lint, docs-build, unit, integration, e2e]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Push-to-main checkout IS the trusted tree at the pushed commit.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: setup
        uses: ./.github/actions/setup-env
        with:
          go: "false"
      - name: Install workspace deps
        run: make pnpm-install
      - name: Download docs site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: docs/dist
      - name: Check deploy secrets
        id: cfsecrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping docs deploy."
          fi
      - name: Deploy docs (production)
        if: steps.cfsecrets.outputs.ok == 'true'
        working-directory: docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  # ── Aggregator: the ruleset's sole required check ──────────────────
  # Fails when any upstream job failed or was cancelled; treats `skipped`
  # as a pass (path-filtered suites, event-filtered title/deploy jobs are
  # intentional no-ops). `!cancelled()` rather than `always()` so a
  # cancel-in-progress superseded run doesn't burn a runner just to report
  # a failure nobody reads — the replacement run produces the fresh "CI".
  ci:
    name: CI
    needs:
      [
        changes,
        title,
        lint,
        docs-build,
        unit,
        integration,
        e2e,
        docs-preview,
        docs-deploy,
      ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Gate on all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          CHANGES_CODE: ${{ needs.changes.outputs.code }}
          E2E_RAN: ${{ needs.e2e.outputs.ran }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<<"$NEEDS"
          bad="$(jq -r '[to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key] | join(", ")' <<<"$NEEDS")"
          if [ -n "$bad" ]; then
            echo "::error::Jobs failed or were cancelled: $bad"
            exit 1
          fi
          # e2e classifies the change set for itself (it has no `needs`, so
          # it can start instantly). Both classifications come from the same
          # script over the same API data, so they only diverge on a
          # transient API error — fail closed rather than let that skip the
          # suite + merged coverage gate on a code change.
          if [ "$CHANGES_CODE" = "true" ] && [ "$E2E_RAN" != "true" ]; then
            echo "::error::Classifier drift: changes says code=true but the e2e job classified docs-only and ran nothing."
            exit 1
          fi
          echo "All jobs succeeded (or were intentionally skipped)."

  # ── Wall-clock summary (non-gating) ────────────────────────────────
  # Writes a per-job timing table to the run's Summary page so "where did
  # the time go" never needs per-job archaeology. Deliberately NOT in the
  # aggregator: it needs a checkout + an API call, and the aggregator is
  # the critical path's last hop. continue-on-error so a hiccup here can
  # never red a run the aggregator passed.
  timing:
    name: Timing summary
    needs:
      [
        changes,
        title,
        lint,
        docs-build,
        unit,
        integration,
        e2e,
        docs-preview,
        docs-deploy,
      ]
    if: ${{ !cancelled() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # reads the run's own job timings
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Write wall-clock table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/timing-summary.sh >> "$GITHUB_STEP_SUMMARY"
