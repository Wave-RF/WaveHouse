name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Default `pull_request` types are [opened, synchronize, reopened]
    # which do NOT include `ready_for_review`. Without it, flipping a
    # PR from draft → ready doesn't re-trigger CI, so the e2e job
    # (gated on `draft == false`) silently skips on the existing run.
    # Adding `ready_for_review` ensures the full suite runs at the
    # moment the PR becomes review-ready.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: write

# All jobs run in parallel by default. Only integration tests gate on
# unit tests passing (no point running slow integration suite if units fail).

jobs:
  check:
    name: Check
    runs-on: [wave-rf-runners]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Check module tidiness
        run: make mod-tidy-check

      - name: Check formatting
        run: make fmt-check

      - name: Vulnerability check
        run: make vulncheck

  lint:
    name: Lint
    runs-on: [wave-rf-runners]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20  # v9.2.0
        with:
          version: v2.11.4
          # `verify` runs `golangci-lint config verify`, which fetches a
          # JSON schema from golangci-lint.run. That fetch flakes on
          # network blips and has failed Lint several times for reasons
          # unrelated to our code. The actual linter run is unaffected.
          verify: false

  test:
    name: Test
    runs-on: [wave-rf-runners]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Run unit tests with coverage
        run: make coverage

      - name: Enforce coverage threshold & generate badge
        uses: vladopajic/go-test-coverage@f190f667e23b4441202d0bab0f8c2e7bce8925b6  # v2.18.4
        with:
          # Threshold + exclude.paths live in .testcoverage.yml (70% total).
          config: ./.testcoverage.yml
          git-token: ${{ github.ref == 'refs/heads/main' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      - name: Coverage summary
        run: |
          echo '## Test Coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=tmp/coverage/coverage.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  build:
    name: Build
    runs-on: [wave-rf-runners]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Build all binaries
        run: make build

  integration:
    name: Integration Tests
    runs-on: [wave-rf-runners]
    needs: [test]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Run integration tests
        run: make test-integration

  sdk-test:
    name: SDK Tests
    # Vitest unit tests for the TypeScript SDK. Fast (~30s) and runs on
    # every PR — no path filter so a deps bump or workflow tweak still
    # exercises the suite.
    runs-on: [wave-rf-runners]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: clients/ts/package-lock.json

      - name: Install SDK dependencies
        working-directory: clients/ts
        run: npm ci

      - name: Run SDK unit tests
        working-directory: clients/ts
        run: npm test

  e2e:
    name: E2E Tests
    # End-to-end SDK ↔ WaveHouse ↔ ClickHouse run through docker compose.
    # `tests/sdk/setup.ts` (vitest globalSetup) starts the stack, applies
    # SQL fixtures, and bootstraps a permissive policy. Slower than other
    # jobs (Docker build + container startup) — gate on `ready_for_review`
    # so draft pushes don't spend runner minutes.
    #
    # Marked `continue-on-error: true` pending follow-up. Wiring the job
    # in surfaced two pre-existing bugs (#72): a query.test "raw SQL"
    # assertion that races against Bento's ingest batch flush, and a
    # streaming test that exercises native WebSocket (already bumped
    # Node to 22 which provides it — but keeping the flag while the
    # raw-SQL race is still unfixed). Drop once follow-up lands.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: [wave-rf-runners]
    needs: [build]
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: tests/sdk/package-lock.json

      # Build the wavehouse image once via the shared remote BuildKit
      # and `--load` it into the runner pod's Docker daemon (DinD
      # sidecar) so the docker compose stack started by setup.ts uses
      # the prebuilt image instead of re-building from source. The
      # BUILDX_BUILDER env var is preset on the runner pod, so buildx
      # transparently routes to the shared builder + cache.
      - name: Build wavehouse image (remote BuildKit, --load)
        run: docker buildx build --load -t wavehouse:e2e -f deployments/Dockerfile .

      - name: Run E2E tests
        env:
          # Setting WAVEHOUSE_IMAGE makes tests/compose.yaml use the
          # prebuilt image (loaded by the previous step) instead of
          # invoking its own `build:` directive. See header comment in
          # tests/compose.yaml.
          WAVEHOUSE_IMAGE: wavehouse:e2e
        run: make test-e2e
