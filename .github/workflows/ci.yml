name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` isn't in the default trigger set — without it,
    # draft → ready transitions don't re-trigger CI.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Manual re-run escape hatch — `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: write
  # The docs-deploy tail steps post a sticky preview-URL comment on PRs.
  pull-requests: write

# PR pushes: cancel in-flight, only the latest commit matters. Main pushes:
# queue serially so every commit gets its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Single job: `make ci` runs every gate in one process so caches and
    # build artifacts stay hot across phases. Parallelism lives in the
    # Makefile.
    name: CI
    runs-on: ubuntu-latest
    # Public-repo ubuntu-latest (4-core). Warm: ~5-10 min. Cold: ~15.
    # 45 leaves headroom + a hung-job cap.
    timeout-minutes: 45
    steps:
      # Composite actions can't self-checkout — checkout first.
      # fetch-depth: 0 (full history) so the docs build can read each page's
      # real last-commit date from git: Starlight's `lastUpdated` footer
      # silently falls back to the build time on the default shallow (depth-1)
      # clone, making every page look freshly edited.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup-env

      - name: Run CI pipeline
        # Verify + builds + unit/SDK tests in parallel, then integration →
        # e2e → cov sequentially. Mirrors local `make ci` exactly.
        run: make ci

      # Saves run on every branch, gated on `*-cache-hit != 'true'` so a
      # same-key re-push is a no-op. PRs inherit main's cache scope, so a
      # main-push save warms every PR. Saves mirror restores in setup-env
      # — keep paths and keys in sync.
      - name: Save Go module + build cache
        if: steps.setup.outputs.gobuild-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Save golangci-lint cache
        if: steps.setup.outputs.golangci-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .bin
            ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}

      # Drop store entries unreferenced by any workspace project before
      # save, so the cache doesn't grow unboundedly as deps churn.
      - name: Prune pnpm store before save
        if: steps.setup.outputs.pnpm-cache-hit != 'true'
        shell: bash
        run: pnpm store prune

      # Path resolved dynamically — see setup-env header.
      - name: Save pnpm store cache
        if: steps.setup.outputs.pnpm-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup.outputs.pnpm-store-path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Save Playwright browser cache
        if: steps.setup.outputs.playwright-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Save Astro content cache
        if: steps.setup.outputs.astro-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: docs/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'docs/astro.config.mjs') }}

      # Coverage in the job-summary panel. See #133 for post-launch
      # reporting decisions.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f tmp/coverage/total/coverage.txt ]; then
            {
              echo '## Test Coverage (merged unit + integration + e2e)'
              echo '```'
              go tool cover -func=tmp/coverage/total/coverage.txt | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f tmp/coverage/unit/coverage.txt ]; then
            {
              echo '## Test Coverage (unit only — full pipeline did not complete)'
              echo '```'
              go tool cover -func=tmp/coverage/unit/coverage.txt | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Docs deploy ──────────────────────────────────────────────────
      # `make ci` already built the site (build-all → build-docs renders
      # Mermaid via Chromium + validates links → docs/dist/). These tail
      # steps reuse that artifact instead of rebuilding, and run only when
      # the WHOLE pipeline above is green: this head step is gated on
      # success() explicitly, and every step below chains off its outputs,
      # so any earlier failure short-circuits the deploy. Cloudflare's own
      # Workers Builds can't build this site (no headless browser at build
      # time), so we ship from here. See docs/wrangler.jsonc.

      # Only deploy when docs-affecting files actually changed, so unrelated
      # Go-only PRs/merges don't upload previews or redeploy prod. Computed
      # from the GitHub API (the checkout is shallow, so `git diff` against
      # the base can't see it). Skipped on fork PRs — no secrets there.
      - name: Detect docs changes
        id: docs_changed
        if: >-
          success() &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "result=true" >> "$GITHUB_OUTPUT"; exit 0   # manual → always
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename' || true)"
          else
            files="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${{ github.event.before }}...${{ github.sha }}" \
              --jq '.files[].filename' || true)"
          fi
          # Empty (API hiccup / new branch) → deploy to be safe.
          if [ -z "$files" ] || printf '%s\n' "$files" | grep -qE '^(docs/|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.github/workflows/ci\.yml|\.github/actions/setup-env/)'; then
            echo "result=true" >> "$GITHUB_OUTPUT"
          else
            echo "result=false" >> "$GITHUB_OUTPUT"
          fi

      # Soft-gate on the secrets so a not-yet-configured repo (or a run
      # before they're added) warns and skips instead of failing CI.
      - name: Check deploy secrets
        id: cfsecrets
        if: steps.docs_changed.outputs.result == 'true'
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping docs deploy."
          fi

      # Production: push (or manual dispatch) on main → publish the active
      # version served on wavehouse.dev. Not best-effort: a failure here
      # should surface as a red CI run.
      - name: Deploy docs (production)
        if: >-
          steps.cfsecrets.outputs.ok == 'true'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        working-directory: docs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      # PRs: upload a non-active version and capture its preview URL. A real
      # upload failure (e.g. a misscoped CLOUDFLARE_API_TOKEN → "Authentication
      # error [code: 10000]") reds the PR instead of hiding — the retry loop
      # first absorbs transient Cloudflare API blips so a one-off hiccup
      # doesn't. (Still gated behind the whole `make ci` above, so an unrelated
      # test flake there can also block it.)
      - name: Upload docs preview
        id: preview
        if: steps.cfsecrets.outputs.ok == 'true' && github.event_name == 'pull_request'
        working-directory: docs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          log="$RUNNER_TEMP/wrangler-upload.log"
          # Retry absorbs transient CF API blips; a persistent failure falls
          # through to exit 1 and reds the PR.
          n=0
          until pnpm exec wrangler versions upload 2>&1 | tee "$log"; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then
              echo "::error::wrangler versions upload failed after $n attempts — see log above."
              exit 1
            fi
            echo "::warning::wrangler versions upload failed (attempt $n/3) — retrying in 10s."
            sleep 10
          done
          url="$(grep -iE 'Version Preview URL' "$log" | grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' | head -1 || true)"
          [ -z "$url" ] && url="$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$log" | head -1 || true)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            { echo "### 📚 Docs preview"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Upload succeeded but no preview URL was parsed from the wrangler output."
          fi

      # One sticky comment, updated in place (matched by the marker) so
      # re-pushes don't spam the PR. Runs whether the upload succeeded or
      # failed — `!cancelled()` + an outcome check, since a bare `if:` is
      # implicitly `success()` and would skip after the upload step's exit 1 —
      # so a failed deploy is noted rather than leaving a stale "live" comment.
      # Skipped only when no upload was attempted (outcome == 'skipped'). gh +
      # GITHUB_TOKEN, same pattern as the triage/housekeeping workflows.
      - name: Comment docs preview status
        if: ${{ !cancelled() && (steps.preview.outcome == 'success' || steps.preview.outcome == 'failure') }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.preview.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_OUTCOME: ${{ steps.preview.outcome }}
        run: |
          marker='<!-- docs-preview-comment -->'
          # Build a skimmable status comment (one labelled bullet per fact).
          # Commit metadata — subject, author names/emails, and the commit's
          # own-timezone timestamp (%cI) — is read from git, not the REST API,
          # which normalizes commit dates to UTC and drops the zone. GitHub
          # @-logins aren't in git, so author/committer logins come from one
          # commits-API call (GitHub matches them by verified email), used only
          # when the call succeeds, with a fallback that reads the login out of
          # a github.com noreply address. fetch-depth: 0 guarantees the head
          # commit is present. All user-controlled text (subject, names) is only
          # ever a printf %s arg, never the format string, so a `%` can't act as
          # a format directive.
          git cat-file -e "${SHA}^{commit}" 2>/dev/null || git fetch --quiet origin "$SHA" 2>/dev/null || true
          server="${GITHUB_SERVER_URL:-https://github.com}"
          # @-link a person when a login is known, else show their plain name;
          # login_from_email reads it out of [ID+]login@users.noreply.github.com.
          gh_link() { if [ -n "$2" ]; then printf '[@%s](%s/%s)' "$2" "$server" "$2"; else printf '%s' "$1"; fi; }
          login_from_email() { case "$1" in *@users.noreply.github.com) e="${1%@users.noreply.github.com}"; printf '%s' "${e#*+}";; esac; }

          subject="$(git show -s --format=%s "$SHA" 2>/dev/null || true)"
          [ -z "$subject" ] && subject='(commit subject unavailable)'
          author_name="$(git show -s --format=%an "$SHA" 2>/dev/null || true)"
          author_email="$(git show -s --format=%ae "$SHA" 2>/dev/null || true)"
          committer_name="$(git show -s --format=%cn "$SHA" 2>/dev/null || true)"
          committer_email="$(git show -s --format=%ce "$SHA" 2>/dev/null || true)"

          # Logins, best-effort: one commits-API call (TSV: author, committer),
          # used only on success so a transient API error can't leak its body
          # into the comment; then a noreply-email fallback.
          author_login=''; committer_login=''
          if logins="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}" --jq '[.author.login // "", .committer.login // ""] | @tsv' 2>/dev/null)"; then
            author_login="$(printf '%s' "$logins" | cut -f1)"
            committer_login="$(printf '%s' "$logins" | cut -f2)"
          fi
          [ -z "$author_login" ] && author_login="$(login_from_email "$author_email")"
          [ -z "$committer_login" ] && committer_login="$(login_from_email "$committer_email")"

          # Author(s): commit author, then Co-authored-by names, each @-linked
          # when possible, de-duplicated by name.
          authors="$(gh_link "$author_name" "$author_login")"
          seen="|$author_name|"
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            cname="$(printf '%s' "$line" | sed -E 's/ *<[^>]*> *$//; s/[[:space:]]+$//')"
            cmail="$(printf '%s' "$line" | sed -nE 's/.*<([^>]*)>.*/\1/p')"
            [ -z "$cname" ] && continue
            case "$seen" in *"|$cname|"*) continue ;; esac
            authors="$authors, $(gh_link "$cname" "$(login_from_email "$cmail")")"
            seen="$seen$cname|"
          done < <(git show -s --format=%B "$SHA" 2>/dev/null \
            | grep -iE '^[[:space:]]*Co-authored-by:' | sed -E 's/^[^:]*:[[:space:]]*//')
          [ -z "$author_name" ] && authors='(author unavailable)'

          # A distinct human committer (someone else applied the patch); skip
          # GitHub's web-flow bot and anyone already credited above.
          if [ -n "$committer_name" ] && [ "$committer_name" != "$author_name" ] && [ "$committer_name" != "GitHub" ]; then
            case "$seen" in
              *"|$committer_name|"*) ;;
              *) authors="$authors (committed by $(gh_link "$committer_name" "$committer_login"))" ;;
            esac
          fi

          # Commit time in its own timezone: 2026-06-09T10:04:27-04:00 -> 2026-06-09 10:04 (UTC-04:00)
          ciso="$(git show -s --format=%cI "$SHA" 2>/dev/null || true)"
          committed='(unknown)'
          if [ -n "$ciso" ]; then
            day="${ciso%%T*}"; hm="${ciso#*T}"; hm="${hm:0:5}"
            case "$ciso" in *Z|*+00:00) off='UTC' ;; *) off="UTC${ciso: -6}" ;; esac
            committed="$day $hm ($off)"
          fi
          # Deploy time in the maintainer team's zone, DST-aware (EST/EDT); UTC
          # if the runner lacks the zone. Distinct from the commit time — a
          # re-run, or a push made long after authoring, makes them differ.
          deployed="$(TZ='America/Detroit' date '+%Y-%m-%d %H:%M %Z')"
          commit_url="$server/${GITHUB_REPOSITORY}/commit/${SHA}"

          # Common bullets, built once (one labelled fact per line). `printf --`
          # because the format starts with a list dash; user-controlled values
          # are %s args here, and again in the final body printf below, so a `%`
          # never reaches a format string.
          bullets="$(printf -- '- **Commit** — [`%s`](%s): %s\n- **Author** — %s\n- **Committed** — %s' \
            "${SHA:0:7}" "$commit_url" "$subject" "$authors" "$committed")"
          # Headline + final time-label reflect how the upload actually went.
          case "$PREVIEW_OUTCOME/${URL:+url}" in
            success/url) headline="📚 **Docs preview is live** → $URL"; last="- **Deployed** — $deployed" ;;
            success/)    headline="📚 **Docs preview** uploaded, but its URL could not be parsed from the wrangler output — see the run log."; last="- **Deployed** — $deployed" ;;
            *)           headline="⚠️ **Docs preview failed to upload** (3 attempts) — any earlier preview is now stale. See the run log."; last="- **Upload failed** — $deployed" ;;
          esac
          body="$(printf '%s\n%s\n\n%s\n%s' "$marker" "$headline" "$bullets" "$last")"
          cid="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- docs-preview-comment -->"))) | .[0].id // empty' | head -1 || true)"
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${cid}" -f body="$body" >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -f body="$body" >/dev/null
          fi
          echo "Updated docs-preview comment on PR #${PR} (outcome=${PREVIEW_OUTCOME}, url=${URL:-none})"
