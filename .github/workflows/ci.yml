name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Default `pull_request` types are [opened, synchronize, reopened] which
    # do NOT include `ready_for_review`. Without it, flipping a PR from draft
    # → ready doesn't re-trigger CI, so the suite silently skips on the
    # existing run. Adding `ready_for_review` ensures a full CI pass at the
    # moment the PR becomes review-ready.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Manual escape hatch for re-running CI on demand (e.g. when GitHub
  # silently drops a `synchronize` event on a long-lived branch). Run via
  # `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: write

# PR pushes: cancel any in-flight run for the same PR (only the latest commit
# matters). Main pushes: don't cancel — let runs queue serially in the same
# group so every commit on main produces a clean coverage badge instead of
# losing a mid-flight run to a follow-up commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Single-pod pipeline. Was previously six fan-out jobs (lint / test /
    # build / integration / sdk-test / e2e) — collapsed because:
    #
    #   1. Pod budget. The ARC pool maxes at 8 pods, shared with
    #      orchestration workflows (claude-review, admin-approval,
    #      project-orchestrator, etc.). Six CI jobs ate most of the pool
    #      and queued concurrent PRs. One job leaves seven pods free.
    #   2. Cache locality. The Go module cache, build cache, .bin/, pnpm
    #      store, and bin/wavehouse-cov all stay hot across phases — no
    #      artifact upload/download choreography between jobs.
    #   3. Make is the source of truth. CI is now literally `make ci`, so
    #      a different CI tool's pipeline file is one line.
    #
    # The Makefile's `ci` target handles parallelization internally
    name: CI
    runs-on: [wave-rf-runners]
    # Sum of the previous per-job timeouts was ~105 min; in practice on a
    # warm cache the whole pipeline finishes in ~15 min. 45 min gives
    # plenty of headroom for cold caches + slow E2E without leaving a
    # genuinely-hung pod sitting around forever.
    timeout-minutes: 45
    steps:
      # Composite actions cannot perform their own checkout — the workflow
      # must land the repo first so the `./.github/actions/setup-env` path
      # resolves on the runner.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: ./.github/actions/setup-env

      - name: Run CI pipeline
        # `make ci` runs verify + every build variant + unit tests + SDK
        # tests in parallel (under -j 4), then test-integration → test-e2e
        # → cov sequentially. Mirrors local `make ci` exactly.
        run: make ci

      # Cache save: every branch (PR + main), but only when the exact
      # key wasn't already in the cache server. The cache-hit gate is
      # what controls the no-op skip — it short-circuits before the
      # action ever runs, so a same-key re-push is essentially free
      # (the post-step doesn't get a chance to fire).
      #
      # Why the previous main-only gate is gone: cache traffic now
      # lands on caches.dmz.local:3000 at LAN speeds (~5 ms RTT), so
      # the ~30-60s tar+upload cost of a first PR-push save is paid
      # back almost immediately by every subsequent push to that
      # branch (and every other PR with the same go.sum / lockfiles)
      # hitting warm restores instead of cold-building `make ci` for
      # ~270 s. The first-save-per-hash-tuple is the only push that
      # pays the cost; everything after is hit-skipped here.
      #
      # Cache scope semantics: actions/cache saves under the workflow's
      # ref scope. Each PR's ref (refs/pull/N/merge) inherits the base
      # ref's (main's) cache, so a main-push save populates every PR's
      # restore. PR-push saves populate same-branch re-runs AND any
      # later main-push restore on the same key. Cross-PR sharing is
      # opportunistic: PRs against the same base see each other's
      # saves when their key tuples match — that's the design intent
      # (one PR's `go mod download` warms the next PR's).
      #
      # Three save steps mirror the three restore caches in setup-env —
      # paths and keys must stay in sync.
      - name: Save Go module + build cache
        if: steps.setup.outputs.gobuild-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Save golangci-lint cache
        if: steps.setup.outputs.golangci-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .bin
            ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}

      - name: Save pnpm store cache
        if: steps.setup.outputs.pnpm-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('clients/ts/pnpm-lock.yaml', 'tests/e2e/sdk/pnpm-lock.yaml', 'docs/pnpm-lock.yaml') }}

      # Coverage summary in the run's job summary panel. Was previously in
      # the `test` job; preserved here so the per-run "## Test Coverage"
      # block in the GH Actions UI doesn't disappear with the job collapse.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f tmp/coverage/total/coverage.txt ]; then
            {
              echo '## Test Coverage (merged unit + integration + e2e)'
              echo '```'
              go tool cover -func=tmp/coverage/total/coverage.txt | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f tmp/coverage/unit/coverage.txt ]; then
            {
              echo '## Test Coverage (unit only — full pipeline did not complete)'
              echo '```'
              go tool cover -func=tmp/coverage/unit/coverage.txt | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Stash the merged coverage profile + config for the publish-badge
      # job to pick up. Only on main pushes — PR runs don't publish and
      # don't need to spend the upload time.
      - name: Upload coverage profile (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-profile
          path: |
            tmp/coverage/total/coverage.txt
            .testcoverage.yml
          if-no-files-found: error
          retention-days: 1

  # Coverage badge publish — separate job so the `vladopajic/go-test-coverage`
  # Docker action's image (~14-20s pre-pull every time it appears in the
  # job graph) doesn't tax PR runs. GitHub pre-pulls Docker-typed actions
  # regardless of step-level `if:` gating, so the only way to skip the
  # pull on PR runs is to put the action in a job that doesn't materialize
  # on PRs at all.
  #
  # Required-check note: the ruleset's required-check `CI` corresponds to
  # the workflow's name (this whole file). When `publish-badge` is skipped
  # entirely (its `if:` evaluates false on PRs), the workflow conclusion is
  # still success as long as `ci` succeeded — that's what the ruleset checks.
  publish-badge:
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: [wave-rf-runners]
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Need the working copy because go-test-coverage walks file paths from
      # the coverage profile against the source tree to render the badge.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Restore coverage profile from ci job
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: coverage-profile
          # download-artifact extracts the artifact's relative paths back
          # to the job workspace root — coverage.txt lands at
          # tmp/coverage/total/coverage.txt, config at .testcoverage.yml.

      # v2.18.8 fixes a regression in v2.18.5–v2.18.7 where
      # findFilePathMatchingSearch returned -1 on an exact filename
      # match (PR #312 / issue from #308). v2.18.7 surfaced as
      # "could not find file [github.com/.../internal/api/dlq.go]"
      # on the first profile entry whose stripped name matched a
      # walked file at pos 0.
      #
      # `make ci` already enforced the threshold via `make cov` →
      # scripts/coverage.sh → `go tool go-test-coverage`. This step is
      # purely the badge publish; the action's own threshold check is
      # redundant but harmless (config + profile already satisfy it).
      - name: Publish coverage badge
        uses: vladopajic/go-test-coverage@a93b868a4cbcbf18dc3781650fad241f0020e609 # v2.18.8
        with:
          config: ./.testcoverage.yml
          git-token: ${{ secrets.GITHUB_TOKEN }}
          git-branch: badges
