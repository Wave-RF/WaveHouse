name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `ready_for_review` isn't in the default trigger set — without it,
    # draft → ready transitions don't re-trigger CI.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  # Manual re-run escape hatch — `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: write

# PR pushes: cancel in-flight, only the latest commit matters. Main pushes:
# queue serially so every commit gets its own run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    # Single job: `make ci` runs every gate in one process so caches and
    # build artifacts stay hot across phases. Parallelism lives in the
    # Makefile.
    name: CI
    runs-on: [wave-rf-runners]
    # Warm: ~2 min. Cold: ~5-8 min. 45 leaves headroom + a hung-job cap.
    timeout-minutes: 45
    steps:
      # Composite actions can't self-checkout — checkout first.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: setup
        uses: ./.github/actions/setup-env

      - name: Run CI pipeline
        # Verify + builds + unit/SDK tests in parallel, then integration →
        # e2e → cov sequentially. Mirrors local `make ci` exactly.
        run: make ci

      # Saves run on every branch, gated on `*-cache-hit != 'true'` so a
      # same-key re-push is a no-op. PRs inherit main's cache scope, so a
      # main-push save warms every PR. Saves mirror restores in setup-env
      # — keep paths and keys in sync.
      - name: Save Go module + build cache
        if: steps.setup.outputs.gobuild-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: gobuild-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}

      - name: Save golangci-lint cache
        if: steps.setup.outputs.golangci-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .bin
            ~/.cache/golangci-lint
          key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}

      # Drop store entries unreferenced by any workspace project before
      # save, so the cache doesn't grow unboundedly as deps churn.
      - name: Prune pnpm store before save
        if: steps.setup.outputs.pnpm-cache-hit != 'true'
        shell: bash
        run: pnpm store prune

      # Path resolved dynamically — see setup-env header.
      - name: Save pnpm store cache
        if: steps.setup.outputs.pnpm-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.setup.outputs.pnpm-store-path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('clients/ts/pnpm-lock.yaml', 'tests/e2e/sdk/pnpm-lock.yaml', 'docs/pnpm-lock.yaml') }}

      - name: Save Playwright browser cache
        if: steps.setup.outputs.playwright-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('docs/pnpm-lock.yaml') }}

      - name: Save Astro content cache
        if: steps.setup.outputs.astro-cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: docs/.astro
          key: astro-${{ runner.os }}-${{ hashFiles('docs/pnpm-lock.yaml', 'docs/astro.config.mjs') }}

      # Coverage in the job-summary panel. See #133 for post-launch
      # reporting decisions.
      - name: Coverage summary
        if: always()
        run: |
          if [ -f tmp/coverage/total/coverage.txt ]; then
            {
              echo '## Test Coverage (merged unit + integration + e2e)'
              echo '```'
              go tool cover -func=tmp/coverage/total/coverage.txt | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f tmp/coverage/unit/coverage.txt ]; then
            {
              echo '## Test Coverage (unit only — full pipeline did not complete)'
              echo '```'
              go tool cover -func=tmp/coverage/unit/coverage.txt | tail -n 30
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
