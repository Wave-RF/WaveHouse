name: Publish dev image

# Pushes a rolling dev image to GHCR on every push to main:
#   - :dev         rolling pointer to the latest main commit
#   - :dev-<sha>   immutable point-in-time reference
#
# Same shape as release.yml — native build jobs, then one job that assembles
# and pushes — because cgo makes cross-compiling impossible here (see the
# header of .goreleaser.yaml for the measurements). The difference is scope:
# a dev build publishes ONLY the image, so it builds only the two Linux
# targets that go into it. darwin/arm64 is not built here; its PR-time proof
# is goreleaser-validate.yml, which builds all three on a config or
# go.mod/go.sum change.
#
# A synthetic local tag (v0.0.0-dev.<short-sha>) anchors goreleaser's .Version
# on HEAD; the tag is never pushed to origin.
#
# Real tagged releases (`v*`) flow through release.yml against the same
# .goreleaser.yaml, producing archives, a GitHub Release and `:vX.Y.Z` plus a
# moving channel pointer — `:latest` for a stable tag, but
# `:alpha`/`:beta`/`:rc`/`:next` for a prerelease, which therefore never
# touches `:latest`. Cleanup of old dev-<sha> tags is handled by
# cleanup-ghcr.yml.
#
# The TypeScript SDK publishes separately — see publish-npm.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; only `publish` is elevated.
permissions:
  contents: read

concurrency:
  # The :dev tag should track HEAD, so cancel any in-flight build
  # when a newer commit lands. The :dev-<sha> tag is only pushed
  # at the end, so cancellation can't leave the registry
  # inconsistent.
  group: publish-dev
  cancel-in-progress: true

jobs:
  build:
    name: Build linux/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: true
      matrix:
        # Only what the image needs. Must stay a subset of
        # .goreleaser.yaml's declared goos/goarch.
        include:
          - goarch: amd64
            runner: ubuntu-latest
          - goarch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads full git history for commit info. Matches
          # release.yml.
          fetch-depth: 0
          # Same reasoning as release.yml: a third-party action and a full
          # `go mod download` run here, and nothing needs authenticated git.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          # Opt out of setup-go's bundled cache and cache the half that
          # earns its keep, below. The bundled one stores ~/go/pkg/mod AND
          # ~/.cache/go-build under one entry (~1 GB stored), keyed on the
          # root go.mod — setup-go hashed go.sum through v6.2.0 and go.mod
          # from v6.3.0 (actions/setup-go#705). So roughly half of it
          # re-stores the module tree ci.yml already keeps once as
          # `gomod-v1` — the duplication #443 is about.
          cache: false

      # The build objects are the reason this job is fast, so cache them on
      # their own key.
      #
      # `runner.arch` is new in the key and load-bearing: both legs of this
      # matrix report `runner.os == 'Linux'`, so the pre-chtypes key
      # (`gobuild-v3-<os>-go-release-…`) would have the amd64 and arm64 legs
      # overwriting each other's entry every run — a guaranteed miss on one of
      # them, forever. Still the `gobuild-v3` family and the same key inputs as
      # setup-env's (see .github/workflows/README.md); `-release` keeps these
      # from restoring into ci.yml's native test-build flavors, which carry
      # different tags and a coverage instrumentation variant.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: gobuild-v3-${{ runner.os }}-${{ runner.arch }}-go-release-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            gobuild-v3-${{ runner.os }}-${{ runner.arch }}-go-release-

      # And read — never write — ci.yml's shared module tree, so dropping
      # setup-go's bundled cache doesn't leave this job re-downloading ~112 MB
      # of modules on every push. This workflow runs on main, the same scope
      # ci.yml saves `gomod-v1` into, so the entry is there to hit. No arch in
      # this key: the module cache is downloaded source, identical on both
      # legs, so the arm64 leg reads the entry amd64 jobs wrote.
      #
      # restore, not cache: a full actions/cache would add a post-step save,
      # and this job has no business writing the entry every ci.yml Go job
      # shares — it never runs `go mod download` for the full graph (see the
      # cov note in the Makefile for why a partial save there is corrosive).
      # Restore-only writes nothing, so it costs 0 GB of the budget.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: gomod-v1-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            gomod-v1-${{ runner.os }}-

      # Before the build: if `ubuntu-latest` ever moves to arm64 this would
      # otherwise publish two identical arm64 binaries under different names.
      - name: Assert the runner is linux/${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          host_os=$(go env GOOS)
          host_arch=$(go env GOARCH)
          echo "runner=${{ matrix.runner }} host=${host_os}/${host_arch}"
          if [ "$host_os" != linux ] || [ "$host_arch" != "${{ matrix.goarch }}" ]; then
            echo "::error::${{ matrix.runner }} is ${host_os}/${host_arch} but the matrix says linux/${{ matrix.goarch }} — cgo cannot cross-compile these targets, so this run would ship the wrong binary"
            exit 1
          fi

      - name: Create synthetic dev tag
        # `goreleaser build` needs a tag on HEAD to derive .Version. Created
        # locally with --force (retries on the same commit don't collide) and
        # never pushed to origin. The pushed image tags are computed in the
        # publish job below.
        run: git tag --force "v0.0.0-dev.${GITHUB_SHA::7}"

      - name: Build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Same v2 line as release.yml so dev exercises the same
          # goreleaser version a real release will.
          version: "~> v2"
          args: build --clean --single-target --output dist/wavehouse

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wavehouse-linux-${{ matrix.goarch }}
          path: dist/wavehouse
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Push :dev image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # A job-level block REPLACES the workflow-level one outright, so
      # `contents: read` has to be restated here or `actions/checkout` has no
      # token to read the repo with.
      contents: read
      packages: write
      id-token: write # OIDC for the build-provenance attestation (Sigstore)
      attestations: write # write the build-provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wavehouse-linux-*
          path: staging

      - name: Assemble the image build context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ctx/scripts
          # Dockerfile.goreleaser's chtypes-fetch stage needs these three at
          # their normal repo-relative paths.
          cp chtypes.lock ctx/
          cp scripts/fetch-chtypes.sh scripts/_colors.sh ctx/scripts/

          for goarch in amd64 arm64; do
            bin="staging/wavehouse-linux-${goarch}/wavehouse"
            if [ ! -f "$bin" ]; then
              echo "::error::missing build artifact for linux/${goarch} (${bin})"
              exit 1
            fi
            # actions/upload-artifact's zip carries no unix mode bits, so the
            # executable bit does not survive the round trip.
            mkdir -p "ctx/linux/${goarch}"
            install -m 0755 "$bin" "ctx/linux/${goarch}/wavehouse"
          done
          find ctx -type f -printf '%M %s %p\n'

      # The default docker driver can't build multi-platform images, so create
      # a docker-container builder. No QEMU needed — Dockerfile.goreleaser's
      # stages are $BUILDPLATFORM-pinned or COPY-only by design.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `:dev-<full sha>` matches cleanup-ghcr.yml's `^dev-[0-9a-f]+$` regex.
      # `:dev` is written as a literal rather than derived from a channel
      # variable: a push to main that forgot to set something must never be
      # able to publish `:latest`.
      - name: Build and push the multi-arch dev image
        shell: bash
        env:
          IMAGE: ghcr.io/wave-rf/wavehouse
        run: |
          set -euo pipefail
          version="0.0.0-dev.${GITHUB_SHA::7}"
          created="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deployments/Dockerfile.goreleaser \
            --tag "${IMAGE}:dev-${GITHUB_SHA}" \
            --tag "${IMAGE}:dev" \
            --label "org.opencontainers.image.title=WaveHouse (dev)" \
            --label "org.opencontainers.image.description=Schema-aware real-time API gateway for ClickHouse — rolling dev build from main" \
            --label "org.opencontainers.image.url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${version}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=${created}" \
            --push \
            ctx

      # Attest the rolling dev image (multi-arch manifest-list digest) and store
      # the attestation alongside it in GHCR. Free for public repos via Sigstore.
      # Dev binaries aren't distributed (no GitHub Release, no archives), so
      # only the image is attested. Mirrors release.yml.
      - name: Resolve pushed dev image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/wave-rf/wavehouse:dev-${GITHUB_SHA}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "::error::empty digest for $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved $ref -> $digest"

      - name: Attest dev image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/wave-rf/wavehouse
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
