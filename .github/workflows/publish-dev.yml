name: Publish dev image

# Pushes a rolling dev image to GHCR on every push to main:
#   - :dev         rolling pointer to the latest main commit
#   - :dev-<sha>   immutable point-in-time reference
#
# Reuses the goreleaser pipeline from release.yml. A synthetic local
# tag (v0.0.0-dev.<short-sha>) anchors goreleaser's .Version on
# HEAD; the tag is never pushed to origin. WAVEHOUSE_DEV=1 switches
# .goreleaser.yaml to dev image tags and suppresses the GitHub
# Release.
#
# Real tagged releases (`v*`) flow through release.yml against the
# same .goreleaser.yaml without WAVEHOUSE_DEV set, producing
# `:vX.Y.Z` + `:latest`. Cleanup of old dev-<sha> tags is handled
# by cleanup-ghcr.yml.
#
# The TypeScript SDK publishes separately — see publish-npm.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC for the build-provenance attestation (Sigstore)
  attestations: write # write the build-provenance attestation

concurrency:
  # The :dev tag should track HEAD, so cancel any in-flight build
  # when a newer commit lands. The :dev-<sha> tag is only pushed
  # at the end, so cancellation can't leave the registry
  # inconsistent.
  group: publish-dev
  cancel-in-progress: true

jobs:
  publish:
    name: Build + push :dev image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads full git history for changelog + commit
          # info. Matches release.yml.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          # Opt out of setup-go's bundled cache and cache the half that
          # earns its keep, below. The bundled one stores ~/go/pkg/mod AND
          # ~/.cache/go-build under one entry (~1 GB stored), keyed on the
          # root go.mod — setup-go hashed go.sum through v6.2.0 and go.mod
          # from v6.3.0 (actions/setup-go#705). So roughly half of it
          # re-stores the module tree ci.yml already keeps once as
          # `gomod-v1` — the duplication #443 is about.
          cache: false

      # The other half is the reason this job is fast, so cache it on its
      # own. GoReleaser cross-compiles 8 targets here (4 goos × 2 goarch),
      # and the last 20 runs split cleanly on whether these objects were
      # warm: GoReleaser finished in 36-246s with them, 401-446s without.
      # (Measured on setup-go's bundled entry, which carried this same
      # ~/.cache/go-build tree — this key is new here.) Dropping them
      # outright would cost roughly 2.5-7 min per push to main (the envelope
      # between those two clusters; mean delta ~4.8 min).
      #
      # Release-scoped suffix: these objects are cross-compiled for 8
      # GOOS/GOARCH pairs and share nothing with ci.yml's native-only
      # flavors, so `-release` keeps both sides from restoring bytes the
      # other can't use. Same `gobuild-v3` family and key inputs as
      # setup-env's (see .github/workflows/README.md); ~0.5 GB rather than
      # the ~1 GB the bundled cache held.
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/go-build
          key: gobuild-v3-${{ runner.os }}-go-release-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            gobuild-v3-${{ runner.os }}-go-release-

      # And read — never write — ci.yml's shared module tree, so dropping
      # setup-go's bundled cache doesn't leave this job re-downloading ~112 MB
      # of modules on every push. This workflow runs on main, the same scope
      # ci.yml saves `gomod-v1` into, so the entry is there to hit.
      #
      # restore, not cache: a full actions/cache would add a post-step save,
      # and this job has no business writing the entry every ci.yml Go job
      # shares — it never runs `go mod download` for the full graph (see the
      # cov note in the Makefile for why a partial save there is corrosive).
      # Restore-only writes nothing, so it costs 0 GB of the budget.
      - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/pkg/mod
          key: gomod-v1-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
          restore-keys: |
            gomod-v1-${{ runner.os }}-

      # dockers_v2 builds the linux/amd64+arm64 manifest via `docker buildx`;
      # the GitHub-hosted runner's default docker driver can't build
      # multi-platform images, so create a docker-container builder. No QEMU
      # needed — Dockerfile.goreleaser stages are $BUILDPLATFORM-pinned /
      # COPY-only by design.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create synthetic dev tag
        # `goreleaser release` requires a tag on HEAD to derive
        # .Version. Created locally with --force (retries on the
        # same commit don't collide) and never pushed to origin.
        # The pushed image tags come from .goreleaser.yaml's
        # WAVEHOUSE_DEV branch (`dev-<full-sha>` + `dev`).
        run: git tag --force "v0.0.0-dev.${GITHUB_SHA::7}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          # Switches .goreleaser.yaml into dev mode: dev/dev-<sha>
          # image tags, dev OCI labels, GitHub Release suppressed.
          WAVEHOUSE_DEV: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same v2 line as release.yml so dev exercises the same
          # goreleaser version a real release will.
          version: "~> v2"
          args: release --clean

      # Attest the rolling dev image (multi-arch manifest-list digest) and store
      # the attestation alongside it in GHCR. Free for public repos via Sigstore.
      # Dev binaries aren't distributed (the GitHub Release is suppressed), so
      # only the image is attested. Mirrors release.yml.
      - name: Resolve pushed dev image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/wave-rf/wavehouse:dev-${GITHUB_SHA}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "::error::empty digest for $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved $ref -> $digest"

      - name: Attest dev image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/wave-rf/wavehouse
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
