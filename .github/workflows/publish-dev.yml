name: Publish dev image

# Pushes a rolling dev image to GHCR on every push to main:
#   - :dev         rolling pointer to the latest main commit
#   - :dev-<sha>   immutable point-in-time reference
#
# Reuses the goreleaser pipeline from release.yml. A synthetic local
# tag (v0.0.0-dev.<short-sha>) anchors goreleaser's .Version on
# HEAD; the tag is never pushed to origin. WAVEHOUSE_DEV=1 switches
# .goreleaser.yaml to dev image tags and suppresses the GitHub
# Release.
#
# Real tagged releases (`v*`) flow through release.yml against the
# same .goreleaser.yaml without WAVEHOUSE_DEV set, producing
# `:vX.Y.Z` + `:latest`. Cleanup of old dev-<sha> tags is handled
# by cleanup-ghcr.yml.
#
# The TypeScript SDK publishes separately — see publish-npm.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC for the build-provenance attestation (Sigstore)
  attestations: write # write the build-provenance attestation

concurrency:
  # The :dev tag should track HEAD, so cancel any in-flight build
  # when a newer commit lands. The :dev-<sha> tag is only pushed
  # at the end, so cancellation can't leave the registry
  # inconsistent.
  group: publish-dev
  cancel-in-progress: true

jobs:
  publish:
    name: Build + push :dev image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser reads full git history for changelog + commit
          # info. Matches release.yml.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          # setup-go's bundled cache stores ~/go/pkg/mod + ~/.cache/go-build
          # under its own go.sum-keyed entry — a private ~1 GB archive: the
          # module tree ci.yml already caches once as `gomod-v1`, plus this
          # job's own 8-target cross-compile objects. It
          # saves a fresh archive on each cache miss (i.e. every dependency
          # bump), so two live generations is ~2 GB of the repo's hard 10 GB
          # budget — for a release build dominated by cross-compiling and
          # multi-arch docker, not by `go mod download`. Same call as
          # goreleaser-validate.yml. See #443.
          cache: false

      # dockers_v2 builds the linux/amd64+arm64 manifest via `docker buildx`;
      # the GitHub-hosted runner's default docker driver can't build
      # multi-platform images, so create a docker-container builder. No QEMU
      # needed — Dockerfile.goreleaser stages are $BUILDPLATFORM-pinned /
      # COPY-only by design.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create synthetic dev tag
        # `goreleaser release` requires a tag on HEAD to derive
        # .Version. Created locally with --force (retries on the
        # same commit don't collide) and never pushed to origin.
        # The pushed image tags come from .goreleaser.yaml's
        # WAVEHOUSE_DEV branch (`dev-<full-sha>` + `dev`).
        run: git tag --force "v0.0.0-dev.${GITHUB_SHA::7}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        env:
          # Switches .goreleaser.yaml into dev mode: dev/dev-<sha>
          # image tags, dev OCI labels, GitHub Release suppressed.
          WAVEHOUSE_DEV: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same v2 line as release.yml so dev exercises the same
          # goreleaser version a real release will.
          version: "~> v2"
          args: release --clean

      # Attest the rolling dev image (multi-arch manifest-list digest) and store
      # the attestation alongside it in GHCR. Free for public repos via Sigstore.
      # Dev binaries aren't distributed (the GitHub Release is suppressed), so
      # only the image is attested. Mirrors release.yml.
      - name: Resolve pushed dev image digest
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/wave-rf/wavehouse:dev-${GITHUB_SHA}"
          digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
          [ -n "$digest" ] || { echo "::error::empty digest for $ref"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Resolved $ref -> $digest"

      - name: Attest dev image provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/wave-rf/wavehouse
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
