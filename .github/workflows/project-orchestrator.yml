name: Project orchestrator

# Drives the Task Board (project #7) as the single source of truth for
# "who needs to look at what, next." Each item has two axes:
#
#   Assignee — set once per card. The Issue's assignee is the
#     implementer; the PR's assignee is the reviewer (non-author admin).
#     Assignees DO NOT rotate across state transitions. Use them to see
#     what's in your queue.
#
#   Status — rotates per state transition, mirrored between PR and
#     linked Issue (opposite semantics). PR Ready ↔ Issue In review;
#     PR In review ↔ Issue Ready; both Done on merge.
#
# Transitions:
#
#   PR becomes bot-clean (required checks green + all threads resolved):
#     → upsert PR card on board
#     → if PR Status is empty/Backlog: set to Ready
#       (preserve In progress / In review / Done — reviewer/author is
#        actively handling; don't yank)
#     → flip draft → ready-for-review if draft
#     → assign non-author admin + request their review (one GitHub
#       notification + one board-queue entry, in sync)
#     → linked issues → In review
#
#   Review CHANGES_REQUESTED:
#     → PR card → In review (reviewer waiting on implementer)
#     → linked issue → Ready (implementer attention needed)
#
#   Author re-requests review:
#     → PR card → Ready
#     → linked issue → In review
#     → re-request review from admin (dismiss_stale_reviews_on_push
#       typically cleared the prior request)
#
#   Review APPROVED / PR merged:
#     → no orchestrator action. admin-approval.yml + a manual squash
#       (or auto-merge if enabled) close the loop. GitHub's built-in
#       project automation moves PR + issue to Done on merge.
#
#   Review dismissed:
#     → re-evaluate (prior admin approval may now be invalid).
#
# Bidirectional manual-move sync lives in board-state-sync.yml.
#
# Dependabot PRs skip this workflow — they go through
# dependabot-automerge.yml. Major-version Dependabot bumps get their
# own board placement there using the same composite actions.
#
# Manual step intentionally preserved: when the reviewer starts
# reviewing, they move the PR card Ready → In progress themselves
# (no reliable GitHub event to hook).

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  pull_request_review:
    types: [submitted, dismissed]
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: project-orchestrator-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

env:
  PROJECT_OWNER: Wave-RF
  PROJECT_NUMBER: "7"
  PROJECT_ID: PVT_kwDOCdKSOc4BUEKD
  STATUS_FIELD_ID: PVTSSF_lADOCdKSOc4BUEKDzhBO0l8
  STATUS_READY: "61e4505c"
  STATUS_IN_PROGRESS: "47fc9ee4"
  STATUS_IN_REVIEW: "df73e18b"
  STATUS_DONE: "98236657"
  STATUS_BACKLOG: "f75ad846"

jobs:
  orchestrate:
    runs-on: [wave-rf-runners]
    steps:
      - name: Checkout repo (composite actions live here)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 1

      - name: Guard — require PROJECT_BOARD_TOKEN
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
        run: |
          if [[ -z "$PROJECT_TOKEN" ]]; then
            echo "::warning::PROJECT_BOARD_TOKEN not configured; board operations will be skipped."
            echo "SKIP_BOARD=true" >> "$GITHUB_ENV"
          fi

      - name: Resolve PR number
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          case "$EVENT_NAME" in
            pull_request_target|pull_request_review)
              num="${{ github.event.pull_request.number }}"
              ;;
            check_suite)
              num=$(jq -r '.check_suite.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
              ;;
          esac
          if [[ -z "$num" ]]; then
            echo "No PR in event payload; exiting."
            exit 0
          fi
          echo "num=$num" >> "$GITHUB_OUTPUT"

      - name: Determine action
        id: action
        if: steps.pr.outputs.num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.pr.outputs.num }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REVIEW_STATE: ${{ github.event.review.state }}
        run: |
          pr=$(gh pr view "$PR_NUM" -R "$REPO" \
            --json isDraft,author,statusCheckRollup,state)
          author=$(echo "$pr" | jq -r '.author.login')
          is_draft=$(echo "$pr" | jq -r '.isDraft')
          pr_state=$(echo "$pr" | jq -r '.state')

          if [[ "$author" == "dependabot[bot]" || "$author" == "app/dependabot" ]]; then
            echo "Dependabot PR — handled by dependabot-automerge.yml."
            exit 0
          fi

          if [[ "$pr_state" != "OPEN" ]]; then
            echo "PR is not OPEN ($pr_state) — skipping."
            exit 0
          fi

          action="none"
          if [[ "$EVENT_NAME" == "pull_request_review" && "$EVENT_ACTION" == "submitted" ]]; then
            case "$REVIEW_STATE" in
              changes_requested) action="changes_requested" ;;
              approved|*)        action="none" ;;
            esac
          elif [[ "$EVENT_NAME" == "pull_request_review" && "$EVENT_ACTION" == "dismissed" ]]; then
            action="reeval"
          elif [[ "$EVENT_NAME" == "pull_request_target" && "$EVENT_ACTION" == "review_requested" ]]; then
            # Distinguish initial request (author opened with reviewer
            # pre-populated) from re-request (author re-asked a
            # reviewer who'd already reviewed). Only the latter is
            # "I've addressed feedback."
            sender="${{ github.event.sender.login }}"
            pr_author="${{ github.event.pull_request.user.login }}"
            requested_reviewer="${{ github.event.requested_reviewer.login }}"
            if [[ "$sender" != "$pr_author" || -z "$requested_reviewer" ]]; then
              action="none"
            else
              has_prior_review=$(gh api "repos/$REPO/pulls/$PR_NUM/reviews?per_page=100" \
                | jq -r --arg u "$requested_reviewer" 'any(.[]; .user.login == $u)' 2>/dev/null || echo "false")
              if [[ "$has_prior_review" == "true" ]]; then
                action="re_requested"
              fi
            fi
          elif [[ "$EVENT_NAME" == "pull_request_target" || "$EVENT_NAME" == "check_suite" ]]; then
            action="reeval"
          fi

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"
          echo "is_draft=$is_draft" >> "$GITHUB_OUTPUT"
          echo "Event: $EVENT_NAME / $EVENT_ACTION → action: $action"

      # ────────────────────────────────────────────────────────────────
      # reeval path: bot-clean → add to board, promote Status=Ready,
      # assign + request review, mirror linked issues to In review.
      # ────────────────────────────────────────────────────────────────

      - name: Check bot-clean (required checks green + threads resolved)
        id: botclean
        if: steps.action.outputs.action == 'reeval'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.pr.outputs.num }}
        run: |
          # Admin approval is deliberately excluded — it opens only
          # after an admin reviews, which is the step this workflow
          # triggers. Including it here would self-reference.
          pr=$(gh pr view "$PR_NUM" -R "$REPO" --json statusCheckRollup)
          for check in Check Build Validate Lint Test "Integration Tests" "SDK Tests"; do
            state=$(echo "$pr" | jq -r --arg n "$check" \
              '[.statusCheckRollup[] | select(.name == $n)] | .[0].conclusion // "MISSING"')
            if [[ "$state" != "SUCCESS" ]]; then
              echo "Required check '$check' is '$state'; not bot-clean yet."
              echo "clean=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          owner="${REPO%%/*}"
          repo_name="${REPO##*/}"
          unresolved=$(gh api graphql \
            -f query='query($owner:String!, $repo:String!, $num:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$num) {
                  reviewThreads(first: 100) { nodes { isResolved } }
                }
              }
            }' \
            -F owner="$owner" -F repo="$repo_name" -F num="$PR_NUM" \
            --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')

          if [[ "$unresolved" != "0" ]]; then
            echo "$unresolved unresolved review thread(s); not bot-clean yet."
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR is bot-clean."
          echo "clean=true" >> "$GITHUB_OUTPUT"

      - name: Flip draft → ready-for-review
        if: steps.botclean.outputs.clean == 'true' && steps.action.outputs.is_draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.pr.outputs.num }}
        run: |
          echo "PR is draft and bot-clean; flipping to ready-for-review."
          gh pr ready "$PR_NUM" -R "$REPO"

      - name: Compute reviewer(s) — non-author admin(s)
        id: reviewers
        if: (steps.botclean.outputs.clean == 'true') || (steps.action.outputs.action == 're_requested')
        env:
          PR_AUTHOR: ${{ steps.action.outputs.author }}
        run: |
          admins="EricAndrechek taitelee"
          picked=""
          for admin in $admins; do
            [[ "$admin" != "$PR_AUTHOR" ]] && picked+="$admin "
          done
          echo "reviewers=$(echo "$picked" | awk '{$1=$1};1')" >> "$GITHUB_OUTPUT"

      - name: Check current PR card Status (reeval guard)
        id: pr-status
        if: steps.botclean.outputs.clean == 'true' && env.SKIP_BOARD != 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ steps.pr.outputs.num }}
        run: |
          # Reeval promotes to Ready only from empty/Backlog — don't
          # yank a card that's already In progress / In review / Done.
          # The composite action is idempotent so calling it with the
          # wrong intent would be safe, but the "don't yank" policy is
          # this workflow's business, so check here.
          pr_url="https://github.com/$REPO/pull/$PR_NUM"
          resp=$(gh api graphql -f query='query($url: URI!) {
              resource(url: $url) {
                ... on PullRequest {
                  projectItems(first: 20) {
                    nodes {
                      project { number }
                      fieldValueByName(name: "Status") {
                        ... on ProjectV2ItemFieldSingleSelectValue { name }
                      }
                    }
                  }
                }
              }
            }' -F url="$pr_url")

          current=$(echo "$resp" | jq -r --arg n "$PROJECT_NUMBER" '
            .data.resource.projectItems.nodes[]?
            | select(.project.number == ($n | tonumber))
            | .fieldValueByName.name // ""' | head -n1)

          case "$current" in
            ""|Backlog)
              echo "PR card Status is '${current:-<unset>}' — ok to promote."
              echo "promote=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "PR card Status is '$current' — leaving alone."
              echo "promote=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upsert PR card → Ready (reeval)
        if: steps.botclean.outputs.clean == 'true' && env.SKIP_BOARD != 'true' && steps.pr-status.outputs.promote == 'true'
        uses: ./.github/actions/board-upsert-status
        with:
          project-token: ${{ secrets.PROJECT_BOARD_TOKEN }}
          project-owner: ${{ env.PROJECT_OWNER }}
          project-number: ${{ env.PROJECT_NUMBER }}
          project-id: ${{ env.PROJECT_ID }}
          status-field-id: ${{ env.STATUS_FIELD_ID }}
          status-option-id: ${{ env.STATUS_READY }}
          url: https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.num }}

      - name: Assign + request review (reeval)
        if: steps.botclean.outputs.clean == 'true' && steps.reviewers.outputs.reviewers != ''
        uses: ./.github/actions/assign-and-request-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.num }}
          reviewers: ${{ steps.reviewers.outputs.reviewers }}

      - name: Linked issues → In review (reeval)
        if: steps.botclean.outputs.clean == 'true' && env.SKIP_BOARD != 'true' && steps.pr-status.outputs.promote == 'true'
        uses: ./.github/actions/set-linked-issues-status
        with:
          project-token: ${{ secrets.PROJECT_BOARD_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.num }}
          project-owner: ${{ env.PROJECT_OWNER }}
          project-number: ${{ env.PROJECT_NUMBER }}
          project-id: ${{ env.PROJECT_ID }}
          status-field-id: ${{ env.STATUS_FIELD_ID }}
          status-option-id: ${{ env.STATUS_IN_REVIEW }}

      # ────────────────────────────────────────────────────────────────
      # changes_requested path: reviewer pushed back.
      # PR → In review, linked issues → Ready.
      # ────────────────────────────────────────────────────────────────

      - name: Upsert PR card → In review (changes_requested)
        if: steps.action.outputs.action == 'changes_requested' && env.SKIP_BOARD != 'true'
        uses: ./.github/actions/board-upsert-status
        with:
          project-token: ${{ secrets.PROJECT_BOARD_TOKEN }}
          project-owner: ${{ env.PROJECT_OWNER }}
          project-number: ${{ env.PROJECT_NUMBER }}
          project-id: ${{ env.PROJECT_ID }}
          status-field-id: ${{ env.STATUS_FIELD_ID }}
          status-option-id: ${{ env.STATUS_IN_REVIEW }}
          url: https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.num }}

      - name: Linked issues → Ready (changes_requested)
        if: steps.action.outputs.action == 'changes_requested' && env.SKIP_BOARD != 'true'
        uses: ./.github/actions/set-linked-issues-status
        with:
          project-token: ${{ secrets.PROJECT_BOARD_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.num }}
          project-owner: ${{ env.PROJECT_OWNER }}
          project-number: ${{ env.PROJECT_NUMBER }}
          project-id: ${{ env.PROJECT_ID }}
          status-field-id: ${{ env.STATUS_FIELD_ID }}
          status-option-id: ${{ env.STATUS_READY }}

      # ────────────────────────────────────────────────────────────────
      # re_requested path: author re-asked for review.
      # PR → Ready, linked issues → In review, re-request reviewer.
      # ────────────────────────────────────────────────────────────────

      - name: Upsert PR card → Ready (re_requested)
        if: steps.action.outputs.action == 're_requested' && env.SKIP_BOARD != 'true'
        uses: ./.github/actions/board-upsert-status
        with:
          project-token: ${{ secrets.PROJECT_BOARD_TOKEN }}
          project-owner: ${{ env.PROJECT_OWNER }}
          project-number: ${{ env.PROJECT_NUMBER }}
          project-id: ${{ env.PROJECT_ID }}
          status-field-id: ${{ env.STATUS_FIELD_ID }}
          status-option-id: ${{ env.STATUS_READY }}
          url: https://github.com/${{ github.repository }}/pull/${{ steps.pr.outputs.num }}

      - name: Re-request review (re_requested)
        if: steps.action.outputs.action == 're_requested' && steps.reviewers.outputs.reviewers != ''
        uses: ./.github/actions/assign-and-request-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.num }}
          reviewers: ${{ steps.reviewers.outputs.reviewers }}

      - name: Linked issues → In review (re_requested)
        if: steps.action.outputs.action == 're_requested' && env.SKIP_BOARD != 'true'
        uses: ./.github/actions/set-linked-issues-status
        with:
          project-token: ${{ secrets.PROJECT_BOARD_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ steps.pr.outputs.num }}
          project-owner: ${{ env.PROJECT_OWNER }}
          project-number: ${{ env.PROJECT_NUMBER }}
          project-id: ${{ env.PROJECT_ID }}
          status-field-id: ${{ env.STATUS_FIELD_ID }}
          status-option-id: ${{ env.STATUS_IN_REVIEW }}
