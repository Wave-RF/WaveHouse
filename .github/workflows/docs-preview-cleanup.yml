name: Docs preview cleanup

# Retires a pull request's docs previews when it closes (merged or not). The
# `docs-preview` job in ci.yml records a GitHub Deployment in the shared
# `preview/docs` environment for every PR commit and deactivates only that same
# PR's older ones, so without this a closed PR's last preview would stay
# "active" on the Deployments page forever. Here they are marked inactive and
# then deleted, so the environment's history doesn't grow without bound. The PR's
# sticky preview comment still lists its URLs.
#
# Cloudflare's side is left alone on purpose: a Worker preview alias can't be
# deleted (Cloudflare keeps the 1,000 most recent and drops the oldest), and an
# uploaded version serves no production traffic.
#
# `pull_request_target` runs the default branch's copy of this workflow and it
# checks nothing out, so no PR-authored code holds the write token; the only
# PR-derived input is the number, which the action reads from the event. Same
# trust shape as pr-cache-cleanup.yml.

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  cleanup:
    name: Docs preview cleanup
    # Fork PRs never get a preview (no secrets), so there is nothing to retire.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      deployments: write
    steps:
      - name: Retire this PR's docs previews
        uses: Wave-RF/cloudflare-preview/deployment@2d284ab3c5271ae368eee6ff9d9767151a45f835 # v1.0.0
        with:
          state: inactive
          label: docs
          delete: "true"
