name: Triage issues

# Auto-classifies new and edited issues using GitHub Models and
# applies area/* labels + security / breaking-change flags.
# Optionally writes the Priority field on the project board when
# PROJECT_BOARD_TOKEN (with `project` scope) is configured;
# otherwise the board-write step soft-fails.
#
# Security: issue bodies are untrusted user input. The classifier's
# output only affects labels and a board field, never code
# execution — a prompt-injection attempt can at worst produce a
# wrong label.

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read
  models: read

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify and label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip re-triggering on our own label edits.
    if: github.actor != 'github-actions[bot]' && github.event.issue.pull_request == null
    steps:
      - name: Checkout main (trusted board-config source)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Load board config
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .github/board-config.env >> "$GITHUB_ENV"

      - name: Fetch current area labels
        id: areas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # Discovers `area/*` labels at runtime so adding a new label
        # doesn't require a workflow edit. Label descriptions feed
        # the classifier as per-area hints — keep them meaningful.
        run: |
          gh label list -R "$REPO" --json name,description --jq '
            [.[]
              | select(.name | startswith("area/"))
              | "  \(.name[5:])\(" " * (14 - (.name[5:] | length)))- \(.description // "")"
            ] | join("\n")
          ' > /tmp/areas.txt
          {
            echo 'list<<EOF'
            cat /tmp/areas.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Classify with GitHub Models
        id: classify
        uses: actions/ai-inference@a7805884c80886efc241e94a5351df715968a0ad # v2.1.1
        with:
          model: openai/gpt-4o-mini
          # Leaves headroom for multi-area classifications + flags
          # without truncating mid-JSON.
          max-tokens: 400
          system-prompt: |
            You are an issue-triage assistant for the WaveHouse project — a
            schema-aware real-time API gateway for ClickHouse written in Go.
            Classify the issue. Return only a single JSON object with no
            prose and no code fences.

            Areas (pick zero or more from this exact list):
            ${{ steps.areas.outputs.list }}

            Priority (pick one, or null if unclear):
              P0 - Broken production / data loss / security-critical
              P1 - Blocks a major workflow, no workaround
              P2 - Important but has a workaround
              P3 - Nice-to-have, low urgency

            Flags:
              breaking_change: true if the issue proposes a change that
                breaks the public API, CLI, or config format.
              security: true if the issue is a security vulnerability,
                hardening ask, or auth/authz concern.

            Schema (all fields required):
              {
                "area": ["ingest", "observability"],
                "priority": "P2",
                "breaking_change": false,
                "security": false
              }
          prompt: |
            Title: ${{ github.event.issue.title }}

            Body:
            ${{ github.event.issue.body }}

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESPONSE: ${{ steps.classify.outputs.response }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # shellcheck disable=SC2016  # the sed program legitimately contains backticks in single quotes
          # Strip any code fences the model may have added despite instructions.
          json=$(printf '%s' "$RESPONSE" | sed -E 's/^\s*```(json)?\s*$//g; s/^\s*```\s*$//g')
          echo "Parsed model output:"
          echo "$json"

          labels=$(echo "$json" | jq -r '
            ([ (.area // [])[] | "area/" + . ]
              + (if .breaking_change == true then ["breaking-change"] else [] end)
              + (if .security == true then ["security"] else [] end)
            ) | join(",")
          ' 2>/dev/null || echo "")

          if [[ -z "$labels" ]]; then
            # Distinguish "no labels suggested" (valid empty result)
            # from "JSON parse failure" (max-tokens truncation or
            # off-script output — surface the raw response).
            if ! echo "$json" | jq -e . >/dev/null 2>&1; then
              echo "::warning::Classifier output is not valid JSON. Raw response below:"
              printf '%s\n' "$RESPONSE" | sed 's/^/  /'
            else
              echo "::notice::Classifier returned valid JSON but no labels (empty .area, no flags)."
            fi
            exit 0
          fi

          echo "Applying labels: $labels"
          gh issue edit "$ISSUE_NUMBER" --add-label "$labels" -R "$REPO"

      - name: Set Priority on Task Board
        # Soft-fail: GITHUB_TOKEN lacks `project` scope, so the
        # board write needs PROJECT_BOARD_TOKEN (a PAT with project
        # write access). Label triage still works without it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN || secrets.GITHUB_TOKEN }}
          RESPONSE: ${{ steps.classify.outputs.response }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          # shellcheck disable=SC2016  # the sed program legitimately contains backticks in single quotes
          json=$(printf '%s' "$RESPONSE" | sed -E 's/^\s*```(json)?\s*$//g; s/^\s*```\s*$//g')
          priority=$(echo "$json" | jq -r '.priority // empty' 2>/dev/null || echo "")

          if [[ -z "$priority" || "$priority" == "null" ]]; then
            echo "No priority returned; skipping board write."
            exit 0
          fi

          # Project IDs come from .github/board-config.env.
          case "$priority" in
            P0) OPTION_ID="$PRIORITY_P0" ;;
            P1) OPTION_ID="$PRIORITY_P1" ;;
            P2) OPTION_ID="$PRIORITY_P2" ;;
            P3) OPTION_ID="$PRIORITY_P3" ;;
            *)  echo "Unknown priority '$priority'; skipping."; exit 0 ;;
          esac

          item_id=$(gh project item-list "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --format json --limit 200 \
            | jq -r --argjson n "$ISSUE_NUMBER" --arg repo "$REPO" '
                .items[]
                | select(.content.number == $n)
                | select(.content.repository == ("https://github.com/" + $repo))
                | .id
              ' | head -n1)

          if [[ -z "$item_id" ]]; then
            echo "Issue #$ISSUE_NUMBER isn't on the board yet; skipping priority write."
            exit 0
          fi

          echo "Setting Priority=$priority on board item $item_id"
          gh project item-edit \
            --id "$item_id" \
            --field-id "$PRIORITY_FIELD_ID" \
            --single-select-option-id "$OPTION_ID" \
            --project-id "$PROJECT_ID"
