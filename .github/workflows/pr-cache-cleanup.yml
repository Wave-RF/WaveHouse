name: PR cache cleanup

# Deletes the Actions caches pull requests no longer need. Both jobs run the
# default branch's copy of this workflow and execute nothing from a PR, so no
# PR-authored code holds the write token, and fork PRs are covered too.
#
# - When a PR closes (merged or not): every cache saved under its refs. The
#   Go, pnpm and Playwright caches save only from `main`, except the build
#   cache below; what a PR still saves is GitHub's CodeQL dependency cache
#   (~0.4-0.6 GiB, whenever main has no entry for its key), the small
#   golangci/Astro entries, and any Go caches saved before that change. None
#   is readable by another PR, and they count against the repo's 10 GB cache
#   cap until evicted. No checkout: the only PR-derived input is the number,
#   passed through the environment.
# - After each CI run of a pull request: the Go build cache entries no run
#   will read. A PR that changes go.mod/go.sum saves the build cache of the
#   two long-pole jobs into its own scope (setup-env's `go-cache-pr-save`),
#   and scripts/ci/prune-pr-build-cache.sh keeps at most one per job per PR.

on:
  pull_request_target:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  cache-cleanup:
    name: Delete PR caches
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete the caches saved by this PR's refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Try both refs, then fail if either did: a permission or CLI
          # regression must not pass as a quiet cleanup.
          rc=0
          for ref in "refs/pull/$PR_NUMBER/merge" "refs/pull/$PR_NUMBER/head"; do
            gh cache delete --all --ref "$ref" --succeed-on-no-caches || rc=1
          done
          exit "$rc"

  build-cache-prune:
    name: Prune PR build caches
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Overlapping prunes would race to delete the same entries. A newer
    # pending run replaces an older one, which is fine: each prunes everything.
    concurrency:
      group: pr-build-cache-prune
    permissions:
      actions: write
      contents: read
    steps:
      # The default branch, never the PR's tree: the script runs with the
      # write token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - name: Delete the build caches no run will read
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/ci/prune-pr-build-cache.sh
