name: PR housekeeping

# Runs once per PR open/edit/push to:
#   1. Apply path-based labels via actions/labeler.
#   2. Mirror the PR-title (Conventional Commits) check as a sticky
#      explainer comment — and, when a title edit fixes it, re-run the
#      failed `PR title` job inside the required `CI` check.
#
# The BLOCKING title gate lives in ci.yml's `PR title` job (under the
# `CI` aggregator — the ruleset's sole required check). This workflow
# keeps the parts that need base-repo write permissions on fork PRs,
# which only `pull_request_target` grants: labels and the sticky
# comment. It still fails on a bad title so the mirror is honest, but
# it is NOT a required check.
#
# Reviewer assignment is NOT here — GitHub does it natively: the ruleset's
# `required_reviewers` rule requests the @Wave-RF/wavehouse-admins team, and
# the team's code-review assignment auto-assigns + load-balances a member.
#
# Labeling failures are non-fatal so a flaky API call can't block the
# title mirror.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  # `issues: write` is required for the sticky-comment endpoint
  # (/repos/.../issues/{num}/comments) — `pull-requests: write` alone
  # does not grant it, and fork PRs fail to comment without it.
  # `actions: write` lets the title-fix step re-run CI's failed jobs.
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: pr-housekeeping-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  housekeeping:
    name: PR housekeeping
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main (trusted lint-pr-title.sh + labeler config source)
        # Explicit ref so scripts/lint-pr-title.sh and .github/labeler.yml
        # resolve from the default branch, not the PR head.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # `sync-labels: true` removes labels when their matching files
      # leave the diff, so labels track the current change set.
      - name: Apply file-path labels
        uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Check Conventional Commits format
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Single source of truth for the rule: scripts/lint-pr-title.sh — the
          # SAME validator the local agent gate runs (.claude/hooks/agent-bash-gate.sh),
          # so CI and local can't drift. The checkout above is ref: main, so this is
          # always the default-branch script. Dependabot's grouped-update titles
          # routinely exceed the 72-char subject cap and the format isn't
          # configurable, so Dependabot PRs are exempt from the length check
          # (the format check still applies).
          if [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "app/dependabot" ]]; then
            export PR_TITLE_SKIP_LENGTH=1
          fi

          if reason=$(bash scripts/lint-pr-title.sh "$PR_TITLE" 2>&1); then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "PR title OK: $PR_TITLE"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "$reason"
            echo "::error::$(printf '%s' "$reason" | head -1)"
          fi

      - name: Post / update sticky comment on title fail
        # continue-on-error: GITHUB_TOKEN is read-only for fork PRs so
        # the comment fails there; that must not mask the final exit 1
        # that keeps this check an honest mirror of the title state.
        if: steps.check.outputs.passed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- pr-title-lint-comment -->'
          BODY=$(cat <<EOF
          $MARKER
          ## PR title doesn't match the required format

          **Got:** \`$PR_TITLE\` (length: ${#PR_TITLE})

          **Expected format:** \`<type>(optional-scope)(optional-!): <lowercase subject, no trailing period>\` (max 72 chars — the title becomes the squash-merge commit subject)

          **Allowed types:** \`feat\`, \`fix\`, \`docs\`, \`refactor\`, \`test\`, \`chore\`, \`ci\`, \`deps\`, \`build\`, \`perf\`, \`revert\`, \`style\`.

          The optional \`!\` before the colon marks a breaking change per [Conventional Commits 1.0.0](https://www.conventionalcommits.org/en/v1.0.0/). The lowercase-first-letter rule is house style for log readability, not part of the spec.

          **Examples:**
          - \`feat: add dedupe cache\`
          - \`fix(ingest): drop duplicate events\`
          - \`feat(api)!: remove deprecated endpoint\`
          - \`chore(deps): bump clickhouse-go to v2.30\`

          ---

          The required \`CI\` check enforces this via its \`PR title\` job — merge is blocked until the title matches. Edit the PR title and the failed job is re-run automatically. I'll clean up this comment once the title is valid.
          EOF
          )

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -f "body=$BODY" > /dev/null
            echo "Updated existing pr-title-lint comment ($EXISTING)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f "body=$BODY" > /dev/null
            echo "Posted new pr-title-lint comment"
          fi

      - name: Clean up sticky comment on title pass
        if: steps.check.outputs.passed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- pr-title-lint-comment -->'
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$EXISTING"
            echo "Removed stale pr-title-lint comment ($EXISTING)"
          fi

      # Title edits don't re-trigger the CI workflow (its `pull_request`
      # trigger deliberately excludes `edited`: a description edit would
      # cancel + restart a full in-flight run via the concurrency group).
      # So when an edit makes the title valid, nudge the required `CI`
      # check along: if the latest completed CI run for this head SHA
      # failed its `PR title` job, re-run the run's failed jobs. That job
      # re-reads the title from the API — not the stale event payload a
      # re-run replays — so it turns green without a new push. Best-effort
      # (continue-on-error): a manual re-run or the next push covers any
      # miss, e.g. a title fixed while the CI run was still in flight.
      - name: Re-run CI title job after a title fix
        if: github.event.action == 'edited' && steps.check.outputs.passed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          run_id="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .status == "completed" and .conclusion == "failure")][0].id // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No failed completed CI run for $HEAD_SHA — nothing to re-run."
            exit 0
          fi
          title_failed="$(gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name == "PR title" and .conclusion == "failure")] | length')"
          if [[ "$title_failed" -gt 0 ]]; then
            gh api -X POST "repos/$REPO/actions/runs/$run_id/rerun-failed-jobs" >/dev/null
            echo "Re-ran failed jobs of CI run $run_id (its PR title job had failed)."
          else
            echo "CI run $run_id failed for reasons other than the title — leaving it alone."
          fi

      - name: Fail the check if title was invalid
        # Final step owns the exit code so the check status reflects
        # the regex result, independent of comment/review-assign I/O.
        if: steps.check.outputs.passed == 'false'
        run: exit 1
