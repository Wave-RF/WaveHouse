name: PR housekeeping

# Runs once per PR open/push to:
#   1. Apply path-based labels via actions/labeler.
#   2. Validate PR title against Conventional Commits.
#   3. Request review from the non-author admin on first open or
#      draft → ready.
#
# Uses `pull_request_target` so fork PRs get labels + sticky comments
# with base-repo permissions (a `pull_request` trigger lacks the
# write scopes on forks).
#
# Required by branch protection. Fails only on a bad PR title;
# labeling + reviewer-assign failures are non-fatal so a flaky API
# call can't block merge.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  # `issues: write` is required for the sticky-comment endpoint
  # (/repos/.../issues/{num}/comments) — `pull-requests: write` alone
  # does not grant it, and fork PRs fail to comment without it.
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-housekeeping-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  housekeeping:
    name: PR housekeeping
    runs-on: [wave-rf-runners]
    timeout-minutes: 5
    steps:
      - name: Checkout main (board-config + composite-action source)
        # Explicit ref so the local composite action and board-config.env
        # resolve from the default branch, not the PR head.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Load board config
        # ADMINS (comma-separated) used by the reviewer-assign step.
        run: grep -E '^[A-Z_][A-Z0-9_]*=' .github/board-config.env >> $GITHUB_ENV

      # `sync-labels: true` removes labels when their matching files
      # leave the diff, so labels track the current change set.
      - name: Apply file-path labels
        uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6.1.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Check Conventional Commits format
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Matches the conventional 72-char git subject cap; PR titles
          # become the squash-merge subject on main. Dependabot's
          # grouped-update titles routinely exceed 72 chars and the
          # format isn't configurable, so Dependabot PRs are exempt
          # from the length check (the format regex still applies).
          MAX_LEN: "72"
        run: |
          # Type list — keep in sync with CONTRIBUTING.md.
          # The `[^A-Z]` after `: ` enforces a lowercase first character
          # as house style; the Conventional Commits spec is silent on
          # subject capitalization.
          pattern='^(feat|fix|docs|refactor|test|chore|ci|deps|build|perf|revert|style)(\([^)]+\))?!?: [^A-Z].+[^.]$'

          is_dependabot=false
          if [[ "$PR_AUTHOR" == "dependabot[bot]" || "$PR_AUTHOR" == "app/dependabot" ]]; then
            is_dependabot=true
          fi

          if [[ "$is_dependabot" != "true" && ${#PR_TITLE} -gt $MAX_LEN ]]; then
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::PR title is ${#PR_TITLE} chars (max $MAX_LEN): $PR_TITLE"
          elif [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            if [[ "$is_dependabot" == "true" && ${#PR_TITLE} -gt $MAX_LEN ]]; then
              echo "::notice::Dependabot PR title is ${#PR_TITLE} chars (exempt from $MAX_LEN cap): $PR_TITLE"
            else
              echo "PR title OK: $PR_TITLE"
            fi
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "::error::PR title does not match Conventional Commits format: $PR_TITLE"
          fi

      - name: Post / update sticky comment on title fail
        # continue-on-error: GITHUB_TOKEN is read-only for fork PRs so
        # the comment fails there; that must not mask the final exit 1
        # that drives the required-check status.
        if: steps.check.outputs.passed == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- pr-title-lint-comment -->'
          BODY=$(cat <<EOF
          $MARKER
          ## PR title doesn't match the required format

          **Got:** \`$PR_TITLE\` (length: ${#PR_TITLE})

          **Expected format:** \`<type>(optional-scope)(optional-!): <lowercase subject, no trailing period>\` (max 72 chars — the title becomes the squash-merge commit subject)

          **Allowed types:** \`feat\`, \`fix\`, \`docs\`, \`refactor\`, \`test\`, \`chore\`, \`ci\`, \`deps\`, \`build\`, \`perf\`, \`revert\`, \`style\`.

          The optional \`!\` before the colon marks a breaking change per [Conventional Commits 1.0.0](https://www.conventionalcommits.org/en/v1.0.0/). The lowercase-first-letter rule is house style for log readability, not part of the spec.

          **Examples:**
          - \`feat: add dedupe cache\`
          - \`fix(ingest): drop duplicate events\`
          - \`feat(api)!: remove deprecated endpoint\`
          - \`chore(deps): bump clickhouse-go to v2.30\`

          ---

          This check is required by the \`main branch protection\` ruleset — merge is blocked until the title matches. Edit the PR title to trigger a re-check automatically. I'll clean up this comment once the title is valid.
          EOF
          )

          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -f "body=$BODY" > /dev/null
            echo "Updated existing pr-title-lint comment ($EXISTING)"
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f "body=$BODY" > /dev/null
            echo "Posted new pr-title-lint comment"
          fi

      - name: Clean up sticky comment on title pass
        if: steps.check.outputs.passed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARKER='<!-- pr-title-lint-comment -->'
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          if [[ -n "$EXISTING" ]]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$EXISTING"
            echo "Removed stale pr-title-lint comment ($EXISTING)"
          fi

      # Fires only on first open or draft → ready, NOT on every
      # synchronize: with `dismiss_stale_reviews_on_push` enabled,
      # re-requesting on every push would re-spam the reviewer before
      # the author hit "re-request review" after a CHANGES_REQUESTED.
      # Drafts and Dependabot PRs are skipped (Dependabot is handled
      # by dependabot-automerge.yml).
      - name: Request review from non-author admin
        if: |
          (github.event.action == 'opened' || github.event.action == 'ready_for_review')
          && github.event.pull_request.draft == false
          && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # Picks the non-author admin:
        #   - author is an admin → the *other* admin
        #   - otherwise → admin[PR_NUM % len(admins)] so review load
        #     spreads deterministically over time
        id: pick-reviewer
        run: |
          set -euo pipefail
          IFS=',' read -ra admin_list <<< "$ADMINS"

          picked=""
          is_admin=false
          for admin in "${admin_list[@]}"; do
            [ "$admin" = "$PR_AUTHOR" ] && is_admin=true
          done

          if [ "$is_admin" = "true" ]; then
            for admin in "${admin_list[@]}"; do
              if [ "$admin" != "$PR_AUTHOR" ]; then
                picked="$admin"
                break
              fi
            done
          else
            idx=$(( PR_NUMBER % ${#admin_list[@]} ))
            picked="${admin_list[$idx]}"
          fi

          echo "reviewer=$picked" >> "$GITHUB_OUTPUT"
          echo "Picked reviewer: $picked (author=$PR_AUTHOR, is_admin=$is_admin)"

      - name: Assign + request review (non-fatal)
        # A flaky review-request API call must not mask the title-lint
        # exit code that drives the required check.
        if: |
          (github.event.action == 'opened' || github.event.action == 'ready_for_review')
          && github.event.pull_request.draft == false
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && steps.pick-reviewer.outputs.reviewer != ''
        continue-on-error: true
        uses: ./.github/actions/assign-and-request-review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          pr-number: ${{ github.event.pull_request.number }}
          reviewers: ${{ steps.pick-reviewer.outputs.reviewer }}

      - name: Fail the check if title was invalid
        # Final step owns the exit code so the check status reflects
        # the regex result, independent of comment/review-assign I/O.
        if: steps.check.outputs.passed == 'false'
        run: exit 1
