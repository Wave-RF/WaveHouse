name: GoReleaser snapshot validation

# Catches goreleaser config + Go-compile breakage at PR time, before
# it could block a real tag-time release. Snapshot mode implies
# --skip=publish, so nothing is pushed.
#
# Path-filtered to goreleaser config / dockerfile changes only;
# go.mod / go.sum bumps are validated post-merge by publish-dev.yml
# running the full multi-target pipeline. `goreleaser build
# --single-target` exercises config parseability + Go compile for
# the host platform (release does not accept --single-target).
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - deployments/Dockerfile.goreleaser
      - .github/workflows/release.yml
      - .github/workflows/publish-dev.yml
      - .github/workflows/goreleaser-validate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goreleaser-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate snapshot build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # goreleaser uses `git describe` to derive the snapshot
          # version; needs full tag history.
          fetch-depth: 0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          # Single-target build is fast enough that the bundled
          # cache's post-step save costs more than a cold
          # `go mod download`.
          cache: false

      - name: Run GoReleaser snapshot build
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          # Same v2 line as release.yml so the snapshot validates
          # against the same goreleaser version a real release uses.
          version: "~> v2"
          # `build` (not `release`) so --single-target is accepted;
          # release-only steps (archive / docker / checksums) are
          # validated post-merge by publish-dev.yml.
          args: build --snapshot --clean --single-target
