name: GoReleaser snapshot validation

# Catches goreleaser config + cross-compile + image-build breakage at PR
# time, instead of at tag time when it would block a release. Snapshot mode
# implies --skip=publish, so this never pushes anything; the run is purely a
# dry-run of the release pipeline.
#
# Path-filtered: only runs when files that could plausibly break goreleaser
# change. Keeps the CI minute budget tight on day-to-day PRs.
on:
  pull_request:
    paths:
      - .goreleaser.yaml
      - deployments/Dockerfile
      - deployments/Dockerfile.goreleaser
      - go.mod
      - go.sum
      - .github/workflows/release.yml
      - .github/workflows/publish-dev.yml
      - .github/workflows/goreleaser-validate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goreleaser-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate snapshot build
    runs-on: [wave-rf-runners]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # goreleaser uses `git describe` to derive the snapshot version;
          # fetch-depth: 0 gives it tag access for that.
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"

      - name: Run GoReleaser in snapshot mode
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          # Pin to the v2 major line — same line as release.yml so a
          # snapshot run validates exactly what a real release will
          # invoke.
          version: "~> v2"
          # --snapshot: bypass tag validation; build with a dev version
          #   string. Implies --skip=publish, so nothing is pushed.
          # --clean: remove dist/ before building (idempotent across runs).
          args: release --snapshot --clean
