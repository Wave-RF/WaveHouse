name: Auto-label PR

# File-path-based labeling for PRs. Runs on open/push; the label set
# comes from .github/labeler.yml. Synchronized: labels follow the
# current changed-file set, so removing a change also removes its
# label.
#
# Triggered by `pull_request_target` so the workflow runs from the
# default branch with base-repo permissions — fork PRs get auto-labels
# too. (`pull_request` from the head ref is not used: it lacks
# `pull-requests: write` on forks, so the labeler step would fail and
# the dual-trigger duplicate run was wasted CI minutes.)

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels
    runs-on: [wave-rf-runners]
    steps:
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b # v6.0.1
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
