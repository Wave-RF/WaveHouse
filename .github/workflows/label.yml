name: Auto-label PR

# File-path-based labeling for PRs. Runs on open/push; the label set
# comes from .github/labeler.yml. Synchronized: labels follow the
# current changed-file set, so removing a change also removes its
# label.
#
# Dual-trigger: `pull_request` runs from the PR head branch (works
# on internal PRs); `pull_request_target` runs from the default
# branch with base-repo permissions (so fork PRs also get labels).
# `actions/labeler` is idempotent — same label set applied twice is
# a no-op, so the duplicate run on internal PRs is harmless.
#
# A follow-up PR can drop the `pull_request` trigger once we've
# confirmed `pull_request_target` is firing correctly. Closes #56.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b  # v6.0.1
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
