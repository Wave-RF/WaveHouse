name: Auto-label PR

# File-path-based labeling for PRs. Runs on open/push; the label set
# comes from .github/labeler.yml. Synchronized: labels follow the
# current changed-file set, so removing a change also removes its
# label.
#
# Uses `pull_request_target` so fork PRs also get labeled (trusted
# event, no checkout of fork code — just reads the PR metadata and
# writes labels).

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@634933edcd8ababfe52f92936142cc22ac488b1b  # v6.0.1
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
