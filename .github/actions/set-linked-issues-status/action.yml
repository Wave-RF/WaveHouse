name: Set linked-issue board Status
description: >-
  For the given PR, fetches its linked issues (up to the first 50, via
  GraphQL `closingIssuesReferences` — the `Closes #N` / `Fixes #N`
  graph) and upserts each onto the Task Board with the given target
  Status. Idempotent. Used by project-orchestrator.yml on every state
  transition that needs to mirror PR status to the linked issues.
  The 50-item limit is practical: our PRs close at most a handful of
  linked issues; we log a warning if the cap is hit.

inputs:
  project-token:
    description: PAT with project:write scope.
    required: true
  github-token:
    description: Token with read access to the PR and its linked issues. GITHUB_TOKEN is fine.
    required: true
  repo:
    description: "owner/repo"
    required: true
  pr-number:
    description: PR number to read linked issues from.
    required: true
  project-owner:
    description: Organization / user that owns the project.
    required: true
  project-number:
    description: Project number.
    required: true
  project-id:
    description: Global node ID of the project (PVT_*).
    required: true
  status-field-id:
    description: Global node ID of the Status field (PVTSSF_*).
    required: true
  status-option-id:
    description: Global node ID of the target Status option.
    required: true

runs:
  using: composite
  steps:
    - name: Iterate linked issues + upsert Status
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PROJECT_TOKEN: ${{ inputs.project-token }}
        REPO: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PROJECT_OWNER: ${{ inputs.project-owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        PROJECT_ID: ${{ inputs.project-id }}
        STATUS_FIELD_ID: ${{ inputs.status-field-id }}
        STATUS_OPTION_ID: ${{ inputs.status-option-id }}
      run: |
        set -euo pipefail

        owner="${REPO%%/*}"
        repo_name="${REPO##*/}"

        # One GraphQL round-trip for linked issues AND their project
        # items (Gemini flagged the earlier N+1 loop — the previous
        # version was one query per linked issue). closingIssuesReferences
        # captures the "Closes #N" / "Fixes #N" backlinks; cap at 50
        # per PR. Use PROJECT_TOKEN because GITHUB_TOKEN typically
        # lacks org-project read scope on private projects.
        linked_resp=$(GH_TOKEN="$PROJECT_TOKEN" gh api graphql \
          -f query='query($owner:String!, $repo:String!, $num:Int!) {
            repository(owner:$owner, name:$repo) {
              pullRequest(number:$num) {
                closingIssuesReferences(first: 50) {
                  totalCount
                  nodes {
                    number
                    projectItems(first: 20) {
                      nodes {
                        id
                        project { number }
                        fieldValueByName(name: "Status") {
                          ... on ProjectV2ItemFieldSingleSelectValue { optionId }
                        }
                      }
                    }
                  }
                }
              }
            }
          }' \
          -F owner="$owner" -F repo="$repo_name" -F num="$PR_NUMBER")

        total=$(echo "$linked_resp" | jq -r '.data.repository.pullRequest.closingIssuesReferences.totalCount')
        issue_count=$(echo "$linked_resp" | jq -r '.data.repository.pullRequest.closingIssuesReferences.nodes | length')

        if [ "$issue_count" = "0" ]; then
          echo "No linked issues for PR #$PR_NUMBER."
          exit 0
        fi

        if [ "$total" -gt 50 ]; then
          echo "::warning::PR #$PR_NUMBER links $total issues; only the first 50 will be updated. Bump the GraphQL page size in set-linked-issues-status if this is real."
        fi

        # Extract [{number, item_id or empty, current_option or empty}]
        # for this project. `map(select ...)[0]` picks the single
        # matching project item safely (won't emit multiple rows per
        # issue even if multiple project items somehow match).
        issue_rows=$(echo "$linked_resp" | jq -c --arg n "$PROJECT_NUMBER" '
          .data.repository.pullRequest.closingIssuesReferences.nodes[]
          | . as $node
          | ([.projectItems.nodes[] | select(.project.number == ($n | tonumber))] | .[0]) as $item
          | {
              number,
              item_id: ($item.id // ""),
              current_option: ($item.fieldValueByName.optionId // "")
            }')

        echo "$issue_rows" | while IFS= read -r row; do
          [ -z "$row" ] && continue
          issue_num=$(echo "$row" | jq -r '.number')
          issue_item=$(echo "$row" | jq -r '.item_id')
          current_option=$(echo "$row" | jq -r '.current_option')

          if [ -z "$issue_item" ]; then
            echo "Linked issue #$issue_num not on board — adding."
            issue_url="https://github.com/$REPO/issues/$issue_num"
            issue_item=$(GH_TOKEN="$PROJECT_TOKEN" gh project item-add "$PROJECT_NUMBER" \
              --owner "$PROJECT_OWNER" --url "$issue_url" --format json --jq '.id')
            current_option=""
          fi

          if [ "$current_option" != "$STATUS_OPTION_ID" ]; then
            echo "Issue #$issue_num Status: $current_option → $STATUS_OPTION_ID"
            GH_TOKEN="$PROJECT_TOKEN" gh project item-edit \
              --id "$issue_item" \
              --field-id "$STATUS_FIELD_ID" \
              --single-select-option-id "$STATUS_OPTION_ID" \
              --project-id "$PROJECT_ID" > /dev/null
          else
            echo "Issue #$issue_num Status already correct ($STATUS_OPTION_ID)."
          fi
        done
