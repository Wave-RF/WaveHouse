# Caches + toolchains for the CI jobs, in one place. Composite actions
# can't self-checkout, so the consuming job must checkout first. Each CI
# job opts into exactly the toolchains it needs via the inputs below.
#
# Caching is OWNED here end-to-end: no save steps in ci.yml. The Go, pnpm
# and Playwright caches (the large ones) SAVE ONLY ON `main`: there each is
# an `actions/cache` step, whose automatic post-job step saves on an
# exact-key miss. Everywhere else (pull requests, merge-queue refs,
# branches) the same cache is a restore-only `actions/cache/restore`, which
# reads `main`'s entry through the default-branch fallback and writes
# nothing. The reason is the repo's 10 GB cache cap: a run restores only
# from its own ref's scope and from `main`'s, so an entry a PR saves is
# unreadable to every other PR. A PR saved its own ~2.4 GB set whenever
# its key missed `main`'s (it changed go.mod/go.sum/pnpm-lock.yaml, or ran
# between a `main` bump and `main`'s save), and that set evicted `main`'s
# warm entries. Two consequences to know about:
#   - saves happen at the END of the job (post steps), and only when the
#     job SUCCEEDED — a failed run rebuilds from restore-keys next time
#     (except `gomod-v1` on `main`, which has none: see below);
#   - when several jobs miss the same key in one `main` run (e.g. a
#     lockfile bump), each saves; the backend keeps the first and the rest
#     log a benign "already exists" warning.
# A PR that changes a lockfile therefore restores the previous generation
# via restore-keys and fetches the delta on every push, for its whole life.
# golangci and Astro still save from any ref (see the inventory).
#
# The cache inventory (full architecture: .github/workflows/README.md):
#
#   1. Go modules, `gomod-v1-` key family, keyed on every go.mod + go.sum
#      and NOT partitioned per job — ~/go/pkg/mod is a pure function of
#      those files, so one entry serves every Go job, stored once rather
#      than per flavor (~1.6 GB on disk; 0.48 GB as a stored archive).
#      `main` starts each generation cold (no restore-keys), so superseded
#      module versions never accumulate in it.
#   2. Go build objects, `gobuild-v3-` key family, same key inputs,
#      partitioned by `go-cache-suffix`: the unit, integration and e2e jobs
#      compile with different flags (-race/-cover/-coverpkg/-tags), so a
#      shared entry would only ever be warm for whichever job saved it.
#      `restore-keys` keeps it warm across dependency bumps — avoids
#      setup-go's exact-key-only cache (actions/setup-go#357).
#   3. golangci-lint binary + analysis cache keyed on Makefile +
#      .golangci.yml. Analysis cache is the win (~10s warm vs ~90s).
#      Only the lint job needs it. Still saved from any ref: ~40 MB, and
#      only a PR that edits one of those two files mints one.
#   4. pnpm store (path resolved at runtime) keyed on the root
#      lockfile — the pnpm workspace projects share one lockfile +
#      store. Path is dynamic because pnpm's documented default
#      ~/.local/share/pnpm/store only applies when $HOME and the project
#      tree share a mount; on some runners it falls back to a
#      workspace-relative path. Hard-coding the default silently fails
#      the save with a Path Validation Error.
#   5. Playwright browser cache (~/.cache/ms-playwright) keyed on the
#      root lockfile. ~130 MB Chromium download otherwise re-fetched
#      every docs build (rehype-mermaid renders via headless Chrome).
#      Only the docs-build job needs it. See #132.
#   6. Astro content-collection cache (docs/.astro/) keyed on the root
#      lockfile + astro.config.mjs. Speeds up warm `astro check` /
#      `astro build` — unchanged content skips the parse + transform
#      pipeline. See #132. Saved from any ref, like golangci: a few KB.
name: Setup CI environment
description: Caches (restore everywhere, save on main) and toolchains for WaveHouse CI

inputs:
  go:
    description: "Set up the Go toolchain + the Go module/build cache"
    default: "true"
  go-cache-suffix:
    description: "REQUIRED when `go` is true (the default) — the action fails the job without one. Per-job Go build-cache partition, e.g. '-unit' (different jobs compile with different flags); an empty suffix yields a restore-key that prefix-matches every other flavor's entry, the cross-flavor restore the gomod-v1/gobuild-v3 split exists to avoid. A job that doesn't build Go passes `go: \"false\"` instead. The shared part of the cache is gomod-v1, which needs no suffix. The default stays empty because a composite action's `required:` isn't enforced by the runner — the guard step is."
    default: ""
  golangci:
    description: "Cache the golangci-lint binary + analysis cache (lint job only)"
    default: "false"
  node:
    description: "Set up pnpm + Node and cache the pnpm store"
    default: "true"
  playwright:
    description: "Cache the Playwright Chromium install (docs build only)"
    default: "false"
  astro:
    description: "Cache the Astro content collections (docs check/build)"
    default: "false"

# Exact-key cache-hit flags, for consumers that want to skip work on a
# warm cache (e.g. docs-build's pnpm-store prune). Saves are NOT gated on
# these from the outside — the nested actions/cache steps handle their
# own post-job saves. Only one of each save/restore pair runs, so the
# value is whichever of the two reported.
outputs:
  pnpm-cache-hit:
    description: "true if the exact-key pnpm store cache was restored"
    value: ${{ steps.pnpm-cache.outputs.cache-hit || steps.pnpm-cache-restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # Fail loudly on the one way to misuse the split. An empty suffix on a Go
    # job yields restore-key `gobuild-v3-<os>-go-`, which prefix-matches every
    # flavor's entry AND publish-dev's `-release` one — restoring
    # cross-compiled or wrong-flag objects nothing can hit, then saving an
    # extra entry against the sizing policy. Documented in the input
    # description and the README's "Adding a job" checklist; enforced here
    # so a new job can't inherit the empty default silently.
    - name: Require a go-cache-suffix on Go jobs
      if: ${{ inputs.go == 'true' && inputs.go-cache-suffix == '' }}
      shell: bash
      run: |
        echo "::error title=setup-env::go-cache-suffix is required when go is true (the default)." \
             "An empty suffix cross-matches every other flavor's build cache." \
             "If this job builds Go: pass a fresh suffix for new compile flags, or an" \
             "existing flavor's if it compiles identically. If it does not build Go:" \
             "pass go: \"false\". See .github/workflows/README.md."
        exit 1

    # The module cache is UNSUFFIXED on purpose. ~/go/pkg/mod is a pure
    # function of go.mod + go.sum — byte-identical for every compile
    # flavor — so folding it into the suffixed build cache stored that tree
    # five times over, once per -lint/-unit/-integration/-e2e-cov/-cov job:
    # five entries of ~0.9-1.2 GB stored each, ~5.2 GB per generation.
    # Against a 10 GB repo cap that means two live generations overflowed
    # it, and GitHub started LRU-evicting warm entries mid-run. Split out,
    # it is stored once and a generation measured 1.05 GB when #443 split it —
    # 0.48 module plus 0.57 across the five build entries (1.62 GiB on
    # 2026-10-07). Sizes here are
    # stored-archive bytes / 2^30, the unit the README's usage check
    # prints.
    #
    # All Go jobs miss this key together on a dependency bump and all try to
    # save; the backend keeps the first and the rest log a benign "already
    # exists" (same trade-off as the rest of the inventory, see header).
    #
    # `main` saves; every other ref restores only (see the header). `main`
    # also omits restore-keys: starting from nothing on a dependency bump
    # stores a clean generation, so superseded module versions don't
    # accumulate through a restore -> save chain. The cost is a cold
    # `go mod download` in each Go job (they run in parallel), per bump,
    # on `main` only.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.go == 'true' && github.ref == 'refs/heads/main' }}
      id: gomod-cache
      with:
        path: ~/go/pkg/mod
        # go.mod is in the key, not just go.sum, because the pinned
        # toolchain rides in ~/go/pkg/mod/golang.org/toolchain (no setup-go)
        # and go.sum records no entry for it. Raising go.mod's `go` directive
        # therefore changes which toolchain belongs in this cache while
        # leaving go.sum untouched — a go.sum-only key would exact-hit, and
        # because saves fire only on an exact-key MISS the freshly fetched
        # toolchain would never be saved, re-downloading on every run.
        key: gomod-v1-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.go == 'true' && github.ref != 'refs/heads/main' }}
      id: gomod-cache-restore
      with:
        path: ~/go/pkg/mod
        key: gomod-v1-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        # A stale generation is still worth restoring: a bump moves a handful
        # of modules, so most of the tree is reusable and `go mod download`
        # fetches only the delta.
        restore-keys: |
          gomod-v1-${{ runner.os }}-

    # Build objects only. These genuinely differ per job — unit,
    # integration and e2e compile with different flags
    # (-race/-cover/-coverpkg/-tags) — so a shared entry would only ever be
    # warm for whichever job saved it last.
    #
    # Key version (v3): bumped because the cache's CONTENTS changed shape
    # (~/go/pkg/mod moved out, above). Saves only happen on an exact-key
    # miss, so without a bump the old v2 entry would exact-hit forever and
    # the new, smaller content would never be saved.
    #
    # Save-on-`main` only, like gomod-v1. Go trims build-cache entries
    # unused for five days on its own (mtimes survive the archive), so the
    # restore -> save chain on `main` doesn't grow without bound.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.go == 'true' && github.ref == 'refs/heads/main' }}
      id: gobuild-cache
      with:
        path: ~/.cache/go-build
        # go.mod belongs in this key for its own reason, not just symmetry
        # with gomod-v1: the compiler's build ID feeds every action hash, so
        # a toolchain bump invalidates every object in here. Keyed on go.sum
        # alone that bump exact-hits, nothing restored is reusable, and the
        # freshly built objects are never saved (saves fire only on a miss)
        # — so every run recompiles cold *and* restores objects nothing can
        # hit, until some unrelated go.sum change rotates the key.
        #
        # The toolchain is pinned to go.mod's directive (see "Pin and verify
        # Go toolchain" below), so a runner image bumping its bundled Go can
        # no longer swap the compiler under these keys.
        key: gobuild-v3-${{ runner.os }}-go${{ inputs.go-cache-suffix }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        # Same-suffix only. The bare-prefix fallback the v2 key carried
        # existed to pick up the shared module cache from another job's
        # entry; that job is now gomod-v1's, and another flavor's build
        # objects are not reusable here.
        restore-keys: |
          gobuild-v3-${{ runner.os }}-go${{ inputs.go-cache-suffix }}-

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.go == 'true' && github.ref != 'refs/heads/main' }}
      id: gobuild-cache-restore
      with:
        path: ~/.cache/go-build
        key: gobuild-v3-${{ runner.os }}-go${{ inputs.go-cache-suffix }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        restore-keys: |
          gobuild-v3-${{ runner.os }}-go${{ inputs.go-cache-suffix }}-

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.golangci == 'true' }}
      id: golangci-cache
      with:
        path: |
          .bin
          ~/.cache/golangci-lint
        key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}
        restore-keys: |
          golangci-${{ runner.os }}-

    # No actions/setup-go: it spends ~9s/job downloading + extracting a
    # toolchain the runner can already provide. The image's preinstalled
    # `go` fetches go.mod's version whenever it differs, and the fetched
    # toolchain lands in ~/go/pkg/mod/golang.org/toolchain, i.e. inside
    # the module cache restored above, so warm runs download nothing. A
    # cold cache pays a one-time fetch from proxy.golang.org here — this
    # step makes that cost visible; `main`'s post-job save captures it, while
    # a PR that raises the go directive refetches it on every push.
    # GOTOOLCHAIN=auto would NOT pin go.mod's version: it means
    # max(image, go.mod), so an image that ships a newer Go would take over
    # and break golangci-lint. Export the pin for steps that run Go outside
    # `make` (which exports the same value from go.mod itself).
    # Trade-off: setup-go's inline problem matchers (PR-file annotations
    # on compile errors) are gone; the log output is unchanged.
    - name: Pin and verify Go toolchain
      if: ${{ inputs.go == 'true' }}
      shell: bash
      run: |
        GOTOOLCHAIN="$(awk '/^toolchain /{t=$2} /^go /{g="go"$2} END{print (t != "") ? t : g}' go.mod)"
        [[ "$GOTOOLCHAIN" =~ ^go[0-9]+\.[0-9]+\.[0-9]+ ]] || { echo "::error::go.mod needs a go line of the form x.y.z, got '$GOTOOLCHAIN'"; exit 1; }
        echo "GOTOOLCHAIN=$GOTOOLCHAIN" >> "$GITHUB_ENV"
        GOTOOLCHAIN="$GOTOOLCHAIN" go version

    # pnpm must install before its cache step so the store path can be
    # resolved from pnpm itself.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      if: ${{ inputs.node == 'true' }}
      with:
        version: "11.21.0"
        run_install: false

    - name: Resolve pnpm store directory
      if: ${{ inputs.node == 'true' }}
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.node == 'true' && github.ref == 'refs/heads/main' }}
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.node == 'true' && github.ref != 'refs/heads/main' }}
      id: pnpm-cache-restore
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    # Playwright Chromium binary (~130 MB) lives outside the pnpm store at
    # ~/.cache/ms-playwright. Without this cache, every docs build cold-pulls
    # Chromium during install-playwright-docs — adds 30-60s per run. Keyed
    # on the root pnpm-lock.yaml since that's where the Playwright version
    # is locked. Closes the Playwright half of #132.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.playwright == 'true' && github.ref == 'refs/heads/main' }}
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.playwright == 'true' && github.ref != 'refs/heads/main' }}
      id: playwright-cache-restore
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    # Astro's content-collection cache (docs/.astro/data-store.json plus
    # generated content types). Kept across runs so unchanged Markdown
    # / MDX content skips the parse + transform pipeline. Keyed on
    # lockfile + astro.config.mjs since plugin-chain changes invalidate
    # the cache shape; intra-key content changes are caught by Astro's
    # own file-hash check inside data-store.json. Closes the build-cache
    # half of #132.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: ${{ inputs.astro == 'true' }}
      id: astro-cache
      with:
        path: docs/.astro
        key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'docs/astro.config.mjs') }}
        restore-keys: |
          astro-${{ runner.os }}-

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: ${{ inputs.node == 'true' }}
      with:
        node-version-file: ".nvmrc"
