# Composite — restores caches + sets up Go/pnpm/Node for `make ci`.
# Used by ci.yml after an explicit actions/checkout (composite actions
# can't self-checkout).
#
# Restore-only. Saves live in ci.yml gated on the `*-cache-hit` outputs
# below so same-key re-pushes are no-ops.
#
# What's cached:
#
#   1. Go module + build cache (~/go/pkg/mod, ~/.cache/go-build) keyed
#      on every go.sum. `restore-keys` keeps the build cache warm across
#      go.sum changes — `go mod download` only fetches deltas, unchanged
#      packages stay compiled. Avoids setup-go's exact-key-only built-in
#      cache: https://github.com/actions/setup-go/issues/357.
#
#   2. golangci-lint binary + analysis cache (.bin, ~/.cache/golangci-lint)
#      keyed on Makefile + .golangci.yml. The analysis cache is the win
#      (~10s warm vs ~90s cold).
#
#   3. pnpm store (path resolved at runtime) keyed on all three lockfiles.
#      Three pnpm projects (clients/ts, tests/e2e/sdk, docs) share one
#      store via hardlinks.
#
#      Why dynamic path resolution: pnpm's documented default
#      ~/.local/share/pnpm/store applies only when $HOME and the
#      project tree live on the same mount. When they don't (some
#      container-based runners), pnpm falls back to a workspace-
#      relative path. Hard-coding the documented value produces silent
#      "Path Validation Error" warnings at save time and no cache.
#      `pnpm store path --silent` reports whichever path pnpm
#      actually uses.
name: Setup CI environment
description: Restores caches and sets up Go + pnpm + Node for WaveHouse CI

# Cache-hit flags surfaced to ci.yml so save steps can short-circuit
# when the exact key already exists upstream.
outputs:
  gobuild-cache-hit:
    description: "true if the exact-key Go module + build cache was restored"
    value: ${{ steps.gobuild-cache.outputs.cache-hit }}
  golangci-cache-hit:
    description: "true if the exact-key golangci-lint cache was restored"
    value: ${{ steps.golangci-cache.outputs.cache-hit }}
  pnpm-cache-hit:
    description: "true if the exact-key pnpm store cache was restored"
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}
  pnpm-store-path:
    description: "Absolute path to the pnpm content-addressable store on this runner — pass to actions/cache/save in the consuming workflow."
    value: ${{ steps.pnpm-store.outputs.path }}

runs:
  using: composite
  steps:
    # Go module + build cache. setup-go's bundled cache is exact-key-only
    # (every go.sum change is a hard miss); explicit cache + restore-keys
    # keeps the build cache warm across dep bumps.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: gobuild-cache
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: gobuild-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gobuild-${{ runner.os }}-go-

    # golangci-lint binary (.bin/) + analysis cache (~/.cache/golangci-lint).
    # Key on Makefile so a GOLANGCI_LINT_VERSION bump invalidates and the
    # binary file-target rule reinstalls the new version.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: golangci-cache
      with:
        path: |
          .bin
          ~/.cache/golangci-lint
        key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}
        restore-keys: |
          golangci-${{ runner.os }}-

    # `cache: false` because we manage the Go cache explicitly above.
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: false

    # pnpm install MUST come before the pnpm cache restore — we need
    # pnpm on PATH so the next step can ask it where its store actually
    # lives. See the header comment for the mount-layout reason.
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: "10.33.0"
        run_install: false

    - name: Resolve pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # pnpm store, shared across clients/ts, tests/e2e/sdk, and docs lockfiles.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('clients/ts/pnpm-lock.yaml', 'tests/e2e/sdk/pnpm-lock.yaml', 'docs/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
