# Composite action — restores the caches and tool toolchains that `make ci`
# expects on a fresh ARC pod. Used by .github/workflows/ci.yml after an
# explicit actions/checkout step (composite actions cannot self-checkout —
# the workflow has to land the repo first so this action's path resolves).
#
# Restore-only: this action only restores caches. Saving lives in the
# consuming workflow (ci.yml), gated on the `*-cache-hit` outputs below
# so a same-key re-push doesn't re-upload an identical 1.7 GB blob.
# Saves fire on every branch (PR + main) since cache traffic is LAN-
# routed — the first PR push per (go.sum + lockfile) tuple pays a
# ~30-60s tar+upload cost; everything after is hit-skipped.
#
# What's cached, and why each cache is keyed the way it is:
#
#   1. Go module + build cache (~/go/pkg/mod, ~/.cache/go-build) keyed on
#      every go.sum in the repo. `restore-keys` lets a changed go.sum still
#      restore the most recent gobuild-* cache, so `go mod download` only
#      fetches deltas and the build cache stays warm for unchanged packages.
#      Avoids setup-go's exact-key-only built-in cache; see
#      https://github.com/actions/setup-go/issues/357.
#
#   2. golangci-lint binary + analysis cache (.bin, ~/.cache/golangci-lint)
#      keyed on the Makefile (which pins GOLANGCI_LINT_VERSION) plus the
#      golangci config. The analysis cache is the actual perf win — a warm
#      lint runs in ~10s vs ~90s cold. The binary itself is cheap but
#      caching it skips the install-from-curl path on every run.
#
#   3. pnpm store (path resolved at runtime via `pnpm store path`) keyed
#      on all three lockfiles. The repo has three pnpm projects
#      (clients/ts/, tests/e2e/sdk/, and docs/) and a single store covers
#      all of them — pnpm hardlinks from the store into each project's
#      node_modules.
#
#      Why dynamic path resolution: pnpm's "documented" default
#      ~/.local/share/pnpm/store applies only when $HOME and the project
#      tree live on the same mount. On ARC pods $HOME and
#      $GITHUB_WORKSPACE are on different mounts, so pnpm falls back to
#      /home/runner/_work/.pnpm-store/v<N>/. Hard-coding the documented
#      path caused every run to log `Path Validation Error: Path(s) ...
#      do(es) not exist` at save time and silently skip the upload —
#      pnpm reinstalled cold every run. `pnpm store path --silent` reports
#      whichever path pnpm actually uses, so this composite is robust
#      across mount layouts and pnpm major bumps (the trailing v<N> moves
#      automatically).
#
# All three caches transparently route to the on-prem
# falcondev-oss/github-actions-cache-server (no GitHub size limit, sub-VM
# latency) via CUSTOM_ACTIONS_RESULTS_URL pre-set on the ARC pod. The
# runner image must be the falcondev fork (which binary-patches the
# runner agent to honor that env); unpatched upstream silently routes
# to GitHub's hosted cache over WAN. No workflow-side config needed.
name: Setup CI environment
description: Restores caches and sets up Go + pnpm + Node for WaveHouse CI

# Cache-hit flags surfaced to the consuming workflow. ci.yml uses these to
# skip the `actions/cache/save` step when the exact key was already in
# the cache server (no point re-uploading an identical 1.7 GB blob).
outputs:
  gobuild-cache-hit:
    description: "true if the exact-key Go module + build cache was restored"
    value: ${{ steps.gobuild-cache.outputs.cache-hit }}
  golangci-cache-hit:
    description: "true if the exact-key golangci-lint cache was restored"
    value: ${{ steps.golangci-cache.outputs.cache-hit }}
  pnpm-cache-hit:
    description: "true if the exact-key pnpm store cache was restored"
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}
  pnpm-store-path:
    description: "Absolute path to the pnpm content-addressable store on this runner — pass to actions/cache/save in the consuming workflow."
    value: ${{ steps.pnpm-store.outputs.path }}

runs:
  using: composite
  steps:
    # Go module + build cache. setup-go's bundled cache is exact-key-only
    # (every go.sum change is a hard miss); explicit cache + restore-keys
    # keeps the build cache warm across dep bumps.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: gobuild-cache
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: gobuild-${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          gobuild-${{ runner.os }}-go-

    # golangci-lint binary (.bin/) + analysis cache (~/.cache/golangci-lint).
    # Key on Makefile so a GOLANGCI_LINT_VERSION bump invalidates and the
    # binary file-target rule reinstalls the new version.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: golangci-cache
      with:
        path: |
          .bin
          ~/.cache/golangci-lint
        key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}
        restore-keys: |
          golangci-${{ runner.os }}-

    # `cache: false` because we manage the Go cache explicitly above.
    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: false

    # pnpm install MUST come before the pnpm cache restore — we need the
    # pnpm binary on PATH so the next step can ask pnpm where its store
    # actually lives. See the header comment for the mount-layout reason
    # this matters.
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      with:
        version: "10.33.0"
        run_install: false

    - name: Resolve pnpm store directory
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    # pnpm store, shared across clients/ts, tests/e2e/sdk, and docs lockfiles.
    - uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('clients/ts/pnpm-lock.yaml', 'tests/e2e/sdk/pnpm-lock.yaml', 'docs/pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"
