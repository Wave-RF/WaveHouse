# Caches + toolchains for the CI jobs, in one place. Composite actions
# can't self-checkout, so the consuming job must checkout first. Each CI
# job opts into exactly the toolchains it needs via the inputs below.
#
# Caching is OWNED here end-to-end: each cache is a nested `actions/cache`
# step, whose automatic post-job step saves on an exact-key miss — no save
# steps in ci.yml, so restore and save can never drift. Two consequences
# to know about (both accepted for the boilerplate this kills):
#   - saves happen at the END of the job (post steps), and only when the
#     job SUCCEEDED — a failed run rebuilds from restore-keys next time;
#   - when several jobs miss the same key in one run (e.g. a lockfile
#     bump), each saves; the backend keeps the first and the rest log a
#     benign "already exists" warning.
#
# The cache inventory (full architecture: .github/workflows/README.md):
#
#   1. Go modules, `gomod-v1-` key family, keyed on every go.mod + go.sum
#      and NOT partitioned per job — ~/go/pkg/mod is a pure function of
#      those files, so one entry serves every Go job, stored once rather
#      than per flavor (~1.6 GB on disk; 0.48 GB as a stored archive on a
#      cold save, drifting up as superseded module versions accumulate
#      through the restore -> save chain).
#   2. Go build objects, `gobuild-v3-` key family, same key inputs,
#      partitioned by `go-cache-suffix`: the unit, integration and e2e jobs
#      compile with different flags (-race/-cover/-coverpkg/-tags), so a
#      shared entry would only ever be warm for whichever job saved it.
#      `restore-keys` keeps it warm across dependency bumps — avoids
#      setup-go's exact-key-only cache (actions/setup-go#357).
#   3. golangci-lint binary + analysis cache keyed on Makefile +
#      .golangci.yml. Analysis cache is the win (~10s warm vs ~90s).
#      Only the lint job needs it.
#   4. pnpm store (path resolved at runtime) keyed on the root
#      lockfile — the pnpm workspace projects share one lockfile +
#      store. Path is dynamic because pnpm's documented default
#      ~/.local/share/pnpm/store only applies when $HOME and the project
#      tree share a mount; on some runners it falls back to a
#      workspace-relative path. Hard-coding the default silently fails
#      the save with a Path Validation Error.
#   5. Playwright browser cache (~/.cache/ms-playwright) keyed on the
#      root lockfile. ~130 MB Chromium download otherwise re-fetched
#      every docs build (rehype-mermaid renders via headless Chrome).
#      Only the docs-build job needs it. See #132.
#   6. Astro content-collection cache (docs/.astro/) keyed on the root
#      lockfile + astro.config.mjs. Speeds up warm `astro check` /
#      `astro build` — unchanged content skips the parse + transform
#      pipeline. See #132.
name: Setup CI environment
description: Caches (restore + automatic post-job save) and toolchains for WaveHouse CI

inputs:
  go:
    description: "Set up the Go toolchain + the Go module/build cache"
    default: "true"
  go-cache-suffix:
    description: "Per-job Go build-cache partition, e.g. '-unit' (different jobs compile with different flags). Always pass one for a Go job: an empty suffix yields a restore-key that prefix-matches every other flavor's entry, which is the cross-flavor restore the gomod-v1/gobuild-v3 split exists to avoid. The shared part of the cache is gomod-v1, which needs no suffix."
    default: ""
  golangci:
    description: "Cache the golangci-lint binary + analysis cache (lint job only)"
    default: "false"
  node:
    description: "Set up pnpm + Node and cache the pnpm store"
    default: "true"
  playwright:
    description: "Cache the Playwright Chromium install (docs build only)"
    default: "false"
  astro:
    description: "Cache the Astro content collections (docs check/build)"
    default: "false"

# Exact-key cache-hit flags, for consumers that want to skip work on a
# warm cache (e.g. docs-build's pnpm-store prune). Saves are NOT gated on
# these from the outside — the nested actions/cache steps handle their
# own post-job saves.
outputs:
  pnpm-cache-hit:
    description: "true if the exact-key pnpm store cache was restored"
    value: ${{ steps.pnpm-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    # The module cache is UNSUFFIXED on purpose. ~/go/pkg/mod is a pure
    # function of go.mod + go.sum — byte-identical for every compile flavor
    # — so folding it into the suffixed build cache stored that tree five
    # times over (once per -lint/-unit/-integration/-e2e-cov/-cov job) —
    # five entries of ~0.9-1.2 GB stored each, ~5.2 GB per generation.
    # Against
    # a 10 GB repo cap that means two live generations overflowed it, and
    # GitHub started LRU-evicting warm entries mid-run. Splitting it out
    # stores it once: a measured post-split generation is 1.05 GB
    # (0.48 module + 0.57 across the five build entries) (#443).
    # Sizes here are stored-archive bytes / 2^30, the same unit the
    # README's usage check prints.
    #
    # All Go jobs miss this key together on a dependency bump and all try to
    # save; the backend keeps the first and the rest log a benign "already
    # exists" (same trade-off as the rest of the inventory, see header).
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ inputs.go == 'true' }}
      id: gomod-cache
      with:
        path: ~/go/pkg/mod
        # go.mod is in the key, not just go.sum, because the GOTOOLCHAIN=auto
        # toolchain rides in ~/go/pkg/mod/golang.org/toolchain (no setup-go)
        # and go.sum records no entry for it. Raising go.mod's `go` directive
        # therefore changes which toolchain belongs in this cache while
        # leaving go.sum untouched — a go.sum-only key would exact-hit, and
        # because saves fire only on an exact-key MISS the freshly fetched
        # toolchain would never be saved, re-downloading on every run.
        key: gomod-v1-${{ runner.os }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        # A stale generation is still worth restoring: a bump moves a handful
        # of modules, so most of the tree is reusable and `go mod download`
        # fetches only the delta.
        restore-keys: |
          gomod-v1-${{ runner.os }}-

    # Build objects only. These genuinely differ per job — unit,
    # integration and e2e compile with different flags
    # (-race/-cover/-coverpkg/-tags) — so a shared entry would only ever be
    # warm for whichever job saved it last.
    #
    # Key version (v3): bumped because the cache's CONTENTS changed shape
    # (~/go/pkg/mod moved out, above). Saves only happen on an exact-key
    # miss, so without a bump the old v2 entry would exact-hit forever and
    # the new, smaller content would never be saved.
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ inputs.go == 'true' }}
      id: gobuild-cache
      with:
        path: ~/.cache/go-build
        # go.mod belongs in this key for its own reason, not just symmetry
        # with gomod-v1: the compiler's build ID feeds every action hash, so
        # a toolchain bump invalidates every object in here. Keyed on go.sum
        # alone that bump exact-hits, nothing restored is reusable, and the
        # freshly built objects are never saved (saves fire only on a miss)
        # — so every run recompiles cold *and* restores objects nothing can
        # hit, until some unrelated go.sum change rotates the key.
        #
        # This closes the go-directive half only. GOTOOLCHAIN=auto uses the
        # LOCAL toolchain whenever it satisfies the directive, so a runner
        # image bumping its bundled Go swaps the compiler with neither
        # go.mod nor go.sum moving — same pathology, past both keys. If you
        # see unexplained cold build caches, that's the cause: rotate the
        # v<N> prefix to force a save.
        key: gobuild-v3-${{ runner.os }}-go${{ inputs.go-cache-suffix }}-${{ hashFiles('**/go.mod', '**/go.sum') }}
        # Same-suffix only. The bare-prefix fallback the v2 key carried
        # existed to pick up the shared module cache from another job's
        # entry; that job is now gomod-v1's, and another flavor's build
        # objects are not reusable here.
        restore-keys: |
          gobuild-v3-${{ runner.os }}-go${{ inputs.go-cache-suffix }}-

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ inputs.golangci == 'true' }}
      id: golangci-cache
      with:
        path: |
          .bin
          ~/.cache/golangci-lint
        key: golangci-${{ runner.os }}-${{ hashFiles('Makefile', '.golangci.yml') }}
        restore-keys: |
          golangci-${{ runner.os }}-

    # No actions/setup-go: it spends ~9s/job downloading + extracting a
    # toolchain the runner can already provide. The image's preinstalled
    # `go` + GOTOOLCHAIN=auto (the Go ≥1.21 default) resolve go.mod's
    # pinned version exactly — and the auto-fetched toolchain lands in
    # ~/go/pkg/mod/golang.org/toolchain, i.e. inside the module cache
    # restored above, so warm runs download nothing. A cold cache (first
    # run after a key rotation, when the image go is older than go.mod's
    # pin) pays a one-time toolchain fetch from proxy.golang.org here —
    # this step makes that cost visible and the post-job save captures it.
    # Trade-off: setup-go's inline problem matchers (PR-file annotations
    # on compile errors) are gone; the log output is unchanged.
    - name: Verify Go resolves go.mod's toolchain
      if: ${{ inputs.go == 'true' }}
      shell: bash
      run: go version

    # pnpm must install before its cache step so the store path can be
    # resolved from pnpm itself.
    - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      if: ${{ inputs.node == 'true' }}
      with:
        version: "11.1.3"
        run_install: false

    - name: Resolve pnpm store directory
      if: ${{ inputs.node == 'true' }}
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ inputs.node == 'true' }}
      id: pnpm-cache
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-

    # Playwright Chromium binary (~130 MB) lives outside the pnpm store at
    # ~/.cache/ms-playwright. Without this cache, every docs build cold-pulls
    # Chromium during install-playwright-docs — adds 30-60s per run. Keyed
    # on the root pnpm-lock.yaml since that's where the Playwright version
    # is locked. Closes the Playwright half of #132.
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ inputs.playwright == 'true' }}
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    # Astro's content-collection cache (docs/.astro/data-store.json plus
    # generated content types). Kept across runs so unchanged Markdown
    # / MDX content skips the parse + transform pipeline. Keyed on
    # lockfile + astro.config.mjs since plugin-chain changes invalidate
    # the cache shape; intra-key content changes are caught by Astro's
    # own file-hash check inside data-store.json. Closes the build-cache
    # half of #132.
    - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      if: ${{ inputs.astro == 'true' }}
      id: astro-cache
      with:
        path: docs/.astro
        key: astro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'docs/astro.config.mjs') }}
        restore-keys: |
          astro-${{ runner.os }}-

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      if: ${{ inputs.node == 'true' }}
      with:
        node-version-file: ".nvmrc"
