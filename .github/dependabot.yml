version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR per Monday for all action bumps. With SHA pinning,
      # ungrouped meant 5+ PRs each Monday that all needed identical
      # review (verify SHA, verify version comment, merge).
      actions-deps:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Docs site (npm)
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    groups:
      docs-deps:
        patterns: ["*"]
    commit-message:
      prefix: "docs"

  # TypeScript SDK
  - package-ecosystem: npm
    directory: /clients/ts
    schedule:
      interval: weekly
      day: monday
    groups:
      sdk-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps(sdk)"

  # E2E test harness (runs against the SDK)
  - package-ecosystem: npm
    directory: /tests/e2e/sdk
    schedule:
      interval: weekly
      day: monday
    groups:
      e2e-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps(tests)"
