version: 2
updates:
  # Go modules
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-deps:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  # GitHub Actions
  #
  # TWO directories, not one. `directory: /` only reaches .github/workflows/ —
  # it does NOT descend into .github/actions/*/action.yml. The setup-env
  # composite action therefore went untracked, and its pins went stale against
  # upstream, since Dependabot tracked the workflows but not the action.
  # Adding a composite action under .github/actions/ means adding its
  # directory below; nothing else catches the drift.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-env
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR per Monday for all action bumps. With SHA pinning,
      # ungrouped meant 5+ PRs each Monday that all needed identical
      # review (verify SHA, verify version comment, merge).
      actions-deps:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # TypeScript packages (npm via pnpm workspace).
  #
  # ONE entry at the workspace ROOT — deliberately NOT one per member
  # directory. The repo has a single root pnpm-lock.yaml (the #190
  # consolidation) covering docs and tests/e2e/sdk. Dependabot
  # only updates a lockfile co-located with the manifest it is pointed at,
  # so the old per-member configs (directory: /docs,
  # /tests/e2e/sdk) edited the member package.json but left the root
  # lockfile untouched. Every such PR then failed CI's `pnpm install
  # --frozen-lockfile` with ERR_PNPM_OUTDATED_LOCKFILE (e.g. #211, #337),
  # and no rebase could fix it because a rebase never regenerates the
  # lockfile. Pointing at / lets Dependabot read pnpm-workspace.yaml, walk
  # every workspace member, and update the single root lockfile. As a bonus
  # it also brings the root package.json's own devDeps (biome, markdownlint)
  # under Dependabot — the per-member configs never covered them.
  #
  # One combined npm PR per Monday (grouped, like go-deps / actions-deps).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-deps:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native port) stays held back until docs + e2e are
      # checked on it (#984). Its first reason, the SDK build, moved out.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The docs site pins the PUBLISHED @wavehouse/sdk (docs/package.json) so a
      # server wire change cannot reach the deployed landing page before the
      # demo backend speaks it (#568). Raising that range is a release decision
      # that belongs with the backend upgrade and the `latest` tag — not a Monday
      # dependency sweep, whose reviewer is not thinking about which wire the
      # demo backend serves. Patch updates inside the pinned 0.x line already
      # satisfy the caret, so nothing routine is lost; for a 0.x package it is
      # the MINOR bump that crosses the wire boundary. The e2e suite's exact pin
      # (tests/e2e/sdk) follows the same rule: a patch bump may be proposed there.
      - dependency-name: "@wavehouse/sdk"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    # Dependabot knows nothing of pnpm's minimumReleaseAge (7 days, see
    # pnpm-workspace.yaml), so its lockfiles failed our install. Matching the
    # window means a release younger than it is not proposed at all. Cooldown
    # covers the dependency being bumped, not the transitive packages
    # Dependabot re-resolves, so a lockfile can still trip pnpm's policy check;
    # that remainder stays open in #441. Security updates bypass cooldown.
    # Not applied to gomod or github-actions: neither has an install-time age
    # gate to stay consistent with.
    # The excludes mirror minimumReleaseAgeExclude: pnpm installs those at once.
    cooldown:
      default-days: 7
      exclude:
        - "@wave-rf/*"
        - "@wavehouse/*"
    commit-message:
      prefix: "deps"
