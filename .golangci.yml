version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - gocritic
    - revive
    - ineffassign
    - misspell
    - bodyclose
    - noctx
    - errorlint
    - tparallel
    # new additions below, commented out to fix for now, double commented as not working or big fixes
    # - canonicalheader
    # # - clickhouselint  # installed when `golangci-lint help linters` but not make version
    # - containedctx
    # - contextcheck
    # - copyloopvar
    # - cyclop
    # - dupl
    - dupword
    - durationcheck
    # # - err113  # want this, but a lot to change...
    # - errchkjson
    - exhaustive
    - exptostd
    - fatcontext
    # # - forcetypeassert
    # - funlen
    - gocheckcompilerdirectives
    # - gochecknoglobals
    # - gocognit
    # - goconst
    # - gocyclo
    # - goprintffuncname
    - iface
    # - intrange
    # - maintidx
    - makezero
    # # - mnd
    # # - modernize
    # - nestif
    # - nilerr
    - noctx
    - nolintlint
    # - perfsprint
    # - prealloc
    - promlinter
    # - sloglint
    - spancheck
    # - testifylint
    # - thelper
    - unconvert
    # - unparam
    # - usestdlibvars
    - usetesting
    - wastedassign
  settings:
    revive:
      # Opt in to specific rules only; skip the default set's noisy
      # doc-comment and unused-parameter rules for internal packages.
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id

formatters:
  enable:
    - gofumpt
    - goimports

run:
  timeout: 5m
