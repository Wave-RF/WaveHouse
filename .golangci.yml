version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - gocritic
    - revive
    - ineffassign
    - misspell
    - bodyclose
    - noctx
    - errorlint
    - tparallel

formatters:
  enable:
    - gofumpt
    - goimports

run:
  timeout: 5m
