# Coverage threshold spec. Consumed by `scripts/cov` (the Go helper
# behind `make cov` / `make test-<suite>`) which renders profiles and
# gates each suite against the numbers below. Schema is compatible with
# `vladopajic/go-test-coverage`'s config format, but we don't run that
# action anymore. Publishing (#133) lives in CI's `coverage` job — a
# README badge from the merged Go total (`cov badge`) and PR comments
# via GitHub Code Quality; see .github/workflows/README.md "Coverage
# publishing". This file is the gate; publishing reads from it.

# Merged-suites profile produced by `scripts/cov merge` at the end of
# `make ci`. Contains unit + integration + e2e coverage stitched
# together, so `threshold.total` below applies to the *project-wide*
# coverage number — unit alone covers only `./internal/...` packages
# exercised by `*_test.go` files (below total threshold); merged
# coverage adds integration- and e2e-only paths and clears it. The
# nested-module suites (go-sdk) are gated separately and never merged
# in — see suites.go-sdk.
profile: tmp/coverage/total/coverage.txt
local-prefix: github.com/Wave-RF/WaveHouse

# Project-wide minimum, enforced by `make cov` against the merged
# profile. Per-suite minima live in the `suites` block below and are
# enforced by `make test-<suite>` against their per-suite profiles.
threshold:
  total: 80

# Per-suite coverage thresholds (custom key — read by scripts/coverage.sh,
# silently ignored by go-test-coverage). Single source of truth for what
# percentage each suite must hit before it counts as passing.
#
suites:
  unit: 80
  integration: 20
  e2e: 60
  # Go SDK (clients/go) — a NESTED module, so its coverage is rendered and
  # gated on its own and is deliberately NOT part of the merged Go total
  # above. Nothing from clients/go can leak into that total: the root
  # module can't see a nested one (`go list ./...` at the repo root never
  # yields clients/go), so the unit/integration/e2e `-coverpkg=./...` never
  # reaches these files — which is also why there is no `^clients/go/`
  # entry under exclude.paths; there is nothing to exclude.
  # Measured 82.7% when this floor was set (SDK package 88.6%,
  # cmd/wavehouse-codegen 55.8%). 75 leaves the same order of headroom
  # unit's 80 leaves under its real ~91%. Raise it as the codegen
  # command's tests fill in.
  go-sdk: 75
  # TypeScript SDK suites — see scripts/cov for the merge / render logic.
  # vitest gates via --coverage.thresholds.statements; the merged ts-total
  # is gated by `cov ts-merge` against the value below. Tune ts-total
  # upward as the e2e suite picks up more SDK paths.
  ts-unit: 40  # vitest unit tests (clients/ts/src/**)
  ts-e2e: 40    # vitest e2e tests covering SDK source (informational until you set a real floor)
  ts-total: 50 # merged ts-unit + ts-e2e (gated by `make cov`). Start at ts-unit's
               # number; raise this once the e2e suite is collecting coverage and you
               # know what the realistic merged floor looks like.

exclude:
  # Global excludes apply to every suite render AND to the merged total.
  # Use for paths that aren't meaningful coverage anywhere.
  paths:
    # internal/testutil/ contains shared test helpers (mocks, JWT builders,
    # HTTP assertions). It is imported only from *_test.go files, never from
    # production code, so there's nothing meaningful to cover.
    - ^internal/testutil/
    - ^tests/
    # scripts/ holds Go helpers (cov, orchestrator) that drive the build but
    # aren't part of the shipped binary; they show up in `-coverpkg=./...`
    # but never get exercised by tests.
    - ^scripts/

  # Per-suite excludes layer on top of `paths` but only for that suite's
  # render. Crucially, they do NOT apply to the merged total — so a file
  # excluded from `unit` here still counts toward the project-wide gate
  # via whichever suite(s) actually do cover it. See scripts/cov/main.go
  # config.excludesFor for the wiring.
  per-suite:
    unit:
      # cmd/wavehouse/main.go is the binary entry point — 400+ lines of
      # service wiring that's only meaningfully exercised by the e2e suite
      # (which runs bin/wavehouse-cov against a real ClickHouse + NATS).
      # Excluding from `unit` keeps that gate from being dragged down by
      # 0% coverage on an untestable wiring file. The merged total still
      # counts e2e's coverage of this file. health.go in the same package
      # IS unit-testable (httptest server + WH_SERVER_PORT) and stays in
      # coverage everywhere — see issue #140 for the deferred refactor
      # that would shrink main.go enough to drop this exclude entirely.
      - ^cmd/wavehouse/main\.go$
    e2e:
      # internal/settings and the validate CLI entry point are currently
      # reachable only via `wavehouse validate`, which the e2e suite
      # (server-focused) never runs — they sat at 0% and dragged the e2e
      # gate below its floor. The unit suite covers both thoroughly, and
      # per-suite excludes don't touch the merged total, so nothing is
      # hidden project-wide. Drop these excludes once the settings
      # directory is wired into the running server and e2e can exercise
      # them.
      - ^internal/settings/
      - ^cmd/wavehouse/validate\.go$
